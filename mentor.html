<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WonderNest · Exhibition mentor</title>
<meta name="robots" content="noindex">
<link rel="icon" href="favicon.png">
<link rel="apple-touch-icon" href="favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{--navy:#1f4fb0;--blue:#3b82e0;--sun:#f5b921;--teal:#0f766e;--muted:#667085;--line:#e3e9f3;--bg:#f5f8fd}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:"DM Sans",system-ui,sans-serif;background:linear-gradient(180deg,#eef5ff,#fffaea);min-height:100vh;color:#1d2433;font-size:15.5px;line-height:1.55}
  button{font:inherit;cursor:pointer;border:0;background:none}
  input,textarea{font:inherit;width:100%;border:1.5px solid var(--line);border-radius:12px;padding:11px 12px;background:#fff}
  input:focus,textarea:focus{outline:2px solid #bcd3f7;border-color:var(--blue)}
  textarea{min-height:70px;resize:vertical}
  .wrap{max-width:860px;margin:auto;padding:18px}
  .head{background:linear-gradient(135deg,#1f4fb0,#3b82e0);color:#fff;border-radius:0 0 28px 28px;padding:20px 22px 24px}
  .head .in{max-width:860px;margin:auto;display:flex;gap:14px;align-items:center}
  .head img{width:58px}.head h1{font-family:"Fredoka";font-size:26px;line-height:1.2}.head p{opacity:.9;font-weight:500}
  .head .out{margin-left:auto;background:rgba(255,255,255,.18);color:#fff;border-radius:10px;padding:7px 12px;font-weight:700;font-size:13px}
  .card{background:#fff;border:1px solid var(--line);border-radius:20px;padding:18px 20px;margin-bottom:14px}
  .card h2{font-family:"Fredoka";color:var(--navy);font-size:19px;margin-bottom:8px}
  .lbl{font-weight:700;color:var(--muted);font-size:13px;text-transform:uppercase;letter-spacing:.06em;margin:12px 0 4px}
  .btn{background:var(--navy);color:#fff;border-radius:12px;padding:12px 18px;font-weight:700;font-size:16px}
  .btn.wide{width:100%}.btn.ghost{background:#fff;color:var(--navy);border:1.5px solid #c9d8f3}
  .chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}.chip{background:#fff;border:1.5px solid var(--line);border-radius:999px;padding:8px 14px;font-weight:700;color:var(--navy)}.chip.on{background:var(--navy);color:#fff;border-color:var(--navy)}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .item{background:var(--bg);border-radius:12px;padding:10px 12px;margin-top:8px}
  .item small{color:var(--muted);font-weight:700}
  .tag{display:inline-block;background:#eaf3ff;color:#1f4fb0;border-radius:999px;padding:2px 9px;font-size:12px;font-weight:700;margin:2px 4px 2px 0}
  .note{border-left:5px solid var(--teal);background:#effaf6}
  .tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}.tabs button{padding:7px 12px;border-radius:10px;font-weight:700;color:var(--muted);background:var(--bg)}.tabs button.on{background:var(--teal);color:#fff}
  .center{text-align:center}.hint{color:var(--muted);font-size:13.5px}
  .code{font:700 24px ui-monospace,Menlo,monospace;letter-spacing:3px;text-align:center;text-transform:uppercase}
  .msg{min-height:22px;margin-top:8px;font-weight:700;color:#b54708;text-align:center}
  .ok{background:#e6f5ec;color:#1d7a4e;border-radius:12px;padding:10px;font-weight:700;margin-top:8px;text-align:center}
  details summary{cursor:pointer;font-weight:700;color:var(--navy);margin-top:10px}
  img.ph{max-width:100%;border-radius:12px;margin-top:6px}
  .foot{text-align:center;color:var(--muted);font-size:12px;padding:20px}
  @media (max-width:700px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div id="app"><div class="wrap center" style="padding-top:80px"><img src="wondernest-mark.png" style="width:80px"><p>Loading…</p></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = "https://zmncqutjtgwxlvrdgwiq.supabase.co";
const SUPABASE_KEY = "sb_publishable_blNQT3mGUzNadaRARkRpew_dq-tmD4J";
const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, { auth: { persistSession: false, storageKey: "wondernest-mentor" } });
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const day = d => new Date(d).toLocaleDateString("en-GB", { day: "numeric", month: "short", year: "numeric" });
const store = { get(){ try{ return sessionStorage.getItem("wn_mentor") || ""; }catch(e){ return ""; } }, set(v){ try{ v ? sessionStorage.setItem("wn_mentor", v) : sessionStorage.removeItem("wn_mentor"); }catch(e){} } };
let code = "", V = null, gi = 0, kid = null, ktab = "journal", sent = false;
const ACT = { "participation": "🤝 Participation", "advocacy": "📣 Advocacy", "social-justice": "⚖️ Social justice", "social-entrepreneurship": "💡 Social entrepreneurship", "lifestyle": "🌿 Lifestyle choices" };

function codeScreen(msg){
  $("#app").innerHTML = `<div class="head"><div class="in"><img src="wondernest-mark.png" alt=""><div><h1>Exhibition mentor</h1><p>WonderNest · PYP Exhibition</p></div></div></div>
  <div class="wrap" style="max-width:460px;padding-top:28px"><div class="card center"><div style="font-size:42px">🧑‍🏫</div><h2>Welcome, mentor!</h2><p class="hint" style="margin-bottom:12px">Type the code the school gave you to see your group's work.</p>
    <input id="mc" class="code" maxlength="12" autocomplete="off" spellcheck="false" placeholder="ABCD1234" value="${esc(code)}">
    <button class="btn wide" style="margin-top:12px" onclick="open_($('#mc').value)">Open my groups →</button><div class="msg">${esc(msg || "")}</div>
    <p class="hint" style="margin-top:6px">🔒 Please keep your code private. It gives access to students' journals.</p></div>
    <p class="center"><a href="./" style="color:var(--navy);font-weight:700">← WonderNest home</a></p></div>`;
  const i = $("#mc"); i.focus(); i.onkeydown = e => { if(e.key === "Enter") open_(i.value); };
}
async function open_(c){
  code = String(c || "").trim().toUpperCase(); if(!code) return codeScreen("Please type your code.");
  const m = $(".msg"); if(m) m.textContent = "Opening…";
  const r = await db.rpc("mentor_view", { p_code: code });
  if(r.error) return codeScreen("WonderNest can't connect right now. Please try again later.");
  if(!r.data){ store.set(""); return codeScreen("That code didn't work. Please check it with the school."); }
  V = r.data; store.set(code); if(gi >= (V.groups || []).length) gi = 0; draw();
}
function draw(){
  if(V.closed) return $("#app").innerHTML = header() + `<div class="wrap"><div class="card center"><div style="font-size:44px">🔒</div><h2>The exhibition is closed right now</h2><p class="hint">The school has closed the exhibition journals. Your code will work again when they reopen.</p></div></div>`;
  const G = V.groups || [];
  if(!G.length) return $("#app").innerHTML = header() + `<div class="wrap"><div class="card center"><div style="font-size:44px">👥</div><h2>No group yet</h2><p class="hint">The school hasn't linked you to a group yet. Please check back soon.</p></div></div>`;
  const g = G[gi], d = g.data || {}, notes = g.notes || [];
  const chips = G.length > 1 ? `<div class="chips">${G.map((x, i) => `<button class="chip ${i === gi ? "on" : ""}" onclick="gi=${i};kid=null;sent=false;draw()">${esc(x.name)}</button>`).join("")}</div>` : "";
  const list = (arr, f) => (arr || []).filter(Boolean).map(f).join("");
  $("#app").innerHTML = header() + `<div class="wrap">${chips}
    <div class="card"><h2>👥 ${esc(g.name)}</h2><p>${(g.members || []).map(k => `<span class="tag">${esc(k.first_name)}</span>`).join("") || `<span class="hint">No students yet</span>`}</p></div>
    <div class="grid">
      <div class="card"><h2>🌍 Issue and central idea</h2>${d.issue ? `<p>${esc(d.issue)}</p>` : `<p class="hint">Not written yet.</p>`}
        ${(d.sdgs || []).length ? `<p style="margin-top:6px">${d.sdgs.map(n => `<span class="tag">SDG ${esc(n)}</span>`).join("")}</p>` : ""}
        ${d.centralIdea ? `<div class="lbl">Central idea</div><p style="font-weight:700;color:var(--navy)">${esc(d.centralIdea)}</p>` : ""}
        ${(d.lines || []).filter(Boolean).length ? `<div class="lbl">Lines of inquiry</div>${list(d.lines, l => `<p>🔎 ${esc(l)}</p>`)}` : ""}</div>
      <div class="card"><h2>❓ Research questions</h2>${list(d.questions, q => `<div class="item">${esc(typeof q === "string" ? q : q.text)}${q.by ? ` <small>· ${esc(q.by)}</small>` : ""}</div>`) || `<p class="hint">No questions yet.</p>`}</div>
      <div class="card"><h2>📚 Sources</h2>${list(d.sources, s => `<div class="item"><b>${esc(s.title)}</b>${s.where ? ` · ${esc(s.where)}` : ""}${s.learned ? `<br>${esc(s.learned)}` : ""}</div>`) || `<p class="hint">No sources yet.</p>`}</div>
      <div class="card"><h2>🌱 Action</h2>${(d.action || {}).type ? `<p><span class="tag">${esc(ACT[d.action.type] || d.action.type)}</span></p>` : ""}${(d.action || {}).plan ? `<p>${esc(d.action.plan)}</p>` : `<p class="hint">No action plan yet.</p>`}
        ${list((d.action || {}).steps, s => `<p>${s.done ? "✅" : "⬜"} ${esc(s.text)}</p>`)}
        ${(d.booth || {}).title ? `<div class="lbl">Booth</div><p><b>🏛️ ${esc(d.booth.title)}</b>${d.booth.text ? `<br>${esc(d.booth.text)}` : ""}</p>` : ""}</div>
    </div>
    <div class="card"><h2>💬 Notes for the group</h2><p class="hint">Students see your notes in their journal and group space. Their teachers see them too.</p>
      ${sent ? `<div class="ok">✓ Your note was sent. Thank you!</div>` : ""}
      <div class="lbl">What did we talk about?</div><textarea id="nT" placeholder="Today we looked at…"></textarea>
      <div class="lbl">Next steps for the group</div><textarea id="nN" style="min-height:56px" placeholder="Before we meet again, try to…"></textarea>
      <details><summary>⭐⭐🪄 Add two stars and a wish (optional)</summary><div class="lbl">⭐ A star</div><input id="nS1"><div class="lbl">⭐ Another star</div><input id="nS2"><div class="lbl">🪄 A wish</div><input id="nW"></details>
      <button class="btn wide" style="margin-top:12px" onclick="sendNote('${g.id}')">Send to the group 💌</button>
      ${notes.map(n => `<div class="item note"><small>${day(n.created_at)}</small><br>${esc(n.content.talked || "")}${n.content.next ? `<br>➡️ ${esc(n.content.next)}` : ""}${n.content.star1 ? `<br>⭐ ${esc(n.content.star1)}` : ""}${n.content.star2 ? `<br>⭐ ${esc(n.content.star2)}` : ""}${n.content.wish ? `<br>🪄 ${esc(n.content.wish)}` : ""}</div>`).join("")}</div>
    <div class="card"><h2>📓 Students' journals</h2><p class="hint" style="margin-bottom:8px">Choose a student to read their process journal, research notes, questions and passions.</p>
      <div class="chips">${(g.members || []).map(k => `<button class="chip ${kid === k.id ? "on" : ""}" onclick="kid='${k.id}';draw()">${esc(k.first_name)}</button>`).join("")}</div>
      ${kid ? kidView(g) : ""}</div></div><div class="foot">WonderNest · ThinkNest Education</div>`;
}
function header(){ return `<div class="head"><div class="in"><img src="wondernest-mark.png" alt=""><div><h1>Hello, ${esc(V.name)}!</h1><p>PYP Exhibition mentor${V.class_name ? " · " + esc(V.class_name) : ""}</p></div><button class="out" onclick="store.set('');V=null;code='';codeScreen()">Sign out</button></div></div>`; }
function kidView(g){
  const E = (g.entries || []).filter(e => e.student_id === kid), k = (g.members || []).find(x => x.id === kid) || {};
  const tabs = [["journal","📓 Process journal"],["research","🔎 Research notes"],["wonder","❓ Questions"],["passion","❤️ Passions"],["exh_mentor","🧑‍🏫 Their meeting notes"]];
  const L = E.filter(e => e.kind === ktab);
  const body = e => ktab === "journal" ? `${e.content.mood ? esc(e.content.mood) + " " : ""}${e.content.skill ? `<span class="tag">${esc(e.content.skill)}</span>` : ""}<br>${esc(e.content.text || "")}${e.content.photo ? `<br><img class="ph" src="${e.content.photo}" alt="">` : ""}`
    : ktab === "research" ? `<b>${esc(e.title || "")}</b><br>${esc(e.content.text || "").replace(/\n/g, "<br>")}${e.content.source ? `<br><small>📎 ${esc(e.content.source)}</small>` : ""}`
    : ktab === "wonder" ? esc(e.content.text || "")
    : ktab === "passion" ? `❤️ ${esc((e.content.passions || []).join(", "))}${(e.content.issues || []).map(i => `<br>🌍 ${esc(i.text)}`).join("")}${e.content.why ? `<br><i>${esc(e.content.why)}</i>` : ""}`
    : `${e.content.mentor ? `<b>${esc(e.content.mentor)}</b><br>` : ""}${esc(e.content.talked || "")}${e.content.next ? `<br>➡️ ${esc(e.content.next)}` : ""}`;
  return `<div class="tabs" style="margin-top:6px">${tabs.map(([t, l]) => `<button class="${ktab === t ? "on" : ""}" onclick="ktab='${t}';draw()">${l} (${E.filter(e => e.kind === t).length})</button>`).join("")}</div>
    ${L.map(e => `<div class="item"><small>${day(e.created_at)}</small><br>${body(e)}</div>`).join("") || `<p class="hint">${esc(k.first_name || "")} hasn't added anything here yet.</p>`}`;
}
async function sendNote(gid){
  const v = id => ($("#" + id) || {}).value ? $("#" + id).value.trim() : "";
  const c = { talked: v("nT"), next: v("nN"), star1: v("nS1"), star2: v("nS2"), wish: v("nW") };
  if(!c.talked && !c.next && !c.star1) return alert("Please write a note first 😊");
  const r = await db.rpc("mentor_note", { p_code: code, p_group: gid, p_content: c });
  if(r.error || !r.data || !r.data.ok) return alert(r.data && r.data.reason === "limit" ? "Lots of notes today! Please try again tomorrow." : r.data && r.data.reason === "closed" ? "The exhibition is closed right now." : "Sorry, that didn't send. Please try again.");
  sent = true; await open_(code); setTimeout(() => { sent = false; }, 4000);
}
(async () => {
  const p = new URLSearchParams(location.search).get("m");
  if(p){ history.replaceState(null, "", location.pathname); return open_(p); }
  const s = store.get(); if(s) return open_(s);
  codeScreen();
})();
</script>
</body>
</html>
