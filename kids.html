<script>
/* Softer, more natural reading voice: prefer the best female voices on each device */
(function(){
  if(!window.speechSynthesis) return;
  const EN = ["Samantha (Enhanced)","Samantha (Premium)","Serena (Premium)","Serena (Enhanced)","Kate (Enhanced)","Stephanie (Enhanced)","Martha (Enhanced)","Karen (Enhanced)","Moira (Enhanced)",
    "Microsoft Sonia Online (Natural)","Microsoft Libby Online (Natural)","Microsoft Aria Online (Natural)","Microsoft Jenny Online (Natural)","Google UK English Female","Samantha","Serena","Kate","Stephanie","Martha","Karen","Moira","Tessa","Microsoft Hazel","Microsoft Zira"];
  const AR = ["Majed (Enhanced)","Laila","Mariam","Microsoft Salma Online (Natural)","Microsoft Fatima Online (Natural)","Microsoft Zariyah Online (Natural)","Microsoft Hoda","Google العربية"];
  let voices = []; const load = () => { voices = speechSynthesis.getVoices() || []; };
  load(); speechSynthesis.addEventListener && speechSynthesis.addEventListener("voiceschanged", load);
  const pick = lang => {
    const ar = String(lang || "").startsWith("ar"), list = ar ? AR : EN;
    for(const n of list){ const v = voices.find(x => x.name === n) || voices.find(x => x.name.startsWith(n)); if(v) return v; }
    const pref = voices.filter(x => x.lang && x.lang.toLowerCase().startsWith(ar ? "ar" : "en"));
    return pref.find(x => /natural|enhanced|premium|female/i.test(x.name)) || pref.find(x => /en-GB/i.test(x.lang)) || pref[0] || null;
  };
  const orig = speechSynthesis.speak.bind(speechSynthesis);
  try{
    speechSynthesis.speak = function(u){
      if(!voices.length) load();
      if(!u.voice){ const v = pick(u.lang || "en-GB"); if(v){ u.voice = v; u.lang = v.lang; } }
      if(!u.rate || u.rate >= .95) u.rate = .9;
      u.pitch = 1.08; u.volume = .95;
      orig(u);
    };
  }catch(e){}
})();
</script>
<script>
// WonderNest: true SDG stories. Each story was checked against the sources listed. Retold in WonderNest's own words for children.
const SDG_STORIES = [
{id:"hannah-taylor", sdgs:[1,10], title:"Hannah and the Ladybug Jars", who:"Hannah Taylor", place:"Winnipeg, Canada", when:"2004", ages:"5+", emoji:"🐞",
 story:"On a freezing winter day in Winnipeg, Canada, five-year-old Hannah saw a man looking for food in a rubbish bin. She could not stop thinking about him. \"Why doesn't he have a home?\" she asked her mum. \"If everyone shared what they had, would that help?\"\n\nHannah decided to do something. In Grade 1 she talked to her teacher, and her class raised money for a local shelter. Hannah painted jars with ladybugs, because ladybugs mean good luck, and asked people to fill them with coins.\n\nWhen she was eight, Hannah started the Ladybug Foundation. It helps charities give food, shelter and care to people who have no home. Hannah gave speeches all over Canada. Her big message was simple: people who are homeless are just like you and me, and they need us to care.",
 questions:["What did Hannah notice, and how did it make her feel?","Why do you think Hannah chose a ladybug?","Who in our community might need care, and how could we find out?"],
 actions:["Find out about a charity near your school that helps people in need.","Make a kindness jar for a cause your class cares about."],
 sources:[["The Ladybug Foundation story (NFB film, Hannah's Story)","https://www.nfb.ca/film/hannahs_story"],["McGill Reporter","https://reporter.mcgill.ca/hannah-taylor-wrong-turn-sets-her-on-the-right-path/"]]},

{id:"ryan-hreljac", sdgs:[6,3], title:"Ryan's Well", who:"Ryan Hreljac", place:"Kemptville, Canada and Angolo, Uganda", when:"1998", ages:"5+", emoji:"💧",
 story:"In January 1998, six-year-old Ryan was sitting in his Grade 1 class in Canada. His teacher explained that many children in the world get sick because they do not have clean water to drink. Some walk a very long way every day to fetch it.\n\nRyan was shocked. He did extra jobs at home to earn money, because he thought 70 dollars would be enough to build a well. It wasn't! A well cost much more. But Ryan did not give up. He talked to classes and clubs and anyone who would listen.\n\nIn 1999, Ryan's first well was built at Angolo Primary School in Uganda. In 2001, with his family's help, he started Ryan's Well Foundation. It has helped build hundreds of wells and toilets in many countries. Ryan's motto: little kids really can have big ideas.",
 questions:["How far do you walk to get a drink of water? How would life change if you had to walk for hours?","Ryan's first plan did not work. What did he do next?","Why is clean water connected to health and to going to school?"],
 actions:["Measure how much water your class uses in one day, and find ways to save some.","Make posters about why clean water matters."],
 sources:[["Ryan's Well Foundation: Our Story","https://ryanswell.ca/about-us/our-story"],["World of Children: Ryan Hreljac","https://worldofchildren.org/honoree/ryan-hreljac/"]]},

{id:"william-kamkwamba", sdgs:[7,9,4], title:"The Boy Who Harnessed the Wind", who:"William Kamkwamba", place:"Masitala, Malawi", when:"2002", ages:"7+", emoji:"🌬️",
 story:"William lived in a farming village in Malawi. When he was a teenager, a terrible drought made the crops fail, and his family could not pay for school. William had to stop going.\n\nBut William loved science. He went to a small library and found a book called Using Energy. It had a picture of a windmill. William thought: if the wind can turn a windmill, maybe it can make electricity!\n\nHe collected scrap metal, an old bicycle, plastic pipes and tractor parts from a scrapyard. People laughed and called him crazy. William kept building. At 14, his windmill made enough electricity to light his family's house. Later, another windmill pumped water for the crops.\n\nWilliam went on to study at university and helps young people in his village to become inventors too.",
 questions:["What problem was William trying to solve?","How did a library book change William's life?","What materials could you reuse to build something useful?"],
 actions:["Design and build a model windmill from recycled materials.","Find out where the electricity in your school comes from."],
 sources:[["Britannica: William Kamkwamba","https://www.britannica.com/biography/William-Kamkwamba"],["TED: William Kamkwamba","https://www.ted.com/speakers/william_kamkwamba"]]},

{id:"kehkashan-basu", sdgs:[13,15,16], title:"Kehkashan's Green Hope", who:"Kehkashan Basu", place:"Dubai, United Arab Emirates", when:"2012", ages:"7+", emoji:"🌱",
 story:"Kehkashan was born in Dubai on 5 June, which is World Environment Day. Maybe that is why she has always cared about the planet!\n\nKehkashan began campaigning for the environment when she was very young. When she was 12, she started Green Hope, a group where children and young people learn about the environment and take action. They clean beaches, collect waste and plant trees, and they teach other children about the Sustainable Development Goals.\n\nGreen Hope grew and grew. Soon it was active in many countries with more than a thousand young volunteers. In 2016, when she was 16 and a student in Dubai, Kehkashan won the International Children's Peace Prize. Her message: children should have a say in how we protect the planet, because it is their future.",
 questions:["Why does Kehkashan think children should help make decisions about the planet?","What problems did Green Hope work on?","What could children in our school take care of?"],
 actions:["Organise a clean-up of your playground or a nearby beach or park.","Write a letter to your school leaders with one idea to help the environment."],
 sources:[["The National: UAE teen wins International Children's Peace Prize","https://www.thenationalnews.com/uae-teen-wins-international-children-s-peace-prize-1.227530"],["Gulf News","https://gulfnews.com/going-out/society/schoolgirl-from-uae-wins-childrens-peace-prize-1.1938880"]]},

{id:"felix-finkbeiner", sdgs:[13,15], title:"Felix and a Million Trees", who:"Felix Finkbeiner", place:"Bavaria, Germany", when:"2007", ages:"5+", emoji:"🌳",
 story:"When Felix was nine years old, his teacher asked the class to give a presentation about climate change. While he was researching, Felix read about Wangari Maathai, a woman in Kenya who had helped plant millions of trees. Trees, he learned, take in carbon dioxide and help to cool our planet.\n\nAt the end of his talk, Felix said: \"Let's plant one million trees in every country of the world!\" He had no idea how many a million trees was!\n\nA few weeks later, on 28 March 2007, Felix and his classmates planted a crab apple tree in front of their school. Other schools joined in. Within three years, children in Germany had planted one million trees. Felix's idea became Plant-for-the-Planet, which helps children around the world plant trees and speak up for the climate. At 13, Felix spoke at the United Nations.",
 questions:["Whose story inspired Felix?","Why are trees important for our planet?","Felix's goal sounded impossible. Why did it work?"],
 actions:["Plant a tree or seeds at school and look after them.","Count the trees around your school and make a map."],
 sources:[["UNEP: Felix Finkbeiner","https://www.unep.org/blogs/2019-09/climate-leadership-inspires/felix-finkbeiner"],["Plant-for-the-Planet: Felix Finkbeiner","https://www.plant-for-the-planet.org/felix-finkbeiner/"]]},
{id:"katie-stagliano", sdgs:[2,12], title:"Katie's Giant Cabbage", who:"Katie Stagliano", place:"Summerville, South Carolina, USA", when:"2008", ages:"5+", emoji:"🥬",
 story:"When Katie was nine and in Grade 3, her teacher gave every child a tiny cabbage seedling to plant at home. Katie planted hers in the garden and looked after it every single day. It grew, and grew, and grew, until it weighed about 18 kilograms (40 pounds)! Most cabbages weigh only one or two kilograms.\n\nKatie knew her cabbage was special. She gave it to a soup kitchen, a place that serves free meals to people who need them. The cooks made it into a meal with ham and rice, and Katie helped to serve it. Her one cabbage helped feed 275 people!\n\nKatie thought: \"If one cabbage can feed this many people, imagine how many a whole garden could feed!\" So she started Katie's Krops. Today children all over the USA grow vegetable gardens and give the food to people who are hungry.",
 questions:["Why did Katie's cabbage grow so big?","What did Katie notice when she visited the soup kitchen?","What could we grow at school, and who could we share it with?"],
 actions:["Plant a class vegetable garden, even in pots.","Find out about food banks or community fridges near you."],
 sources:[["girlshealth.gov: Katie's Krops","https://girlshealth.gov/node/7315"],["College of Charleston: Meet Katie Stagliano","https://today.cofc.edu/2019/01/17/meet-katie-stagliano-cabbage-patch-kid/"]]},

{id:"bye-bye-plastic-bags", sdgs:[12,14,17], title:"Bye Bye Plastic Bags", who:"Melati and Isabel Wijsen", place:"Bali, Indonesia", when:"2013", ages:"6+", emoji:"🛍️",
 story:"Melati and Isabel are sisters who grew up on the beautiful island of Bali. But everywhere they looked they saw plastic bags: on the beaches, in the sea and even in the rice fields. They learned that only a tiny number of plastic bags in Bali were recycled.\n\nAt school they had been learning about people who changed the world. \"Why wait until we are older?\" they asked. In 2013, when they were just 12 and 10, they started a campaign called Bye Bye Plastic Bags.\n\nThey organised beach clean-ups, gave talks in schools and asked shops to stop handing out plastic bags. They collected 100,000 signatures asking for a ban, and kept meeting the leaders of Bali. Bali's governor promised to work towards a ban. Their campaign has spread to teams of young people in many countries around the world.",
 questions:["What problem did the sisters see?","Why do you think 100,000 signatures made leaders listen?","How many plastic bags does your family use in a week?"],
 actions:["Count the single-use plastic in your classroom bin for one week.","Make reusable bags from old T-shirts."],
 sources:[["NPR: How teenage sisters pushed Bali to say bye-bye to plastic bags","https://www.npr.org/688168838"],["CNN: The teenagers getting plastic bags banned in Bali","https://amp.cnn.com/cnn/2017/08/16/asia/melati-isabel-wijsen-bali"]]},

{id:"kelvin-doe", sdgs:[9,7,4], title:"DJ Focus and the Scrap-Metal Radio", who:"Kelvin Doe", place:"Freetown, Sierra Leone", when:"2009", ages:"7+", emoji:"📻",
 story:"In Kelvin's neighbourhood in Freetown, Sierra Leone, the electricity hardly ever came on. Sometimes it worked only once a week. Batteries cost too much for most families.\n\nKelvin was about 13 and he loved taking things apart. He searched rubbish bins for scrap metal, old wires and broken electronics. Teaching himself, he built his own battery to make lights for his neighbours. Then he built a generator, and then a radio transmitter!\n\nWith it, Kelvin started his own community radio station. He called himself DJ Focus, because, he said, if you focus you can make an invention work. He played music and shared local news, and his friends helped too.\n\nKelvin entered a competition for young inventors in Sierra Leone. Soon after, at 15, he was invited to visit MIT in the USA, one of the most famous science universities in the world.",
 questions:["What problems did Kelvin solve for his neighbourhood?","Why do you think Kelvin called himself DJ Focus?","What could you invent from things other people throw away?"],
 actions:["Set up an inventors' table with recycled materials.","Make a class radio show or podcast about your community."],
 sources:[["MIT Alumni: From Sierra Leone, Focus Comes to MIT","https://alum.mit.edu/node/1292"],["The World (PRX): DJ Focus at MIT","https://theworld.org/stories/2013/08/15/dj-focus-becomes-youngest-visiting-practitioner-mit"]]},

{id:"shubham-banerjee", sdgs:[10,4,9], title:"Shubham's Braille Printer", who:"Shubham Banerjee", place:"Santa Clara, California, USA", when:"2014", ages:"7+", emoji:"⠃",
 story:"One day, 12-year-old Shubham saw a leaflet asking for donations for people who are blind. He asked his parents a simple question: \"How do blind people read?\" They told him to look it up.\n\nShubham learned about Braille, a way of reading with your fingers by feeling patterns of raised dots. He also learned that Braille printers cost 2,000 dollars or more. Many people could not afford one.\n\nShubham decided to build a cheaper one for his school science fair, using his favourite toy: a Lego robotics kit! He built and broke seven different models, working late into the night. Finally his printer, called Braigo (Braille + Lego), printed its first letter. It cost about 350 dollars to make.\n\nShubham shared his design for free so anyone could build one, and went on to start a company to make low-cost Braille printers.",
 questions:["What question started Shubham's invention?","Why does the cost of something matter for fairness?","Shubham failed six times. What helped him keep going?"],
 actions:["Learn the Braille alphabet and make a Braille message with glue dots.","Check how easy your school is to use for someone who cannot see."],
 sources:[["NPR: Boy builds Braille printer out of Lego","https://www.npr.org/transcripts/281113200"],["Live Science: 12-year-old invents Braille printer","https://www.livescience.com/43455-lego-braille-printer.html"]]},

{id:"babar-ali", sdgs:[4,1], title:"The School Under the Guava Tree", who:"Babar Ali", place:"Murshidabad, West Bengal, India", when:"2002", ages:"6+", emoji:"📚",
 story:"Babar was lucky: he went to school. But on his way home, he saw many children from his village who could not go, because their families were poor and they had to work, collecting rubbish to sell.\n\nWhen he was nine, Babar had an idea. Every afternoon after his own lessons, he would teach them! He started in the backyard of his family's home, under a guava tree, with eight children, including his sister. He collected broken pieces of chalk to use, and he was the headmaster, teacher and helper all at once.\n\nMore and more children came. His school was named Ananda Shiksha Niketan, which means Home of Joyful Learning. When Babar was 16, the BBC called him the youngest headmaster in the world. Today his free school teaches hundreds of children.",
 questions:["What did Babar notice on his way home from school?","Why do you think he called it the Home of Joyful Learning?","What is something you know well enough to teach someone else?"],
 actions:["Run a 'learning swap' where children teach each other a skill.","Collect books or stationery for a school or library that needs them."],
 sources:[["TED: Babar Ali, Education for all","https://www.ted.com/talks/babar_ali_education_for_all"],["Onmanorama: How the world's youngest headmaster began at 9","https://www.onmanorama.com/lifestyle/news/2018/10/01/how-world-youngest-headmaster-began-his-crusade-at-9.html"]]},

{id:"moziah-bridges", sdgs:[8], title:"Mo's Bows", who:"Moziah \"Mo\" Bridges", place:"Memphis, Tennessee, USA", when:"2011", ages:"5+", emoji:"🎀",
 story:"Mo loved dressing up, even on the playground! When he was nine, he wanted a cool bow tie, but the ones in the shops were boring or too expensive.\n\nSo Mo asked his grandmother, who had been a seamstress, to teach him to sew. Using her leftover scraps of fabric, he made colourful bow ties at the kitchen table. Family and friends wanted them too, and Mo started a business called Mo's Bows.\n\nIt was hard work. Mo, his mum and his grandmother stitched every tie by hand. Mo learned about prices, customers and saying yes to good chances. He even appeared on a TV show for business people, where a famous businessman offered to be his mentor instead of just giving him money.\n\nMo's Bows grew into a real company that gives people jobs. Mo's motto: \"If you look good, you feel good.\"",
 questions:["What problem did Mo want to solve?","Who helped Mo, and what did he learn from them?","What makes a job a good job?"],
 actions:["Plan a small class business or market stall and decide what to do with the money.","Interview a family member about their job."],
 sources:[["Inc.: How this 16-year-old founder built a bow tie business","https://www.inc.com/emily-canal/how-this-young-entrepreneur-got-the-best-deal-on-shark-tank-with-daymond-john.html"],["NPR: 15-year-old CEO of Mo's Bows","https://www.npr.org/2017/07/21/538608499/15-year-old-ceo-of-mos-bows-enters-licensing-deal-with-nba"]]},
{id:"boyan-slat", sdgs:[14,12,9], title:"More Plastic Than Fish", who:"Boyan Slat", place:"Delft, the Netherlands", when:"2011", ages:"6+", emoji:"🌊",
 story:"When Boyan was 16, he went scuba diving on holiday in Greece. He hoped to see beautiful fish. Instead, he saw more plastic bags than fish!\n\nBoyan came up out of the water with one question: \"Why can't we just clean this up?\" Many grown-ups said it was impossible, because the ocean is so big and the plastic keeps moving.\n\nFor a school science project, Boyan spent half a year studying the problem. He had an idea: instead of chasing the rubbish around the ocean, why not let the ocean currents carry the plastic to a cleaning machine that waits in one place?\n\nIn 2012 he shared his idea in a TEDx talk. At first, hardly anyone noticed. Then the video was shared millions of times. Boyan started The Ocean Cleanup, a team of engineers and scientists who build systems to collect plastic from the ocean and from rivers before it reaches the sea.",
 questions:["What question did Boyan ask?","Why did people think his idea was impossible?","Where does the plastic in the ocean come from?"],
 actions:["Track how much plastic your class throws away and set a goal to reduce it.","Design a model that uses moving water to collect floating rubbish."],
 sources:[["The Ocean Cleanup: How it all began","https://theoceancleanup.com/milestones/how-it-all-began/"],["UNEP Champions of the Earth: Boyan Slat","https://www.unep.org/championsofearth/laureates/2014/boyan-slat"]]},

{id:"wangari-maathai", sdgs:[15,5,13], title:"Wangari, Mother of Trees", who:"Wangari Maathai", place:"Kenya", when:"1977", ages:"5+", emoji:"🌳",
 story:"Wangari grew up in Kenya surrounded by green hills, streams and fig trees. As a grown-up she became a scientist, the first woman in East and Central Africa to earn a doctorate degree.\n\nWangari listened to women in the countryside. They told her that the streams were drying up, there was not enough firewood, and the soil was washing away. The trees had been cut down.\n\nWangari had a simple answer: plant trees! On World Environment Day in 1977, she and a group of women planted seven trees in Nairobi. That was the start of the Green Belt Movement. Wangari taught women to collect seeds, grow seedlings and plant them, and they were paid for every tree that survived.\n\nThe movement spread, and tens of millions of trees were planted. In 2004 Wangari became the first African woman to win the Nobel Peace Prize.",
 questions:["What problems did the women tell Wangari about?","How do trees help people, animals and the soil?","Why do you think planting trees was linked to peace?"],
 actions:["Grow seedlings from seeds in class and give them to families.","Find out which trees are native to your country."],
 sources:[["NobelPrize.org: Wangari Maathai","https://www.nobelprize.org/prizes/peace/2004/maathai/"],["Britannica: Wangari Maathai","https://www.britannica.com/biography/Wangari-Maathai"]]},

{id:"montreal-protocol", sdgs:[17,13,3], title:"How the World Fixed the Sky", who:"Every country in the world", place:"Worldwide", when:"1987", ages:"7+", emoji:"🌍",
 story:"High above us is the ozone layer, an invisible shield of gas that protects living things from the sun's harmful rays. In the 1980s, scientists discovered something worrying: there was a hole in the ozone layer!\n\nThey found out why. Some chemicals used in fridges, air conditioners and spray cans were floating up into the sky and destroying the ozone.\n\nIn 1987, countries met and signed an agreement called the Montreal Protocol. They promised to stop using the harmful chemicals and to find safer ones. Over the years, every single country in the world signed it. It was the first UN agreement that every country agreed to!\n\nIt worked. Almost all of the harmful chemicals have now stopped being used, and scientists say the ozone layer is slowly healing. It should recover by around the middle of this century. It shows what can happen when the whole world works together.",
 questions:["What is the ozone layer, and why do we need it?","Why was it important that every country joined in?","What other problem could the world solve by working together?"],
 actions:["Hold a class 'summit' where groups agree on one rule to help the planet.","Make a poster for World Ozone Day on 16 September."],
 sources:[["UNEP Ozone Secretariat","https://ozone.unep.org/node/13112"],["UNEP: Thirty years on, the Montreal Protocol","https://www.unep.org/news-and-stories/story/thirty-years-what-montreal-protocol-doing-protect-ozone"]]},

{id:"masdar-city", sdgs:[11,7,13], title:"A Cool City in the Desert", who:"Masdar City", place:"Abu Dhabi, United Arab Emirates", when:"2006", ages:"6+", emoji:"🏙️",
 story:"Abu Dhabi is one of the hottest places on Earth. How can people build a city there that uses less energy and stays cool? That was the big question behind Masdar City, which began in 2006.\n\nThe designers looked at clever ideas from the past. Old towns in the Gulf had narrow, shady streets and wind towers called barjeel that catch breezes. So Masdar City has narrow streets that point towards the cooling winds, buildings close together to make shade, and a 45-metre-tall modern wind tower.\n\nThe streets can feel several degrees cooler than the open desert. Solar panels on roofs and in a nearby solar farm make clean electricity. The city is designed for walking and cycling, and its buildings use materials that save energy and water.\n\nMasdar City is still growing, and people from around the world visit to learn from it.",
 questions:["What ideas from the past did the designers use?","Why is it important for cities in hot places to stay cool without using lots of energy?","What would you change in your neighbourhood to make it better for people and the planet?"],
 actions:["Measure the temperature in sunny and shady places around school.","Design your own model of an eco-friendly street."],
 sources:[["Masdar City: Sustainable design","https://masdarcity.ae/sustainable-urban-development/sustainable-design"],["AramcoWorld: Chasing Zero","https://www.aramcoworld.com/articles/2017/chasing-zero"]]},

{id:"malala-yousafzai", sdgs:[4,5,16], title:"Malala's Voice for Girls' Education", who:"Malala Yousafzai", place:"Swat Valley, Pakistan", when:"2009", ages:"8+", emoji:"✏️",
 story:"Malala grew up in the beautiful Swat Valley in Pakistan. She loved school, and her father ran a school too. But when she was 11, a group that had taken control of the area said that girls were not allowed to go to school.\n\nMalala did not stay quiet. She wrote a diary for the BBC, under a different name, about how much she wanted to learn. Later she spoke on television and in newspapers: every girl has the right to an education.\n\nWhen she was 15, people who wanted to stop her attacked her on her school bus. She was badly hurt, but she recovered, and she kept speaking out even more strongly.\n\nIn 2014, when she was 17, Malala became the youngest person ever to win the Nobel Peace Prize. She heard the news at school, and finished her school day first! Her Malala Fund helps girls around the world go to school.",
 questions:["Why did Malala think education was worth speaking up for?","What does it mean to have a right?","How can we make sure everyone in our school has a fair chance to learn?"],
 actions:["Write a class charter about everyone's right to learn.","Find out how many children in the world do not go to school, and share it."],
 sources:[["NobelPrize.org: Malala Yousafzai biography","https://www.nobelprize.org/prizes/peace/2014/yousafzai/biographical/"],["History.com: Malala wins the Nobel Prize","https://www.history.com/this-day-in-history/malala-wins-nobel-prize"]]},

{id:"gitanjali-rao", sdgs:[3,6,9], title:"Gitanjali's Water Detective", who:"Gitanjali Rao", place:"Colorado, USA", when:"2017", ages:"7+", emoji:"🔬",
 story:"When Gitanjali was about 10, she heard about a town called Flint in the USA. The water coming out of people's taps there had become unsafe, because it contained lead, a metal that can make people ill. Testing water was slow and needed a laboratory.\n\nGitanjali thought: what if families could test their own water, quickly, at home? She read about tiny tubes made of carbon that can sense different chemicals, and she began to design a small device.\n\nShe entered a science challenge for young people and worked with a scientist mentor for three months. Her invention, called Tethys after the Greek goddess of fresh water, sends its results to a phone.\n\nIn 2017, when she was 11, Gitanjali was named America's Top Young Scientist. Later she started workshops to help other children become problem solvers too.",
 questions:["What problem was Gitanjali trying to solve?","Why did she need a mentor?","Where does the water in your school come from, and how do we know it is safe?"],
 actions:["Investigate how water is cleaned in your city.","Pick a problem in school and follow Gitanjali's steps: observe, brainstorm, research, build, share."],
 sources:[["NPR: 11-year-old girl invents lead-detecting device","https://www.npr.org/sections/thetwo-way/2017/10/20/559071028/troubled-by-flint-water-crisis-11-year-old-girl-invents-lead-detecting-device"],["Good Morning America (ABC)","https://www.goodmorningamerica.com/news/story/11-year-girl-inspired-flint-water-crisis-creates-50559884"]]},
];
</script>

  body{font-family:"Nunito","Avenir Next","Segoe UI",Arial,sans-serif;color:var(--ink);background:linear-gradient(160deg,#ffe9b8 0%,#ffd6c9 45%,#d9e6ff 100%);min-height:100vh}
  button{font:inherit;border:0;background:none;cursor:pointer;color:inherit}
  textarea,input{font:inherit;color:var(--ink)}
  .wrap{max-width:720px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}
  .head{background:var(--navy);color:#fff;padding:22px 20px 18px;border-radius:0 0 28px 28px;position:relative}
  .head .hi{font-size:14px;opacity:.85}
  .head h1{font-size:26px;font-weight:900;margin-top:2px}
  .head .unit{margin-top:12px;background:rgba(255,255,255,.14);border-radius:14px;padding:10px 12px;font-size:14px;line-height:1.4}
  .head .unit b{display:block;font-size:15px}
  .head .back{position:absolute;top:18px;right:16px;background:rgba(255,255,255,.18);color:#fff;border-radius:999px;padding:7px 13px;font-size:13px;font-weight:800}
  .body{padding:18px 16px 30px;flex:1}
  .card{background:#fff;border-radius:22px;padding:16px;margin-bottom:14px;box-shadow:0 2px 0 rgba(0,0,0,.04)}
  .card h2{font-size:17px;font-weight:900;color:var(--navy);margin-bottom:10px;display:flex;justify-content:space-between;align-items:center}
  .center{text-align:center}
  .big-title{font-size:30px;font-weight:900;color:var(--navy);text-align:center;margin:40px 0 6px}
  .sub{text-align:center;color:#55607a;font-size:16px;margin-bottom:22px}
  .code-input{width:100%;max-width:340px;display:block;margin:0 auto 14px;text-align:center;font-size:34px;font-weight:900;letter-spacing:8px;text-transform:uppercase;border:3px solid #fff;border-radius:20px;padding:16px;background:#fff}
  .btn{background:var(--blue);color:#fff;border-radius:18px;padding:15px 22px;font-weight:900;font-size:18px;display:inline-flex;gap:8px;align-items:center;justify-content:center}
  .btn.wide{width:100%}
  .btn.leaf{background:var(--leaf)} .btn.coral{background:var(--coral)} .btn.ghost{background:#fff;color:var(--blue)}
  .btn:disabled{opacity:.5}
  .names{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px}
  .name{background:#fff;border-radius:20px;padding:20px 10px;font-size:20px;font-weight:900;color:var(--navy);box-shadow:0 3px 0 rgba(20,50,92,.1)}
  .pics{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;max-width:440px;margin:0 auto}
  .pic{background:#fff;border-radius:22px;font-size:44px;aspect-ratio:1;display:grid;place-items:center;box-shadow:0 3px 0 rgba(20,50,92,.1)}
  .pic:active{transform:scale(.94)}
  .shake{animation:shake .4s}
  @keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
  .msg{text-align:center;font-weight:800;color:#b42318;margin:14px 0;min-height:22px}
  .wall{display:flex;flex-wrap:wrap;gap:10px}
  .bub{padding:11px 14px;border-radius:20px;font-size:15px;font-weight:800;line-height:1.35;max-width:100%}
  .empty{color:var(--muted);text-align:center;padding:12px;font-size:15px}
  .mic-row{display:flex;gap:12px;align-items:center}
  .mic{width:58px;height:58px;border-radius:50%;background:var(--coral);display:grid;place-items:center;font-size:26px;flex-shrink:0;box-shadow:0 0 0 7px #ffe1d8}
  .mic.on{animation:pulse 1s infinite}
  @keyframes pulse{50%{box-shadow:0 0 0 14px #ffd1c4}}
  textarea{width:100%;border:2.5px solid #f0e6d0;border-radius:18px;padding:13px 14px;font-size:17px;line-height:1.5;min-height:90px;background:var(--cream);resize:vertical}
  textarea:focus,input:focus{outline:none;border-color:var(--blue)}
  input.title{width:100%;border:2.5px solid #f0e6d0;border-radius:16px;padding:12px 14px;font-size:18px;font-weight:800;background:var(--cream);margin-bottom:10px}
  .tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .tile{border-radius:22px;padding:16px;color:#fff;font-weight:900;font-size:17px;text-align:left;min-height:100px;display:flex;flex-direction:column;justify-content:space-between}
  .tile span{font-size:28px}
  .step{border-radius:18px;padding:12px;margin-bottom:12px;background:#fff;border-left:8px solid}
  .step h3{font-size:17px;font-weight:900;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center}
  .small-mic{width:42px;height:42px;border-radius:50%;background:var(--coral);font-size:19px;display:grid;place-items:center;flex-shrink:0}
  .small-mic.on{animation:pulse 1s infinite}
  .speak{font-size:20px;background:var(--sky);border-radius:50%;width:38px;height:38px;display:grid;place-items:center}
  .item{border-radius:18px;background:var(--cream);padding:12px 14px;margin-bottom:10px}
  .item h4{color:var(--navy);font-size:16px;margin-bottom:4px}
  .item p{font-size:15px;line-height:1.5;white-space:pre-wrap}
  .item small{color:var(--muted);font-size:12px;font-weight:700}
  .then{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .then div{border-radius:16px;padding:12px;font-size:15px;font-weight:700;line-height:1.4}
  .then small{display:block;font-size:11px;font-weight:900;letter-spacing:.6px;opacity:.7;margin-bottom:4px}
  .stats{display:flex;gap:10px}
  .stat{flex:1;border-radius:18px;padding:14px;text-align:center;color:#fff;font-weight:900}
  .stat b{display:block;font-size:30px}
  .lang{display:flex;gap:8px;justify-content:center;margin-top:8px}
  .lang button{background:#fff;border-radius:999px;padding:6px 12px;font-size:13px;font-weight:800;color:var(--muted)}
  .lang button.on{background:var(--navy);color:#fff}
  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;padding:13px 22px;border-radius:16px;font-weight:900;font-size:16px;opacity:0;transition:.3s;pointer-events:none;z-index:9}
  .toast.show{opacity:1}
  .loading{display:grid;place-items:center;min-height:60vh;font-size:44px}
  .loading span{animation:hop 1s infinite}
  @keyframes hop{50%{transform:translateY(-10px)}}
  .stamps{display:flex;gap:6px;margin-top:6px}
  .stamp{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-size:20px;background:#f1ede2;filter:grayscale(1);opacity:.45}
  .stamp.on{background:#fff1c9;filter:none;opacity:1;box-shadow:0 0 0 3px var(--sun)}
  .kindtag{display:inline-block;background:#f1edff;color:#5b3fd1;font-weight:800;font-size:12px;padding:4px 10px;border-radius:999px}
  .map{display:flex;flex-direction:column;align-items:center;margin-bottom:14px}
  .stop{width:100%;display:flex;align-items:center;gap:14px;background:#fff;border-radius:22px;padding:14px 16px;border:3px solid transparent;text-align:left;box-shadow:0 3px 0 rgba(20,50,92,.08)}
  .stop .sic{width:54px;height:54px;border-radius:50%;background:var(--c);display:grid;place-items:center;font-size:26px;flex-shrink:0;color:#fff}
  .stop .snm{font-weight:900;font-size:17px;color:var(--navy);flex:1}
  .stop .sds{font-size:12px;font-weight:800;color:var(--muted)}
  .stop.here{border-color:var(--c);animation:glow 1.8s ease-in-out infinite}
  .stop.here .sds{color:var(--c)}
  .stop.done .sic{background:#e6f7ec}
  .stop.locked{opacity:.55}
  @keyframes glow{50%{box-shadow:0 0 0 7px rgba(47,111,214,.18)}}
  .pathdot{width:6px;height:22px;border-left:5px dotted #c9b98f;margin:2px 0}
  .methods{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
  .method{background:var(--cream);border:2.5px solid #f0e6d0;border-radius:16px;padding:10px 6px;font-weight:800;font-size:13.5px;color:var(--navy);display:flex;flex-direction:column;align-items:center;gap:4px}
  .method span{font-size:28px}
  .method.on{background:#e6f7ec;border-color:var(--leaf)}
  .trow{display:flex;gap:8px;align-items:center;margin-bottom:8px}
  .tbtn{width:44px;height:44px;border-radius:50%;background:var(--blue);color:#fff;font-size:22px;font-weight:900}
  .tcount{min-width:30px;text-align:center;font-size:20px;color:var(--navy)}
  .stampfly{position:fixed;left:50%;top:40%;transform:translate(-50%,-50%);font-size:110px;z-index:20;animation:fly 1.6s ease forwards;pointer-events:none}
  @keyframes fly{0%{transform:translate(-50%,-50%) scale(.2) rotate(-20deg);opacity:0}30%{transform:translate(-50%,-50%) scale(1.2) rotate(8deg);opacity:1}70%{transform:translate(-50%,-50%) scale(1) rotate(0)}100%{transform:translate(-50%,-140%) scale(.4);opacity:0}}
  .shelfrow{display:flex;gap:10px;overflow-x:auto;padding:6px 2px 14px;border-bottom:10px solid #c8945a;border-radius:0 0 6px 6px;box-shadow:0 6px 0 #a87442}
  .bookspine{flex:0 0 112px;height:160px;border-radius:8px 14px 14px 8px;background:var(--b);color:#fff;font-weight:900;font-size:13.5px;line-height:1.25;padding:10px 8px;text-align:left;display:flex;flex-direction:column;gap:6px;box-shadow:inset 6px 0 0 rgba(0,0,0,.15),0 4px 8px rgba(0,0,0,.15);transition:.2s}

  .bookspine span{font-size:26px}
  .bookspine small{font-weight:700;opacity:.85;font-size:11.5px;margin-top:auto}
  .kreader{font-size:19px;line-height:1.75;color:var(--ink)}
  .kreader p{margin-bottom:14px}
  .kreader[dir=rtl]{text-align:right}
  .gardencard{padding:0;overflow:hidden;background:linear-gradient(#cfe9ff,#eaf6ff 60%)}
  .sky{height:54px;position:relative}
  .sun{position:absolute;right:16px;top:8px;font-size:34px;animation:spin 18s linear infinite}
  .cloudy{position:absolute;left:20px;top:12px;font-size:28px;animation:drift 9s ease-in-out infinite}
  @keyframes spin{to{transform:rotate(360deg)}} @keyframes drift{50%{transform:translateX(30px)}}
  .bed{display:flex;flex-wrap:wrap;justify-content:center;align-items:flex-end;gap:6px 4px;padding:0 10px;min-height:120px}
  .bedempty{font-weight:800;color:#3d6b4f;padding:30px 0;font-size:16px}
  .soil{height:34px;background:linear-gradient(#8b5a33,#6e4426);border-top:6px solid #5f9e3c;border-radius:0 0 22px 22px}
  .plant{display:flex;flex-direction:column;align-items:center;width:86px;background:none}

  .pl.g0{font-size:30px} .pl.g1{font-size:38px} .pl.g5{font-size:54px}
  @keyframes sway{50%{transform:rotate(4deg)}}
  .ptag{font-size:11px;font-weight:800;color:#2d4a37;background:rgba(255,255,255,.85);border-radius:8px;padding:2px 6px;margin:3px 0 4px;max-width:84px;line-height:1.25}
  .growcard{background:linear-gradient(#eaf6ff,#fff)}
  .bigplant{font-size:96px;line-height:1.1;animation:sway 3.5s ease-in-out infinite;transform-origin:bottom center}
  .bigplant.g0{font-size:60px} .bigplant.g1{font-size:72px}
  .stop .snm small{display:block;font-size:12px;font-weight:700;color:var(--muted)}
  .birdsays{display:flex;gap:10px;align-items:flex-start;background:#e8f1ff;border-radius:18px;padding:12px;margin-top:12px;animation:pop .4s ease}
  .birdsays img{width:54px;flex-shrink:0}
  .birdsays b{color:var(--navy);display:block;margin-bottom:4px} .birdsays p{font-size:14.5px;line-height:1.45;margin-top:3px}
  @keyframes pop{0%{transform:scale(.8);opacity:0}100%{transform:none;opacity:1}}
  .nestscene{position:relative;height:150px}
  .birdfly{width:96px;position:absolute;left:50%;top:0;transform:translateX(-50%);animation:hover 2.6s ease-in-out infinite}
  @keyframes hover{50%{transform:translate(-50%,-8px)}}
  .nest{position:absolute;left:50%;bottom:0;transform:translateX(-50%);width:170px;height:56px;border-radius:0 0 90px 90px;background:radial-gradient(ellipse at 50% 0%,#a77645 0,#7a4f2a 70%);box-shadow:inset 0 6px 0 rgba(0,0,0,.15)}
  .twig{position:absolute;left:50%;top:18px;width:62px;height:6px;border-radius:4px;background:#c58b52;transform:translate(var(--x),var(--y)) rotate(var(--a));box-shadow:0 1px 0 #6b4423}
  .twigbtns{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .twigbtn{background:var(--c);color:#fff;border-radius:16px;padding:10px 4px;font-weight:900;font-size:13.5px;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer}
  .twigbtn span{font-size:24px}
  .lbl{font-weight:800;color:var(--navy);margin-bottom:6px;font-size:14.5px}
  .cork{position:relative;display:grid;grid-template-columns:1fr 1fr;gap:16px 12px;padding:16px 10px;border-radius:16px;background:#c99a62 radial-gradient(rgba(0,0,0,.08) 1px,transparent 1px) 0 0/8px 8px;border:6px solid #8b5a33;min-height:140px}
  .clue{position:relative;background:#fffdf3;border-radius:4px;padding:16px 8px 8px;font-size:12.5px;font-weight:700;color:var(--ink);text-align:left;line-height:1.35;box-shadow:0 3px 6px rgba(0,0,0,.2);transform:rotate(var(--r));z-index:2;max-height:140px;overflow:hidden}
  .clue img{width:100%;border-radius:3px}
  .clue.picked{outline:4px solid #d62828;transform:rotate(0) scale(1.05)}
  .pin{position:absolute;top:4px;left:50%;width:12px;height:12px;border-radius:50%;background:#d62828;transform:translateX(-50%);box-shadow:0 2px 0 rgba(0,0,0,.3)}
  .strings{position:absolute;left:0;top:0;pointer-events:none;z-index:3}
  .badges{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .badge{border:2.5px dashed #d8cfb5;border-radius:16px;padding:10px;font-weight:800;font-size:13px;color:var(--navy);background:var(--cream);display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center}
  .badge span{font-size:30px} .badge.on{border:2.5px solid var(--sun);background:#fff1c9}
  .exhibit{background:#fbf7ef;border:3px solid #c9a46a}
  .plaque{background:linear-gradient(#e7c98f,#c9a46a);color:#4a3416;font-weight:900;text-align:center;padding:10px;border-radius:8px;margin-bottom:12px;font-size:17px;letter-spacing:.5px}
  .exhibitimg{width:100%;border-radius:6px;border:10px solid #fff;box-shadow:0 6px 16px rgba(0,0,0,.18);margin-bottom:12px}
  .exhibit .label{background:#fff;border-left:5px solid #c9a46a;padding:10px 12px;font-size:15px;line-height:1.55;margin-bottom:10px}
  .exhibit .touch{background:#e6f7ec;border-radius:12px;padding:10px 12px;font-weight:800;color:#1f7a4d}
  .radio{background:linear-gradient(135deg,#1d2433,#3a2f5c);color:#fff}
  .radio h2{color:#fff} .onair{display:inline-block;background:#d62828;color:#fff;font-weight:900;font-size:12px;padding:4px 10px;border-radius:6px;margin-bottom:8px;animation:blink 1.4s infinite}
  @keyframes blink{50%{opacity:.5}}

  .sdgk{display:inline-grid;place-items:center;min-width:24px;height:24px;border-radius:7px;color:#fff;font-size:12px;font-weight:900;margin:2px 4px 2px 0;padding:0 4px}
  .herocard{display:flex;gap:12px;align-items:center;text-align:left;width:100%}
  .herocard b{font-size:17px;color:var(--navy)}.herocard p{font-weight:700;color:var(--muted);font-size:13px}
  .storyk p{font-size:17px;line-height:1.65;margin-bottom:12px}
  .sdgline{font-weight:800;color:var(--navy);margin:4px 0}
  .chipk{display:block;width:100%;text-align:left;background:#fff;border:2px solid #cfe0fb;border-radius:12px;padding:8px 10px;margin-top:6px;font-weight:800;color:var(--blue)}
  .milek{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px dashed #eee;font-weight:700}.milek small{display:block;color:var(--muted)}.milek.done b{color:var(--muted)}
  .moods{display:flex;gap:8px;margin-bottom:6px}.mood{font-size:28px;background:#f4f6fb;border-radius:14px;padding:6px 10px}.mood.on{background:#ffe9a8;outline:3px solid var(--sun)}
  .stepk{display:block;width:100%;text-align:left;font-weight:800}
  select.title{width:100%;padding:12px;border-radius:14px;border:2px solid #e4e8f0;font:inherit;font-weight:700;background:#fff;color:inherit}
  .x{background:none;color:#c2410c;font-weight:900}
  .stars{display:flex;gap:8px}.starb{font-size:34px;filter:grayscale(1);opacity:.4;background:none}.starb.on{filter:none;opacity:1}

  .ccards{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
  .ccard{background:#fff;border:3px solid var(--c);border-radius:20px;padding:14px;display:flex;flex-direction:column;align-items:flex-start;gap:4px;text-align:left}
  .ccard span{font-size:32px}.ccard b{font-size:18px;color:var(--c)}.ccard small{font-weight:800;color:var(--muted);font-size:13px}
  .ccard.small{padding:10px}.ccard.small span{font-size:22px}.ccard.small b{font-size:15px}
  .sortit{background:var(--cream);border-radius:14px;padding:10px;margin-bottom:8px;border:2px solid transparent}.sortit p{font-weight:800}
  .sortit div{display:flex;gap:6px;margin-top:6px}.sortit div button{flex:1;background:#fff;border-radius:10px;padding:8px;font-weight:900;border:2px solid #e4e8f0}
  .sortit.right{border-color:var(--leaf);background:#e7f7ef}.sortit.wrong{border-color:#f59e0b}.sortit small{font-weight:800}
  .depthk{display:flex;gap:10px;align-items:center;width:100%;background:#f4f6fb;border-radius:14px;padding:12px;margin-bottom:8px;font-weight:900;font-size:16px;text-align:left;border:3px solid transparent}.depthk span{font-size:28px}.depthk.on{border-color:var(--leaf);background:#e7f7ef}

  .sect{font-family:"Fredoka",sans-serif;color:var(--navy);font-size:19px;margin:16px 4px 8px}
  .depthrow{display:flex;gap:6px}.depthrow button{flex:1;background:#f4f6fb;border-radius:14px;padding:8px 4px;font-size:24px;display:flex;flex-direction:column;align-items:center;border:3px solid transparent}.depthrow button small{font-size:11px;font-weight:800;color:var(--muted)}.depthrow button.on{border-color:var(--leaf);background:#e7f7ef}
  .lpgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}.lpb{background:#f4f6fb;border-radius:12px;padding:8px 2px;font-size:22px;display:flex;flex-direction:column;align-items:center;border:3px solid transparent}.lpb small{font-size:9.5px;font-weight:800;color:var(--muted)}.lpb.on{border-color:var(--sun);background:#fff4cf}

  .birdcard{display:flex;gap:12px;align-items:center;width:100%;background:linear-gradient(135deg,#fff,#eef4ff)}
  .mybird{display:flex;flex-direction:column;align-items:center}.birdwrap{position:relative;display:flex;justify-content:center;margin-bottom:-14px;z-index:1;animation:bob 2.4s ease-in-out infinite}
  .birdwrap .hat{position:absolute;top:-6%;left:50%;transform:translateX(-30%)}
  @keyframes bob{50%{transform:translateY(-5px)}}
  .bk{font-size:12px;font-weight:800;color:var(--muted)}.bn{font-family:"Fredoka",sans-serif;font-size:20px;color:var(--navy)}.bf{font-weight:900;color:var(--coral)}
  .bbar{height:10px;border-radius:8px;background:#e4e8f0;overflow:hidden;margin:6px 0}.bbar i{display:block;height:100%;background:linear-gradient(90deg,#ffc83d,#ff7a59)}
  .pick{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.pk{background:#f4f6fb;border-radius:14px;padding:8px 4px;display:flex;flex-direction:column;align-items:center;gap:4px;border:3px solid transparent}.pk img{width:44px}.pk small{font-size:10.5px;font-weight:800;color:var(--muted);text-align:center}.pk.on{border-color:var(--blue);background:#e8f1ff}
  .earn{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px dashed #eee;font-weight:800}.earn span{flex:1}.earn b{color:var(--coral)}.earn small{color:var(--muted)}
  .featherfly{position:fixed;left:50%;top:40%;transform:translateX(-50%);font-size:34px;font-weight:900;color:#ff7a59;z-index:99;animation:fly 1.6s ease-out forwards;pointer-events:none}

<div class="wrap" id="app"><div class="loading"><span><img src="wondernest-mark.png" alt="" style="width:90px" onerror="this.replaceWith('🐦')"></span></div></div>
<div class="toast" id="toast"></div>
<script>
/* ===== CONFIG: your Supabase project (public values) ===== */
const SUPABASE_URL = "https://zmncqutjtgwxlvrdgwiq.supabase.co";
const SUPABASE_KEY = "sb_publishable_blNQT3mGUzNadaRARkRpew_dq-tmD4J";
/* ========================================================== */

const PICTURES = ["🐢","🐪","⭐","🍎","🚀","🐬","🌻","🦁","🎈","🐝","🍓","⚽"];
const KID_SKILLS = {
  "Critical thinking":"I can think carefully and ask \"Why?\"", "Creative thinking":"I can come up with new ideas",
  "Transfer":"I can use what I learned in a new way", "Reflection":"I can think about my own learning",
  "Information literacy":"I can find and collect information", "Media literacy":"I can learn from pictures, videos and books",
  "Ethical use of information":"I can say where my information came from", "Exchanging information":"I can listen and share my ideas",
  "Literacy":"I can read and write to share my ideas", "ICT":"I can use technology to learn",
  "Interpersonal relationships":"I can work well with others", "Social-emotional intelligence":"I can understand my feelings and other people's feelings",
  "Organization":"I can plan and organise my work", "States of mind":"I can keep trying and stay calm"
};
const FACES = [["🌱","I'm starting"],["🌿","I'm growing"],["🌳","I can do it"],["🌟","I can teach others"]];
let atl = [], quests = [], quiz = null, reflectSkill = null;
const BUBBLE_COLOURS = ["#fff1c9","#e3f1ff","#ffe3da","#e6f7ec","#f1edff","#ffeef6"];
const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, { auth: { storageKey: "wondernest-kids" } });
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let me = null, screen = "home", entries = [], roster = null, classCode = "", chosen = null, lang = localStorage.getItem("wn_lang") || "en-GB";

function toast(t){ const el = $("#toast"); el.textContent = t; el.classList.add("show"); setTimeout(()=>el.classList.remove("show"), 2000); }
function speak(text){ try{ speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(text); u.lang = lang; u.rate = .9; speechSynthesis.speak(u); }catch(e){} }
function setLang(l){ lang = l; localStorage.setItem("wn_lang", l); draw(); }

/* ---------- dictation (speech to text) ---------- */
let rec = null;
function dictate(targetId, btn){
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if(!SR){ toast("Tap the 🎤 on your keyboard to talk"); $("#"+targetId).focus(); return; }
  if(rec){ rec.stop(); return; }
  const box = $("#"+targetId), start = box.value ? box.value.trim() + " " : "";
  rec = new SR(); rec.lang = lang; rec.interimResults = true; rec.continuous = true;
  btn.classList.add("on");
  rec.onresult = ev => { let t = ""; for(const r of ev.results) t += r[0].transcript; box.value = start + t; };
  rec.onerror = () => toast("I couldn't hear you. Try again!");
  rec.onend = () => { btn.classList.remove("on"); rec = null; };
  rec.start();
}
const micBtn = (id, small) => `<button class="${small?"small-mic":"mic"}" onclick="dictate('${id}', this)" aria-label="Talk">🎤</button>`;
const langSwitch = () => `<div class="lang"><button class="${lang==="en-GB"?"on":""}" onclick="setLang('en-GB')">English</button><button class="${lang==="ar-AE"?"on":""}" onclick="setLang('ar-AE')">العربية</button></div>`;

/* ---------- start ---------- */
async function start(){
  try{
    let { data: { session } } = await db.auth.getSession();
    if(!session){ const r = await db.auth.signInAnonymously(); if(r.error) throw r.error; }
    const { data } = await db.rpc("me_student");
    if(data){ me = data; await loadEntries(); screen = "home"; return draw(); }
    const code = new URLSearchParams(location.search).get("c");
    if(code){ classCode = code; return loadRoster(); }
    screen = "code"; draw();
  }catch(e){ $("#app").innerHTML = `<div class="body"><div class="big-title">Oops!</div><p class="sub">WonderNest can't connect right now. Please ask your teacher.</p></div>`; }
}
async function loadRoster(){
  const { data } = await db.rpc("class_roster", { p_code: classCode });
  if(!data){ screen = "code"; draw(); $(".msg").textContent = "I can't find that class code. Check it with your teacher."; return; }
  roster = data; screen = "names"; draw();
}
async function tryPicture(pic, el){
  const { data, error } = await db.rpc("student_login", { p_code: classCode, p_student: chosen.id, p_picture: pic });
  if(error){ $(".msg").textContent = "Something went wrong. Try again."; return; }
  if(data.ok){ const r = await db.rpc("me_student"); me = r.data; await loadEntries(); screen = "home"; draw(); speak("Hello " + me.first_name + "!"); return; }
  el.classList.add("shake"); setTimeout(()=>el.classList.remove("shake"), 400);
  $(".msg").textContent = data.reason === "locked" ? "Too many tries. Please ask your teacher, or wait 10 minutes." : "Not that one. Try again!";
}
async function loadEntries(){
  const [e, a] = await Promise.all([
    db.from("entries").select("*").eq("student_id", me.student_id).order("created_at", { ascending: false }),
    db.from("atl_records").select("*").eq("student_id", me.student_id).order("created_at", { ascending: false })
  ]);
  entries = e.data || []; atl = a.data || [];
  const q = await db.from("atl_toolkits").select("skill, data").eq("class_id", me.class_id);
  quests = (q.data || []).filter(t => t.data && (t.data.quiz || []).length);
}
async function rateSkill(skill, level){
  const unit = me.current_unit ? (me.current_unit.centralIdea || "") : "";
  const { error } = await db.from("atl_records").insert({ student_id: me.student_id, class_id: me.class_id, skill, level, level_label: FACES[level-1][1], source: "self", unit_label: unit });
  if(error){ toast("Oh no, it didn't save. Try again."); return; }
  await loadEntries(); toast(FACES[level-1][0] + " Saved!"); draw();
}
async function addEntry(kind, title, content){
  const unit = me.current_unit ? (me.current_unit.centralIdea || "") : "";
  const { error } = await db.from("entries").insert({ student_id: me.student_id, class_id: me.class_id, kind, title, content, unit_label: unit });
  if(error){ toast("Oh no, it didn't save. Try again."); return false; }
  await loadEntries(); toast("Saved in your nest! 🐦"); return true;
}
async function logout(){ await db.rpc("student_logout"); me = null; entries = []; screen = "code"; classCode = ""; draw(); }
function go(s){ screen = s; draw(); window.scrollTo(0,0); }

/* ---------- screens ---------- */
function draw(){
  const app = $("#app");
  if(screen === "code") return app.innerHTML = `<div class="body">
    <div class="big-title"><img src="wondernest-logo.png" alt="Wonder Nest" style="width:250px;max-width:80%;display:block;margin:0 auto 6px;animation:hop 3s ease-in-out infinite" onerror="this.replaceWith('Wonder Nest')"></div><p class="sub">Type your class code</p>
    <input class="code-input" id="code" maxlength="6" autocomplete="off" autocapitalize="characters" value="${esc(classCode)}">
    <div class="center"><button class="btn" onclick="classCode=$('#code').value.trim(); loadRoster()">Let's go! →</button></div>
    <div class="msg"></div><p class="center" style="margin-top:26px"><a href="./" style="color:var(--navy);font-weight:800">← WonderNest home</a></p></div>`;
  if(screen === "names") return app.innerHTML = `<div class="body">
    <div class="big-title">Who are you?</div><p class="sub">${esc(roster.class_name)} · tap your name</p>
    <div class="names">${roster.students.map((s,i)=>`<button class="name" onclick="chosen=roster.students[${i}]; go('picture')">${esc(s.first_name)}</button>`).join("")}</div>
    ${roster.students.length ? "" : `<p class="sub" style="margin-top:20px">Your teacher hasn't added names yet.</p>`}
    <div class="center" style="margin-top:22px"><button class="btn ghost" onclick="go('code')">‹ Different class</button></div></div>`;
  if(screen === "picture") return app.innerHTML = `<div class="body">
    <div class="big-title">Hi ${esc(chosen.first_name)}!</div><p class="sub">Tap your secret picture</p>
    <div class="pics">${PICTURES.map(p=>`<button class="pic" onclick="tryPicture('${p}', this)">${p}</button>`).join("")}</div>
    <div class="msg"></div>
    <div class="center"><button class="btn ghost" onclick="go('names')">‹ That's not me</button></div></div>`;
  if(!me) return start();
  const u = me.current_unit || {};
  const head = (title, hi, color) => `<div class="head" style="${color?`background:${color}`:""}"><div class="hi">${hi}</div><h1>${title}</h1>
    ${screen === "home" && u.centralIdea ? `<div class="unit">${esc(u.themeIcon||"🌍")} ${esc(u.themeName||"Our unit")}<b>${esc(u.centralIdea)}</b></div>` : ""}
    <button class="back" onclick="${screen==="home" ? "if(confirm('Leave your Wonder Nest?')) logout()" : "go('home')"}">${screen==="home" ? "👋 Bye" : "‹ Home"}</button></div>`;
  const wonders = entries.filter(e=>e.kind==="wonder"), stories = entries.filter(e=>e.kind==="story"), routines = entries.filter(e=>e.kind==="routine"), refl = entries.filter(e=>e.kind==="reflection");

  if(screen === "home") return app.innerHTML = head(`${esc(me.first_name)}'s Wonder Nest 🐦`, "Hello,") + `<div class="body">
    <div class="card"><h2>💭 My wonder wall <button class="speak" onclick="speak('What are you wondering about today?')">🔊</button></h2>
      <div class="wall">${wonders.slice(0,8).map((w,i)=>`<div class="bub" style="background:${BUBBLE_COLOURS[i%6]}">${esc(w.content.text)}</div>`).join("") || `<div class="empty">Your wonders will live here.</div>`}</div></div>
    <div class="card"><h2>What are you wondering?</h2>
      <div class="mic-row">${micBtn("wonderText")}<textarea id="wonderText" placeholder="I wonder…" style="min-height:70px"></textarea></div>
      ${langSwitch()}
      <button class="btn leaf wide" style="margin-top:12px" onclick="saveWonder()">Add to my wonder wall</button></div>
    <div class="tiles">
      <button class="tile" style="background:var(--blue)" onclick="go('routine')"><span>🧠</span>See · Think · Wonder</button>
      <button class="tile" style="background:var(--lilac)" onclick="go('stories')"><span>📖</span>My stories</button>
      <button class="tile" style="background:var(--coral)" onclick="go('grown')"><span>🌱</span>How I've grown</button>
      <button class="tile" style="background:var(--leaf)" onclick="go('wonders')"><span>💭</span>All my wonders</button>

/* ---------- the wonder jar (shared by teacher and child pages) ---------- */
const JAR_COLOURS = ["#fff1c9","#ffe3da","#e3f1ff","#e6f7ec","#f1edff","#ffeef6","#fff6d6","#e0f7f7"];
function jarHTML(items, onSlip, opts){
  opts = opts || {};
  const shown = items.slice(0, 24);
  const slips = shown.map((p, i) => {
    const row = Math.floor(i / 3), col = i % 3;
    const jx = ((i * 53) % 17) - 8, jy = ((i * 29) % 11) - 5, rot = ((i * 37) % 34) - 17;
    const left = 14 + col * 64 + jx + (row % 2 ? 14 : 0), bottom = 10 + row * 26 + jy;
    return `<button class="wslip ${opts.newId === p.id ? "drop" : ""}" title="${esc(p.title)}" onclick="${onSlip}('${p.id}')"
      style="left:${left}px;bottom:${bottom}px;--r:${rot}deg;background:${JAR_COLOURS[i % JAR_COLOURS.length]};animation-delay:${(i % 6) * .35}s">${esc(p.emoji || "💭")}</button>`;
  }).join("");
  return `<div class="jarwrap"><div class="jar ${opts.shaking ? "shaking" : ""}" id="jar">
      <div class="lid"></div><div class="lidtop"></div><div class="neck"></div>
      <div class="glass">${slips}<div class="shine"></div>
        ${items.length ? "" : `<div class="jarempty">Empty…<br>add a wonder!</div>`}</div>
      <div class="jarlabel">${esc(opts.label || "Wonder jar")}${items.length ? ` · ${items.length}` : ""}</div>
    </div></div>`;
}
function slipCard(p, buttons){
  return `<div class="slipbg" onclick="if(event.target===this) closeSlip()"><div class="slipcard">
    <div class="slipemoji">${esc(p.emoji || "💭")}</div>
    <div class="slipkind">${p.kind === "maker" ? "🛠️ Maker challenge" : p.kind === "wonder" ? "💭 A wonder" : "✨ Provocation"}</div>
    <h3>${esc(p.title)}</h3>${p.body ? `<p>${esc(p.body)}</p>` : ""}
    <div class="slipbtns">${buttons}</div></div></div>`;
}
const JAR_CSS = `
  .jarwrap{display:flex;justify-content:center;padding:6px 0 10px}
  .jar{position:relative;width:240px;height:300px}
  .jar .lid{position:absolute;top:6px;left:50%;transform:translateX(-50%);width:150px;height:30px;border-radius:10px;background:linear-gradient(#d29a5c,#a8682f);box-shadow:inset 0 -4px 0 rgba(0,0,0,.12),0 3px 6px rgba(0,0,0,.12);z-index:3}
  .jar .lidtop{position:absolute;top:0;left:50%;transform:translateX(-50%);width:130px;height:12px;border-radius:8px;background:#e0ad72;z-index:4}

  .jar .glass{position:absolute;top:50px;left:6px;right:6px;bottom:0;border:4px solid rgba(110,150,195,.55);border-radius:46px 46px 54px 54px;background:linear-gradient(115deg,rgba(255,255,255,.75),rgba(214,234,252,.45) 45%,rgba(194,222,248,.6));overflow:hidden;box-shadow:inset 0 -10px 24px rgba(110,150,195,.18),0 14px 30px rgba(20,50,92,.12)}
  .jar .shine{position:absolute;top:18px;left:18px;width:16px;height:150px;border-radius:12px;background:linear-gradient(rgba(255,255,255,.85),rgba(255,255,255,0));pointer-events:none}
  .jarlabel{position:absolute;left:50%;top:132px;transform:translateX(-50%) rotate(-3deg);background:#fffaf0;border:2px solid #e8c98f;border-radius:10px;padding:5px 12px;font-weight:900;font-size:13px;color:#8a5200;white-space:nowrap;box-shadow:0 3px 8px rgba(0,0,0,.08);z-index:2;pointer-events:none}
  .jarempty{position:absolute;inset:0;display:grid;place-items:center;text-align:center;color:#7c93b3;font-weight:800;font-size:14px;padding-top:70px}
  .wslip{position:absolute;width:58px;height:38px;border-radius:7px;font-size:19px;display:grid;place-items:center;border:1.5px solid rgba(0,0,0,.08);box-shadow:0 3px 5px rgba(0,0,0,.12);transform:rotate(var(--r));cursor:pointer;animation:slipfloat 4s ease-in-out infinite;z-index:1}
  .wslip:after{content:"";position:absolute;right:0;top:0;width:12px;height:12px;background:linear-gradient(225deg,rgba(0,0,0,.12) 50%,transparent 50%);border-radius:0 7px 0 0}

  @keyframes slipfloat{50%{transform:rotate(var(--r)) translateY(-3px)}}
  @keyframes slipdrop{0%{transform:translateY(-260px) rotate(40deg);opacity:0}60%{opacity:1}100%{transform:rotate(var(--r))}}
  .jar.shaking{animation:jarshake .9s ease-in-out}

  @keyframes jarshake{0%,100%{transform:rotate(0)}15%{transform:rotate(-9deg)}30%{transform:rotate(8deg)}45%{transform:rotate(-7deg)}60%{transform:rotate(6deg)}75%{transform:rotate(-3deg)}}
  @keyframes slipjiggle{50%{transform:rotate(calc(var(--r) * -1)) translateY(-10px)}}
  .slipbg{position:fixed;inset:0;background:rgba(20,50,92,.35);display:grid;place-items:center;z-index:50;padding:16px}

  @keyframes unfold{0%{transform:translateY(120px) scale(.2) rotate(-25deg);opacity:0}100%{transform:none;opacity:1}}
  .slipemoji{font-size:54px;line-height:1}

  .slipbtns{display:flex;flex-direction:column;gap:8px;margin-top:16px}`;

let jarShaking = false, slipOpen = null;
(() => { const st = document.createElement('style'); st.textContent = JAR_CSS; document.head.appendChild(st); })();
function openSlip(id){ slipOpen = provs.find(p => p.id === id) || null; draw(); if(slipOpen) speak(slipOpen.title); }

function resizeImage(file){
  return new Promise((ok, bad) => {
    const r = new FileReader(); r.onerror = bad;
    r.onload = () => { const img = new Image(); img.onerror = bad; img.onload = () => {
      const max = 720, k = Math.min(1, max / Math.max(img.width, img.height)); const c = document.createElement("canvas");
      c.width = Math.round(img.width * k); c.height = Math.round(img.height * k); c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      ok(c.toDataURL("image/jpeg", 0.72)); }; img.src = r.result; };
    r.readAsDataURL(file);
  });
}

    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    const chunks = []; recorder = new MediaRecorder(stream);
    recorder.ondataavailable = e => chunks.push(e.data);
    recorder.onstop = async () => { stream.getTracks().forEach(t => t.stop()); recOn = false;
      const blob = new Blob(chunks, { type: recorder.mimeType || "audio/mp4" }); const r = new FileReader();
      r.onload = async () => { const q = curInq(); keepShareFields(); q.data.share.audio = await uploadMedia(blob); if(await saveInq(q)) toast("🎙️ Saved!"); draw(); }; r.readAsDataURL(blob); };

  const keys = (data || []).map(r => r.story_key);
  const built = SDG_STORIES.filter(s => keys.includes(s.id));
  const customIds = keys.filter(k => /^[0-9a-f-]{36}$/.test(k));
  let custom = [];
  if(customIds.length){ const c = await db.from("sdg_stories").select("*").in("id", customIds); custom = (c.data || []).map(r => Object.assign({ id: r.id }, r.data)); }
  heroes = [...custom, ...built];
}

async function planInterview(){
  const who = ($("#ivWho")||{}).value || ""; const q = curInq();
  if(!who.trim()) return toast("First write who you will ask!");
  toast("🐦 The bird is thinking…");
  try{ ivPlan = await kidAI("interview_planner", { wonder: q.data.wonder || "", who }); }catch(e){ ivPlan = null; toast(e.message); }
  const keep = { w: who, q: ($("#ivQ")||{}).value || "", a: ($("#ivA")||{}).value || "" }; draw();
  if($("#ivWho")){ $("#ivWho").value = keep.w; $("#ivQ").value = keep.q; $("#ivA").value = keep.a; }
}

async function goExh(){
  const [e, g, m, f] = await Promise.all([db.from("exhibitions").select("*").eq("class_id", me.class_id), db.from("exh_groups").select("*").eq("class_id", me.class_id).order("name"), db.rpc("my_classmates"), db.from("exh_feedback").select("*").order("created_at")]);
  exh = (e.data || [])[0] || { data: { timeline: [], rubric: [] } }; groups = g.data || []; mates = m.data || []; groupFb = f.data || []; go("exh");
}
async function savePassion(){
  const c = { passions: $("#pa1").value.split("\n").map(x=>x.trim()).filter(Boolean), issues: [0,1,2].map(i => ({ text: $("#is"+i).value.trim(), sdg: $("#isg"+i).value })).filter(x => x.text), why: $("#paW").value.trim() };
  if(!c.passions.length) return toast("Write at least one passion!");
  const p = lastE("passion");
  if(p){ const { error } = await db.from("entries").update({ content: c }).eq("id", p.id); if(error) return toast("Oh no, it didn't save."); await loadEntries(); toast("Saved! ❤️"); }
  else await addEntry("passion", "My passions", c);
  go("exh");
}
async function askIssue(){
  const pass = $("#pa1").value.trim(); if(!pass) return toast("Write your passions first!");
  toast("🐦 The bird is thinking…");

const MEDIA_BUCKET = "wondernest-media";
async function uploadMedia(dataUrlOrBlob, ext){
  try{
    const blob = typeof dataUrlOrBlob === "string" ? await (await fetch(dataUrlOrBlob)).blob() : dataUrlOrBlob;
    const { data: { session } } = await db.auth.getSession(); const uid = session && session.user && session.user.id; if(!uid) throw new Error("no session");
    const type = blob.type || "image/jpeg", e = ext || (type.includes("png") ? "png" : type.includes("audio") ? (type.includes("mp4") ? "m4a" : "webm") : "jpg");
    const path = `${uid}/${crypto.randomUUID()}.${e}`;

  }catch(e){ return typeof dataUrlOrBlob === "string" ? dataUrlOrBlob : await new Promise(r => { const fr = new FileReader(); fr.onload = () => r(fr.result); fr.readAsDataURL(dataUrlOrBlob); }); }

const CODE_LETTERS = "ABCDEFGHJKLM";
const idPart = id => String(id).replace(/[^a-zA-Z0-9]/g, "").slice(0, 4).toUpperCase().padStart(4, "0");
function parseExCode(raw){
  const s = String(raw || "").trim().replace(/\s+/g, ""); let cls, rest;
  if(s.includes("-")){ const i = s.lastIndexOf("-"); cls = s.slice(0, i); rest = s.slice(i + 1); } else { cls = s.slice(0, -5); rest = s.slice(-5); }
  cls = cls.replace(/[^a-zA-Z0-9]/g, ""); rest = rest.replace(/[^a-zA-Z0-9]/g, "").toUpperCase();
  if(!cls || rest.length !== 5) return null;
  const pic = PICTURES[CODE_LETTERS.indexOf(rest[4])]; if(!pic) return null;
  return { cls, id: rest.slice(0, 4), pic };
}
async function exLogin(raw){
  const msg = t => { const m = $(".msg"); if(m) m.textContent = t; };
  const c = parseExCode(raw);
  if(!c) return msg("That code doesn't look right. Check your card. It looks like this: ABC123-4F2AB");
  msg("Opening your journal… 🐦");
  let code = c.cls, r = await db.rpc("class_roster", { p_code: code });
  if(!r.data && code !== code.toUpperCase()){ code = code.toUpperCase(); r = await db.rpc("class_roster", { p_code: code }); }
  const st = r.data && (r.data.students || []).find(s => idPart(s.id) === c.id);
  if(!st) return msg("I can't find that code. Check it with your teacher.");
  const { data, error } = await db.rpc("student_login", { p_code: code, p_student: st.id, p_picture: c.pic });
  if(error || !data) return msg("Something went wrong. Try again.");
  if(!data.ok) return msg(data.reason === "locked" ? "Too many tries. Please ask your teacher, or wait 10 minutes." : "That code didn't work. Check it with your teacher.");
  const m = await db.rpc("me_student"); me = m.data; exh = null; await loadEntries(); screen = "home"; draw(); speak("Hello " + me.first_name + "!");
}

    ${m.map(e => `<div class="card jitem"><h3>${new Date(e.created_at).toLocaleDateString("en-GB")}${e.content.mentor ? " · " + esc(e.content.mentor) : ""}</h3><p>${esc(e.content.talked || "")}</p>${e.content.next ? `<p>➡️ ${esc(e.content.next)}</p>` : ""}</div>`).join("") || `<div class="card center">Your mentor meetings will appear here.</div>`}</div>`;
};
async function saveMeet(){ const t = $("#mT").value.trim(); if(!t) return toast("Write what you talked about!"); if(await addEntry("exh_mentor", "Mentor meeting", { mentor: $("#mM").value.trim(), talked: t, next: $("#mN").value.trim() })) draw(); }

/* the Wonder Library: wonders go to My questions */
const _wstoryEx = NEW_SCREENS.wstory;
NEW_SCREENS.wstory = function(){ const h = _wstoryEx(); return typeof h === "string" ? h.replace("Add to my wonder wall", "＋ Add to my questions").replace("This story makes me wonder…", "This story makes me wonder… (my questions)") : h; };
const _drawEx = draw;
draw = function(){ _drawEx(); const b = document.querySelector(".head .back"); if(b && screen !== "home" && /Exhibition|Home/.test(b.textContent)) b.textContent = "‹ My journal"; };

start();
</script>
</body>
