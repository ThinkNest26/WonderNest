<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WonderNest · Unit builder</title>
<link rel="icon" href="favicon.png">
<link rel="apple-touch-icon" href="favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=DM+Sans:wght@400;500;700&family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<meta name="description" content="WonderNest by ThinkNest Education: a PYP inquiry companion for teachers and children.">
<script src="wonder-library.js"></script>
<style>
  :root{
    --navy:#14325c; --blue:#2f6fd6; --sky:#e8f1ff; --sun:#ffc83d; --coral:#ff7a59;
    --leaf:#3bb07a; --lilac:#8a6cf0; --ink:#1d2433; --muted:#667085; --line:#e4e8f0; --bg:#f6f8fc;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:"Nunito","Segoe UI","Helvetica Neue",Arial,sans-serif;color:var(--ink);background:var(--bg);min-height:100vh}
  button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
  input,textarea,select{font:inherit;color:var(--ink)}
  .app{display:flex;min-height:100vh}
  /* sidebar */
  .side{width:240px;flex-shrink:0;background:var(--navy);color:#fff;padding:26px 18px;display:flex;flex-direction:column;gap:6px;position:sticky;top:0;height:100vh}
  .logo{display:flex;align-items:center;gap:10px;font-size:22px;font-weight:800;margin-bottom:26px}
  .logo .mark{width:52px;height:52px;display:grid;place-items:center;font-size:21px;flex-shrink:0}
  .logo .mark img{width:52px;height:52px;object-fit:contain;filter:drop-shadow(0 2px 4px rgba(0,0,0,.25))}
  .logo .n{color:#ffc83d}
  .logo > div:last-child{white-space:nowrap;font-size:21px}
  .logo small{display:block;font-size:11px;font-weight:600;opacity:.7;letter-spacing:.5px}
  .nav{padding:11px 14px;border-radius:10px;font-size:14.5px;opacity:.8;display:flex;gap:10px;align-items:center;text-align:left;width:100%}
  .nav:hover{background:rgba(255,255,255,.08);opacity:1}
  .nav.on{background:rgba(255,255,255,.15);opacity:1;font-weight:700}
  .nav.soon{opacity:.45;cursor:default}
  .nav.soon:hover{background:none}
  .nav .pill{margin-left:auto;font-size:10px;background:rgba(255,255,255,.18);padding:2px 7px;border-radius:99px}
  .side .foot{margin-top:auto;font-size:12px;opacity:.65;line-height:1.5}
  .main{flex:1;padding:30px 38px 60px;min-width:0}
  .top{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;margin-bottom:22px;flex-wrap:wrap}
  .crumb{font-size:13px;color:var(--muted);margin-bottom:4px}
  h1{font-size:27px;font-weight:800;color:var(--navy)}
  .demo{background:#fff4e0;border:1px solid #ffe0a3;color:#8a5200;border-radius:12px;padding:10px 14px;font-size:13.5px;margin-bottom:18px}
  /* stepper */
  .steps{display:flex;gap:8px;margin-bottom:24px}
  .step{flex:1;background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:12.5px;color:var(--muted);display:flex;gap:9px;align-items:center;text-align:left}
  .step b{width:24px;height:24px;border-radius:50%;background:var(--line);display:grid;place-items:center;font-size:12px;color:var(--muted);flex-shrink:0}
  .step.done b{background:var(--leaf);color:#fff}
  .step.now{border-color:var(--blue);color:var(--navy);font-weight:700;box-shadow:0 0 0 3px rgba(47,111,214,.12)}
  .step.now b{background:var(--blue);color:#fff}
  .step:disabled{cursor:default}
  .card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:20px 22px;margin-bottom:16px}
  .label{font-size:12px;font-weight:800;letter-spacing:.8px;text-transform:uppercase;color:var(--muted);margin-bottom:10px}
  .hint{font-size:12.5px;color:var(--muted);line-height:1.45}
  /* themes */
  .themes{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:20px}
  .theme{border-radius:14px;padding:15px 16px;border:2px solid transparent;background:#fff;box-shadow:0 1px 0 var(--line);text-align:left;position:relative}
  .theme:hover{border-color:#cfe0fb}
  .theme .ic{font-size:24px;margin-bottom:6px}
  .theme h3{font-size:15.5px;color:var(--navy);margin-bottom:3px}
  .theme p{font-size:12px;color:var(--muted);line-height:1.4}
  .theme.sel{border-color:var(--leaf);background:#effaf4}
  .theme.sel:after{content:"✓";position:absolute;top:12px;right:14px;width:24px;height:24px;border-radius:50%;background:var(--leaf);color:#fff;display:grid;place-items:center;font-size:13px;font-weight:800}
  textarea,input[type=text],select{width:100%;border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;font-size:15px;line-height:1.5;background:#fff}
  textarea{min-height:110px;resize:vertical}
  textarea:focus,input:focus,select:focus{outline:none;border-color:var(--blue)}
  .fields{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:14px}
  .fields label{font-size:12px;font-weight:700;color:var(--muted);display:block;margin-bottom:5px}
  .actions{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:16px;flex-wrap:wrap}
  .btn{background:var(--blue);color:#fff;border-radius:12px;padding:12px 20px;font-weight:800;font-size:15px;display:inline-flex;gap:8px;align-items:center}
  .btn:hover{filter:brightness(1.07)}
  .btn:disabled{opacity:.5;cursor:not-allowed}
  .btn.ghost{background:#fff;color:var(--blue);border:1.5px solid var(--blue)}
  .btn.small{padding:8px 13px;font-size:13px;border-radius:10px}
  .link{color:var(--blue);font-weight:700;font-size:13px}
  .link.danger{color:#c2410c}
  /* central ideas */
  .ci{border:1.5px solid var(--line);border-radius:12px;padding:13px 15px;margin-bottom:10px;font-size:15px;line-height:1.45;display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;background:#fff}
  .ci .rb{width:20px;height:20px;border-radius:50%;border:2px solid #c3cad8;flex-shrink:0;margin-top:2px}
  .ci.sel{border-color:var(--blue);background:var(--sky)}
  .ci.sel .rb{border:6px solid var(--blue)}
  .edit-row{display:flex;gap:10px;align-items:flex-start}
  /* lines */
  .loi{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px dashed var(--line)}
  .loi:last-child{border:0}
  .loi .n{width:26px;height:26px;border-radius:7px;background:var(--sun);font-weight:800;font-size:12px;display:grid;place-items:center;flex-shrink:0}
  .loi textarea{flex:1;min-height:52px;font-size:14.5px;padding:9px 12px}
  .loi select{width:140px;flex-shrink:0;font-size:13.5px;padding:10px}
  .grid2{display:grid;grid-template-columns:1.3fr 1fr;gap:18px;align-items:start}
  .chips{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:16px}
  .chip{font-size:12.8px;font-weight:700;padding:7px 12px;border-radius:999px;background:var(--bg);border:1px solid var(--line);color:var(--ink)}
  .chip:hover{border-color:#c9d3e6}
  .chip.on{background:#f1edff;border-color:#d7ccff;color:#5b3fd1}
  .chip.atl.on{background:#fff4e0;border-color:#ffe0a3;color:#9a5b00}
  .chip.lp.on{background:#e6f7ec;border-color:#bfe8cf;color:#1f7a4d}
  .atl-group{margin-bottom:10px}
  .atl-group h4{font-size:12.5px;color:var(--navy);margin-bottom:6px}
  .atl-group .chips{margin-bottom:6px}
  .why{font-size:12.3px;color:#7a5a12;background:#fffaf0;border-radius:10px;padding:8px 10px;margin:4px 0 10px;line-height:1.4}
  /* SDGs */
  .sdgs{display:grid;grid-template-columns:repeat(6,1fr);gap:10px}
  .sdg{border-radius:12px;color:#fff;padding:10px 11px;font-size:12px;font-weight:700;line-height:1.25;text-align:left;min-height:86px;opacity:.38;position:relative;border:3px solid transparent}
  .sdg b{display:block;font-size:22px;font-weight:900}
  .sdg.on{opacity:1;border-color:var(--navy)}
  .sdg.on:after{content:"✓";position:absolute;top:7px;right:8px;width:20px;height:20px;border-radius:50%;background:#fff;color:var(--navy);display:grid;place-items:center;font-size:12px;font-weight:900}
  .sdg-why{display:flex;gap:10px;align-items:flex-start;font-size:13.5px;line-height:1.45;padding:8px 0;border-bottom:1px dashed var(--line)}
  .sdg-why:last-child{border:0}
  .sdg-why span{color:#fff;font-weight:900;border-radius:8px;padding:3px 8px;flex-shrink:0;font-size:13px}
  /* resources */
  .grid3{display:grid;grid-template-columns:1.15fr 1fr 1fr;gap:16px;align-items:start}
  .book{display:flex;gap:12px;padding:10px 0;border-bottom:1px dashed var(--line)}
  .book:last-child{border:0}
  .cover{width:46px;height:60px;border-radius:6px;flex-shrink:0;display:grid;place-items:center;font-size:21px;background:var(--sky)}
  .book h4{font-size:14px;color:var(--navy)}
  .book p{font-size:12.3px;color:var(--muted);line-height:1.4;margin-top:2px}
  .blinks{display:flex;flex-wrap:wrap;gap:6px;margin-top:7px}
  .blink{font-size:11.5px;font-weight:800;color:var(--blue);background:#fff;border:1px solid #cfe0fb;border-radius:8px;padding:3px 8px;text-decoration:none}
  .blink:hover{background:var(--sky)}
  .blink.read{background:var(--leaf);border-color:var(--leaf);color:#fff}
  .bwarn{font-size:11.5px;color:#9a2b0b;background:#fff0ec;border-radius:8px;padding:5px 8px;margin-top:6px}
  img.cover{object-fit:cover;border:1px solid var(--line)}
  .tag{display:inline-block;font-size:10.5px;font-weight:800;padding:2px 7px;border-radius:6px;margin-top:5px;background:var(--sky);color:var(--blue)}
  .routine{border-radius:12px;padding:12px 14px;margin-bottom:10px;border:1px solid var(--line);border-left-width:5px}
  .routine h4{font-size:14.5px;color:var(--navy);display:flex;justify-content:space-between;gap:8px}
  .routine h4 span{font-size:11px;color:var(--muted);font-weight:700;white-space:nowrap}
  .routine p{font-size:12.5px;color:var(--muted);margin-top:4px;line-height:1.4}
  .prov{background:linear-gradient(135deg,#fff7e0,#fff);border:1px solid #ffe3a1;border-radius:12px;padding:12px 14px;margin-bottom:10px}
  .prov h4{font-size:14px;color:#8a5200;margin-bottom:4px}
  .prov p{font-size:12.5px;color:#6b5a3a;line-height:1.45}
  .story{background:linear-gradient(135deg,#f6f2ff,#fff4ef);border:1px solid #e6dcff;border-radius:14px;padding:16px 18px}
  .story h3{color:var(--navy);font-size:18px;margin-bottom:8px}
  .story p{font-size:14px;line-height:1.65;margin-bottom:8px;white-space:pre-wrap}
  .story .ar{direction:rtl;text-align:right;font-family:"Geeza Pro","Arial",sans-serif;border-top:1px dashed #d9ccff;padding-top:10px;margin-top:10px}
  .spark{background:#ffe9e2;border-radius:12px;padding:12px 14px;font-size:14px;color:#8a2c0d;font-weight:700;line-height:1.45;margin-top:12px}
  /* summative */
  .sgrid{display:grid;grid-template-columns:1.1fr 1fr;gap:16px;align-items:start}
  .field-lbl{font-size:12px;font-weight:800;letter-spacing:.6px;text-transform:uppercase;color:var(--muted);margin:14px 0 6px}
  .field-lbl:first-child{margin-top:0}
  .brief{background:linear-gradient(135deg,#fff7e0,#fff);border:1px solid #ffe3a1;border-radius:14px;padding:16px}
  .brief textarea{background:transparent;border-color:#ffe3a1;font-size:15.5px}
  .listrow{display:flex;gap:8px;align-items:center;margin-bottom:6px}
  .listrow input{flex:1;padding:9px 12px;font-size:14px}
  .rubric-wrap{overflow-x:auto}
  table.rubric{width:100%;border-collapse:separate;border-spacing:0;font-size:13px;min-width:720px}
  table.rubric th{background:var(--navy);color:#fff;padding:9px 10px;text-align:left;font-size:12.5px}
  table.rubric th:first-child{border-radius:10px 0 0 0} table.rubric th:last-child{border-radius:0 10px 0 0}
  table.rubric td{border-bottom:1px solid var(--line);border-right:1px solid var(--line);vertical-align:top;padding:0}
  table.rubric td:first-child{border-left:1px solid var(--line);background:#f8faff}
  table.rubric textarea{border:0;border-radius:0;min-height:96px;font-size:13px;padding:9px 10px;background:transparent;resize:vertical}
  table.rubric .crit{font-weight:800;color:var(--navy)}
  table.rubric .link{display:block;font-size:11px;font-weight:700;color:var(--lilac);padding:0 10px 9px}
  .fmt{display:inline-flex;gap:6px;align-items:center}
  /* classes */
  .auth{max-width:460px}
  .auth .fields{grid-template-columns:1fr;margin:0}
  .tabs{display:flex;gap:6px;margin-bottom:16px}
  .tabs button{flex:1;padding:10px;border-radius:10px;font-weight:800;background:var(--bg);color:var(--muted)}
  .tabs button.on{background:var(--navy);color:#fff}
  .ok{background:#e6f7ec;border:1px solid #bfe8cf;color:#1f7a4d;border-radius:12px;padding:10px 14px;font-size:13.5px;margin-bottom:14px}
  .codebox{display:flex;gap:14px;flex-wrap:wrap}
  .codebox > div{flex:1;min-width:220px;background:var(--sky);border-radius:14px;padding:14px 16px}
  .codebox b{display:block;font-size:26px;letter-spacing:4px;color:var(--navy);margin:4px 0}
  .codebox a{color:var(--blue);font-weight:700;font-size:13px;word-break:break-all}
  .kids{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px}
  .kid{border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;align-items:center;gap:10px;text-align:left;background:#fff}
  .kid:hover{border-color:#c9d3e6}
  .kid .p{font-size:28px}
  .kid b{display:block;color:var(--navy)} .kid small{color:var(--muted);font-size:12px}
  .wonders{display:flex;flex-wrap:wrap;gap:8px}
  .wbub{padding:9px 12px;border-radius:16px;font-size:13.5px;font-weight:700;line-height:1.35;background:#fff1c9}
  .wbub small{display:block;font-size:11px;color:var(--muted);font-weight:800;margin-bottom:2px}
  .entry{border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:10px;position:relative}
  .entry h4{color:var(--navy);font-size:14.5px;margin-bottom:4px}
  .entry p{font-size:14px;line-height:1.5;white-space:pre-wrap}
  .entry small{color:var(--muted);font-size:12px}
  .entry .del{position:absolute;top:10px;right:12px}
  .themebox{background:linear-gradient(135deg,#effaf4,#fff);border-color:#bfe8cf}
  .themebox p{font-size:15px;line-height:1.6;color:var(--ink)}
  /* ATL growth */
  .atl-grid{width:100%;border-collapse:separate;border-spacing:0;font-size:13.5px}
  .atl-grid th{background:var(--navy);color:#fff;padding:10px;text-align:left;font-size:12.5px;position:sticky;top:0}
  .atl-grid th:first-child{border-radius:10px 0 0 0} .atl-grid th:last-child{border-radius:0 10px 0 0}
  .atl-grid td{border-bottom:1px solid var(--line);padding:8px 10px;vertical-align:middle}
  .atl-grid td.nm{font-weight:800;color:var(--navy);white-space:nowrap}
  .cell{width:100%;min-height:44px;border:1.5px dashed #d6dcea;border-radius:12px;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 10px;text-align:left}
  .cell:hover{border-color:var(--blue);background:var(--sky)}
  .lvl{display:inline-block;font-size:12px;font-weight:800;padding:4px 9px;border-radius:999px;color:#fff}
  .lvl0{background:#cbd2e0;color:#475066}
  .selfx{font-size:18px}
  .modal-bg{position:fixed;inset:0;background:rgba(20,50,92,.35);display:grid;place-items:center;z-index:40}
  .modal{background:#fff;border-radius:18px;padding:22px;width:min(520px,92vw);max-height:88vh;overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.25)}
  .lvlbtns{display:grid;grid-template-columns:repeat(auto-fit,minmax(100px,1fr));gap:8px;margin:12px 0}
  .lvlbtn{border:2px solid var(--line);border-radius:12px;padding:12px 8px;font-weight:800;color:var(--navy);background:#fff}
  .lvlbtn.on{border-color:var(--blue);background:var(--sky)}
  .bar{height:12px;border-radius:8px;background:#eef1f7;overflow:hidden;flex:1}
  .bar i{display:block;height:100%;border-radius:8px}
  .hist{font-size:13px;border-left:3px solid var(--line);padding:6px 0 6px 12px;margin-left:4px}
  .hist b{color:var(--navy)}
  .libgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px}
  .libcard{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;transition:.2s}
  .libcard:hover{box-shadow:0 10px 24px rgba(20,50,92,.08);transform:translateY(-2px)}
  .libtop{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
  .kind{font-size:11px;font-weight:800;padding:3px 8px;border-radius:999px}
  .kind.routine{background:#f1edff;color:#5b3fd1} .kind.organiser{background:#e6f7ec;color:#1f7a4d}
  .libcard h4{color:var(--navy);font-size:16px}
  .libcat{font-size:11.5px;font-weight:800;color:var(--blue);margin:2px 0 6px}
  .libcard p{font-size:13px;color:var(--muted);line-height:1.45;flex:1}
  .oiboard{display:grid;grid-template-columns:repeat(7,minmax(112px,1fr));gap:10px;overflow-x:auto;padding-bottom:6px}
  .oicol{background:#eef2f9;border-radius:14px;padding:8px;min-height:200px}
  .oihead{font-size:12.5px;font-weight:800;color:var(--navy);padding:4px 4px 8px;display:flex;justify-content:space-between}
  .oihead span{background:#fff;border-radius:999px;padding:0 8px}
  .oicard{display:block;width:100%;text-align:left;background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px;margin-bottom:8px;font-size:13px}
  .oicard:hover{border-color:var(--blue)}
  .oicard b{display:block;color:var(--navy);margin-bottom:3px}
  .oicard span{color:var(--muted);line-height:1.35;display:block}
  .oicard em{display:block;font-style:normal;font-size:11px;font-weight:800;color:var(--leaf);margin-top:4px}
  .oicard.idle{opacity:.6}
  .reader{font-family:Georgia,"Times New Roman",serif;font-size:19px;line-height:1.75;color:#1d2433}
  .reader p{margin-bottom:14px}
  .reader[dir=rtl]{font-family:"Geeza Pro",Arial,sans-serif;text-align:right}
  .tgarden{border-radius:16px;overflow:hidden;background:linear-gradient(#cfe9ff,#f0f8ff 70%);margin-top:8px}
  .tsky{text-align:right;padding:8px 16px 0;font-size:30px}
  .tbed{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;align-items:flex-end;padding:4px 12px 0;min-height:140px}
  .tplant{width:132px;display:flex;flex-direction:column;align-items:center;text-align:center;background:none;padding:4px;border-radius:12px}
  .tplant:hover{background:rgba(255,255,255,.6)}
  .tpl{font-size:52px;line-height:1;transform-origin:bottom center;animation:tsway 3.5s ease-in-out infinite}
  @keyframes tsway{50%{transform:rotate(4deg)}}
  .tplant b{font-size:13px;color:var(--navy);margin-top:4px} .tplant small{font-size:11.5px;color:#475066;line-height:1.3}
  .tplant em{font-style:normal;font-size:10.5px;font-weight:800;color:var(--coral)}
  .tplant.idle{opacity:.7}
  .tsoil{height:30px;background:linear-gradient(#8b5a33,#6e4426);border-top:6px solid #5f9e3c}
  /* units list */
  .unit-row{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:14px 0;border-bottom:1px dashed var(--line)}
  .unit-row:last-child{border:0}
  .unit-row h4{color:var(--navy);font-size:15px}
  .unit-row p{font-size:13px;color:var(--muted);margin-top:2px}
  .empty{text-align:center;padding:40px 20px;color:var(--muted)}
  /* loading + toast */
  .loading{position:fixed;inset:0;background:rgba(20,50,92,.35);display:none;place-items:center;z-index:50}
  .loading.show{display:grid}
  .loading div{background:#fff;border-radius:18px;padding:26px 34px;text-align:center;font-weight:800;color:var(--navy);box-shadow:0 20px 50px rgba(0,0,0,.2)}
  .loading .bird{font-size:40px;display:block;animation:hop 1s infinite ease-in-out;margin-bottom:8px}
  @keyframes hop{50%{transform:translateY(-8px)}}
  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;padding:12px 20px;border-radius:12px;font-weight:700;font-size:14px;opacity:0;transition:.3s;pointer-events:none;z-index:60}

  /* ===== New WonderNest style: Look closer. Wonder more. ===== */
  :root{--navy:#1f4fb0;--blue:#3b82e0;--sky:#eaf3ff;--sun:#f5b921;--ink:#1b2540;--muted:#5b6782;--line:#e3e9f4;--bg:#f5f9ff}
  body{font-family:"DM Sans","Nunito","Segoe UI",Arial,sans-serif;background:radial-gradient(900px 420px at 100% 0,#fff4d6 0,transparent 60%),#f5f9ff}
  h1,h2,h3,.f{font-family:"Fredoka","Nunito",sans-serif}
  h1{font-weight:700;font-size:30px;letter-spacing:-.2px}
  h2,h3{font-weight:600}
  .side{background:linear-gradient(180deg,#1f4fb0 0,#163c8a 100%)}
  .logo > div:last-child{font-family:"Fredoka",sans-serif;font-weight:700}
  .nav.on{background:rgba(255,255,255,.16);box-shadow:inset 3px 0 0 var(--sun)}
  .card{border-radius:22px;border-color:var(--line);box-shadow:0 6px 18px rgba(31,79,176,.05)}
  .label{color:var(--blue);letter-spacing:1.4px}
  .step{border-radius:14px}
  .step.now{box-shadow:0 0 0 3px rgba(59,130,224,.15)}
  .step.done b{background:var(--sun);color:#1b2540}
  .theme{border-radius:18px}
  .theme:hover{border-color:#cfe0fb}
  .theme.sel{border-color:var(--sun);background:#fffaea}
  .theme.sel:after{background:var(--sun);color:#1b2540}
  .btn{background:var(--navy);border-radius:14px;font-weight:700;box-shadow:0 6px 14px rgba(31,79,176,.18)}
  .btn:hover{background:var(--blue);filter:none}
  .btn.ghost{background:#fff;color:var(--navy);border:1.5px solid var(--navy);box-shadow:none}
  .btn.ghost:hover{background:var(--sky)}
  textarea,input[type=text],select{border-radius:14px}
  textarea:focus,input:focus,select:focus{border-color:var(--blue);box-shadow:0 0 0 4px rgba(59,130,224,.13)}
  /* ===== Uploaded programme of inquiry ===== */
  .pu-drop{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;border:2.5px dashed #b9cff3;border-radius:22px;padding:34px 20px;background:linear-gradient(180deg,#f5f9ff,#fffdf6);cursor:pointer;transition:.2s}
  .pu-drop:hover,.pu-drop.on{border-color:var(--blue);background:#eef5ff}
  .pu-drop img{width:84px}.pu-drop b{font-family:"Fredoka",sans-serif;font-size:21px;color:var(--navy)}.pu-drop>span{color:var(--muted);font-size:14px}
  .pu-types{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:6px}.pu-types i{font-style:normal;background:#fff;border:1px solid var(--line);border-radius:999px;padding:5px 12px;font-size:13px;font-weight:700;color:var(--navy)}
  .pu-tips{padding-left:20px;font-size:14px;line-height:1.6;color:var(--ink)}
  .pu-busy{display:flex;align-items:center;gap:14px;font-size:16px;color:var(--navy)}.pu-busy img{width:60px;animation:puBob 1.2s ease-in-out infinite}

  .pu-review{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;background:#fff7dc;border:1.5px solid #f5d77a;border-radius:18px;padding:14px 18px;margin-bottom:16px}

  .pu-scroll{overflow-x:auto;border-radius:20px;box-shadow:0 6px 18px rgba(31,79,176,.06);background:#fff;border:1px solid var(--line)}
  .pu-grid{border-collapse:separate;border-spacing:0;min-width:1100px;width:100%}
  .pu-grid thead th{position:sticky;top:0;background:linear-gradient(180deg,#1f4fb0,#2b5fc4);color:#fff;font-family:"Fredoka",sans-serif;font-weight:600;font-size:14px;padding:12px 10px;text-align:left;vertical-align:bottom}

  .pu-grid td.pu-gap{background:#fbfcff}
  .pu-card{position:relative;background:#f5f9ff;border:1px solid #dfe9fb;border-radius:14px;padding:11px 12px;margin-bottom:8px;font-size:12.8px;line-height:1.45}

  .pu-title{font-family:"Fredoka",sans-serif;font-weight:600;color:#6b4e00;font-size:13.5px;margin-bottom:3px;padding-right:22px}
  .pu-ci{font-weight:800;color:var(--navy);font-size:13.5px;padding-right:20px}
  .pu-lab{font-size:10.5px;font-weight:800;letter-spacing:.7px;text-transform:uppercase;color:var(--blue);margin:8px 0 3px}
  .pu-loi{padding-left:16px;margin:0}.pu-loi li{margin:2px 0}
  .pu-k,.pu-r,.pu-a{display:inline-block;font-size:11px;font-weight:800;border-radius:7px;padding:2px 7px;margin:2px 3px 2px 0}

<script>
/* Softer, more natural reading voice: prefer the best female voices on each device */
(function(){
  if(!window.speechSynthesis) return;
  const EN = ["Samantha (Enhanced)","Samantha (Premium)","Serena (Premium)","Serena (Enhanced)","Kate (Enhanced)","Stephanie (Enhanced)","Martha (Enhanced)","Karen (Enhanced)","Moira (Enhanced)",
    "Microsoft Sonia Online (Natural)","Microsoft Libby Online (Natural)","Microsoft Aria Online (Natural)","Microsoft Jenny Online (Natural)","Google UK English Female","Samantha","Serena","Kate","Stephanie","Martha","Karen","Moira","Tessa","Microsoft Hazel","Microsoft Zira"];
  const AR = ["Majed (Enhanced)","Laila","Mariam","Microsoft Salma Online (Natural)","Microsoft Fatima Online (Natural)","Microsoft Zariyah Online (Natural)","Microsoft Hoda","Google العربية"];
  let voices = []; const load = () => { voices = speechSynthesis.getVoices() || []; };
  load(); speechSynthesis.addEventListener && speechSynthesis.addEventListener("voiceschanged", load);
  const pick = lang => {
    const ar = String(lang || "").startsWith("ar"), list = ar ? AR : EN;
    for(const n of list){ const v = voices.find(x => x.name === n) || voices.find(x => x.name.startsWith(n)); if(v) return v; }
    const pref = voices.filter(x => x.lang && x.lang.toLowerCase().startsWith(ar ? "ar" : "en"));
    return pref.find(x => /natural|enhanced|premium|female/i.test(x.name)) || pref.find(x => /en-GB/i.test(x.lang)) || pref[0] || null;
  };
  const orig = speechSynthesis.speak.bind(speechSynthesis);
  try{
    speechSynthesis.speak = function(u){
      if(!voices.length) load();
      if(!u.voice){ const v = pick(u.lang || "en-GB"); if(v){ u.voice = v; u.lang = v.lang; } }
      if(!u.rate || u.rate >= .95) u.rate = .9;
      u.pitch = 1.08; u.volume = .95;
      orig(u);
    };
  }catch(e){}
})();
</script>
<script>
// WonderNest: true SDG stories. Each story was checked against the sources listed. Retold in WonderNest's own words for children.
const SDG_STORIES = [
{id:"hannah-taylor", sdgs:[1,10], title:"Hannah and the Ladybug Jars", who:"Hannah Taylor", place:"Winnipeg, Canada", when:"2004", ages:"5+", emoji:"🐞",
 story:"On a freezing winter day in Winnipeg, Canada, five-year-old Hannah saw a man looking for food in a rubbish bin. She could not stop thinking about him. \"Why doesn't he have a home?\" she asked her mum. \"If everyone shared what they had, would that help?\"\n\nHannah decided to do something. In Grade 1 she talked to her teacher, and her class raised money for a local shelter. Hannah painted jars with ladybugs, because ladybugs mean good luck, and asked people to fill them with coins.\n\nWhen she was eight, Hannah started the Ladybug Foundation. It helps charities give food, shelter and care to people who have no home. Hannah gave speeches all over Canada. Her big message was simple: people who are homeless are just like you and me, and they need us to care.",
 questions:["What did Hannah notice, and how did it make her feel?","Why do you think Hannah chose a ladybug?","Who in our community might need care, and how could we find out?"],
 actions:["Find out about a charity near your school that helps people in need.","Make a kindness jar for a cause your class cares about."],
 sources:[["The Ladybug Foundation story (NFB film, Hannah's Story)","https://www.nfb.ca/film/hannahs_story"],["McGill Reporter","https://reporter.mcgill.ca/hannah-taylor-wrong-turn-sets-her-on-the-right-path/"]]},

{id:"ryan-hreljac", sdgs:[6,3], title:"Ryan's Well", who:"Ryan Hreljac", place:"Kemptville, Canada and Angolo, Uganda", when:"1998", ages:"5+", emoji:"💧",
 story:"In January 1998, six-year-old Ryan was sitting in his Grade 1 class in Canada. His teacher explained that many children in the world get sick because they do not have clean water to drink. Some walk a very long way every day to fetch it.\n\nRyan was shocked. He did extra jobs at home to earn money, because he thought 70 dollars would be enough to build a well. It wasn't! A well cost much more. But Ryan did not give up. He talked to classes and clubs and anyone who would listen.\n\nIn 1999, Ryan's first well was built at Angolo Primary School in Uganda. In 2001, with his family's help, he started Ryan's Well Foundation. It has helped build hundreds of wells and toilets in many countries. Ryan's motto: little kids really can have big ideas.",
 questions:["How far do you walk to get a drink of water? How would life change if you had to walk for hours?","Ryan's first plan did not work. What did he do next?","Why is clean water connected to health and to going to school?"],
 actions:["Measure how much water your class uses in one day, and find ways to save some.","Make posters about why clean water matters."],
 sources:[["Ryan's Well Foundation: Our Story","https://ryanswell.ca/about-us/our-story"],["World of Children: Ryan Hreljac","https://worldofchildren.org/honoree/ryan-hreljac/"]]},

{id:"william-kamkwamba", sdgs:[7,9,4], title:"The Boy Who Harnessed the Wind", who:"William Kamkwamba", place:"Masitala, Malawi", when:"2002", ages:"7+", emoji:"🌬️",
 story:"William lived in a farming village in Malawi. When he was a teenager, a terrible drought made the crops fail, and his family could not pay for school. William had to stop going.\n\nBut William loved science. He went to a small library and found a book called Using Energy. It had a picture of a windmill. William thought: if the wind can turn a windmill, maybe it can make electricity!\n\nHe collected scrap metal, an old bicycle, plastic pipes and tractor parts from a scrapyard. People laughed and called him crazy. William kept building. At 14, his windmill made enough electricity to light his family's house. Later, another windmill pumped water for the crops.\n\nWilliam went on to study at university and helps young people in his village to become inventors too.",
 questions:["What problem was William trying to solve?","How did a library book change William's life?","What materials could you reuse to build something useful?"],
 actions:["Design and build a model windmill from recycled materials.","Find out where the electricity in your school comes from."],
 sources:[["Britannica: William Kamkwamba","https://www.britannica.com/biography/William-Kamkwamba"],["TED: William Kamkwamba","https://www.ted.com/speakers/william_kamkwamba"]]},

{id:"kehkashan-basu", sdgs:[13,15,16], title:"Kehkashan's Green Hope", who:"Kehkashan Basu", place:"Dubai, United Arab Emirates", when:"2012", ages:"7+", emoji:"🌱",
 story:"Kehkashan was born in Dubai on 5 June, which is World Environment Day. Maybe that is why she has always cared about the planet!\n\nKehkashan began campaigning for the environment when she was very young. When she was 12, she started Green Hope, a group where children and young people learn about the environment and take action. They clean beaches, collect waste and plant trees, and they teach other children about the Sustainable Development Goals.\n\nGreen Hope grew and grew. Soon it was active in many countries with more than a thousand young volunteers. In 2016, when she was 16 and a student in Dubai, Kehkashan won the International Children's Peace Prize. Her message: children should have a say in how we protect the planet, because it is their future.",
 questions:["Why does Kehkashan think children should help make decisions about the planet?","What problems did Green Hope work on?","What could children in our school take care of?"],
 actions:["Organise a clean-up of your playground or a nearby beach or park.","Write a letter to your school leaders with one idea to help the environment."],
 sources:[["The National: UAE teen wins International Children's Peace Prize","https://www.thenationalnews.com/uae-teen-wins-international-children-s-peace-prize-1.227530"],["Gulf News","https://gulfnews.com/going-out/society/schoolgirl-from-uae-wins-childrens-peace-prize-1.1938880"]]},

{id:"felix-finkbeiner", sdgs:[13,15], title:"Felix and a Million Trees", who:"Felix Finkbeiner", place:"Bavaria, Germany", when:"2007", ages:"5+", emoji:"🌳",
 story:"When Felix was nine years old, his teacher asked the class to give a presentation about climate change. While he was researching, Felix read about Wangari Maathai, a woman in Kenya who had helped plant millions of trees. Trees, he learned, take in carbon dioxide and help to cool our planet.\n\nAt the end of his talk, Felix said: \"Let's plant one million trees in every country of the world!\" He had no idea how many a million trees was!\n\nA few weeks later, on 28 March 2007, Felix and his classmates planted a crab apple tree in front of their school. Other schools joined in. Within three years, children in Germany had planted one million trees. Felix's idea became Plant-for-the-Planet, which helps children around the world plant trees and speak up for the climate. At 13, Felix spoke at the United Nations.",
 questions:["Whose story inspired Felix?","Why are trees important for our planet?","Felix's goal sounded impossible. Why did it work?"],
 actions:["Plant a tree or seeds at school and look after them.","Count the trees around your school and make a map."],
 sources:[["UNEP: Felix Finkbeiner","https://www.unep.org/blogs/2019-09/climate-leadership-inspires/felix-finkbeiner"],["Plant-for-the-Planet: Felix Finkbeiner","https://www.plant-for-the-planet.org/felix-finkbeiner/"]]},
{id:"katie-stagliano", sdgs:[2,12], title:"Katie's Giant Cabbage", who:"Katie Stagliano", place:"Summerville, South Carolina, USA", when:"2008", ages:"5+", emoji:"🥬",
 story:"When Katie was nine and in Grade 3, her teacher gave every child a tiny cabbage seedling to plant at home. Katie planted hers in the garden and looked after it every single day. It grew, and grew, and grew, until it weighed about 18 kilograms (40 pounds)! Most cabbages weigh only one or two kilograms.\n\nKatie knew her cabbage was special. She gave it to a soup kitchen, a place that serves free meals to people who need them. The cooks made it into a meal with ham and rice, and Katie helped to serve it. Her one cabbage helped feed 275 people!\n\nKatie thought: \"If one cabbage can feed this many people, imagine how many a whole garden could feed!\" So she started Katie's Krops. Today children all over the USA grow vegetable gardens and give the food to people who are hungry.",
 questions:["Why did Katie's cabbage grow so big?","What did Katie notice when she visited the soup kitchen?","What could we grow at school, and who could we share it with?"],
 actions:["Plant a class vegetable garden, even in pots.","Find out about food banks or community fridges near you."],
 sources:[["girlshealth.gov: Katie's Krops","https://girlshealth.gov/node/7315"],["College of Charleston: Meet Katie Stagliano","https://today.cofc.edu/2019/01/17/meet-katie-stagliano-cabbage-patch-kid/"]]},

{id:"bye-bye-plastic-bags", sdgs:[12,14,17], title:"Bye Bye Plastic Bags", who:"Melati and Isabel Wijsen", place:"Bali, Indonesia", when:"2013", ages:"6+", emoji:"🛍️",
 story:"Melati and Isabel are sisters who grew up on the beautiful island of Bali. But everywhere they looked they saw plastic bags: on the beaches, in the sea and even in the rice fields. They learned that only a tiny number of plastic bags in Bali were recycled.\n\nAt school they had been learning about people who changed the world. \"Why wait until we are older?\" they asked. In 2013, when they were just 12 and 10, they started a campaign called Bye Bye Plastic Bags.\n\nThey organised beach clean-ups, gave talks in schools and asked shops to stop handing out plastic bags. They collected 100,000 signatures asking for a ban, and kept meeting the leaders of Bali. Bali's governor promised to work towards a ban. Their campaign has spread to teams of young people in many countries around the world.",
 questions:["What problem did the sisters see?","Why do you think 100,000 signatures made leaders listen?","How many plastic bags does your family use in a week?"],
 actions:["Count the single-use plastic in your classroom bin for one week.","Make reusable bags from old T-shirts."],
 sources:[["NPR: How teenage sisters pushed Bali to say bye-bye to plastic bags","https://www.npr.org/688168838"],["CNN: The teenagers getting plastic bags banned in Bali","https://amp.cnn.com/cnn/2017/08/16/asia/melati-isabel-wijsen-bali"]]},

{id:"kelvin-doe", sdgs:[9,7,4], title:"DJ Focus and the Scrap-Metal Radio", who:"Kelvin Doe", place:"Freetown, Sierra Leone", when:"2009", ages:"7+", emoji:"📻",
 story:"In Kelvin's neighbourhood in Freetown, Sierra Leone, the electricity hardly ever came on. Sometimes it worked only once a week. Batteries cost too much for most families.\n\nKelvin was about 13 and he loved taking things apart. He searched rubbish bins for scrap metal, old wires and broken electronics. Teaching himself, he built his own battery to make lights for his neighbours. Then he built a generator, and then a radio transmitter!\n\nWith it, Kelvin started his own community radio station. He called himself DJ Focus, because, he said, if you focus you can make an invention work. He played music and shared local news, and his friends helped too.\n\nKelvin entered a competition for young inventors in Sierra Leone. Soon after, at 15, he was invited to visit MIT in the USA, one of the most famous science universities in the world.",
 questions:["What problems did Kelvin solve for his neighbourhood?","Why do you think Kelvin called himself DJ Focus?","What could you invent from things other people throw away?"],
 actions:["Set up an inventors' table with recycled materials.","Make a class radio show or podcast about your community."],
 sources:[["MIT Alumni: From Sierra Leone, Focus Comes to MIT","https://alum.mit.edu/node/1292"],["The World (PRX): DJ Focus at MIT","https://theworld.org/stories/2013/08/15/dj-focus-becomes-youngest-visiting-practitioner-mit"]]},

{id:"shubham-banerjee", sdgs:[10,4,9], title:"Shubham's Braille Printer", who:"Shubham Banerjee", place:"Santa Clara, California, USA", when:"2014", ages:"7+", emoji:"⠃",
 story:"One day, 12-year-old Shubham saw a leaflet asking for donations for people who are blind. He asked his parents a simple question: \"How do blind people read?\" They told him to look it up.\n\nShubham learned about Braille, a way of reading with your fingers by feeling patterns of raised dots. He also learned that Braille printers cost 2,000 dollars or more. Many people could not afford one.\n\nShubham decided to build a cheaper one for his school science fair, using his favourite toy: a Lego robotics kit! He built and broke seven different models, working late into the night. Finally his printer, called Braigo (Braille + Lego), printed its first letter. It cost about 350 dollars to make.\n\nShubham shared his design for free so anyone could build one, and went on to start a company to make low-cost Braille printers.",
 questions:["What question started Shubham's invention?","Why does the cost of something matter for fairness?","Shubham failed six times. What helped him keep going?"],
 actions:["Learn the Braille alphabet and make a Braille message with glue dots.","Check how easy your school is to use for someone who cannot see."],
 sources:[["NPR: Boy builds Braille printer out of Lego","https://www.npr.org/transcripts/281113200"],["Live Science: 12-year-old invents Braille printer","https://www.livescience.com/43455-lego-braille-printer.html"]]},

{id:"babar-ali", sdgs:[4,1], title:"The School Under the Guava Tree", who:"Babar Ali", place:"Murshidabad, West Bengal, India", when:"2002", ages:"6+", emoji:"📚",
 story:"Babar was lucky: he went to school. But on his way home, he saw many children from his village who could not go, because their families were poor and they had to work, collecting rubbish to sell.\n\nWhen he was nine, Babar had an idea. Every afternoon after his own lessons, he would teach them! He started in the backyard of his family's home, under a guava tree, with eight children, including his sister. He collected broken pieces of chalk to use, and he was the headmaster, teacher and helper all at once.\n\nMore and more children came. His school was named Ananda Shiksha Niketan, which means Home of Joyful Learning. When Babar was 16, the BBC called him the youngest headmaster in the world. Today his free school teaches hundreds of children.",
 questions:["What did Babar notice on his way home from school?","Why do you think he called it the Home of Joyful Learning?","What is something you know well enough to teach someone else?"],
 actions:["Run a 'learning swap' where children teach each other a skill.","Collect books or stationery for a school or library that needs them."],
 sources:[["TED: Babar Ali, Education for all","https://www.ted.com/talks/babar_ali_education_for_all"],["Onmanorama: How the world's youngest headmaster began at 9","https://www.onmanorama.com/lifestyle/news/2018/10/01/how-world-youngest-headmaster-began-his-crusade-at-9.html"]]},

{id:"moziah-bridges", sdgs:[8], title:"Mo's Bows", who:"Moziah \"Mo\" Bridges", place:"Memphis, Tennessee, USA", when:"2011", ages:"5+", emoji:"🎀",
 story:"Mo loved dressing up, even on the playground! When he was nine, he wanted a cool bow tie, but the ones in the shops were boring or too expensive.\n\nSo Mo asked his grandmother, who had been a seamstress, to teach him to sew. Using her leftover scraps of fabric, he made colourful bow ties at the kitchen table. Family and friends wanted them too, and Mo started a business called Mo's Bows.\n\nIt was hard work. Mo, his mum and his grandmother stitched every tie by hand. Mo learned about prices, customers and saying yes to good chances. He even appeared on a TV show for business people, where a famous businessman offered to be his mentor instead of just giving him money.\n\nMo's Bows grew into a real company that gives people jobs. Mo's motto: \"If you look good, you feel good.\"",
 questions:["What problem did Mo want to solve?","Who helped Mo, and what did he learn from them?","What makes a job a good job?"],
 actions:["Plan a small class business or market stall and decide what to do with the money.","Interview a family member about their job."],
 sources:[["Inc.: How this 16-year-old founder built a bow tie business","https://www.inc.com/emily-canal/how-this-young-entrepreneur-got-the-best-deal-on-shark-tank-with-daymond-john.html"],["NPR: 15-year-old CEO of Mo's Bows","https://www.npr.org/2017/07/21/538608499/15-year-old-ceo-of-mos-bows-enters-licensing-deal-with-nba"]]},
{id:"boyan-slat", sdgs:[14,12,9], title:"More Plastic Than Fish", who:"Boyan Slat", place:"Delft, the Netherlands", when:"2011", ages:"6+", emoji:"🌊",
 story:"When Boyan was 16, he went scuba diving on holiday in Greece. He hoped to see beautiful fish. Instead, he saw more plastic bags than fish!\n\nBoyan came up out of the water with one question: \"Why can't we just clean this up?\" Many grown-ups said it was impossible, because the ocean is so big and the plastic keeps moving.\n\nFor a school science project, Boyan spent half a year studying the problem. He had an idea: instead of chasing the rubbish around the ocean, why not let the ocean currents carry the plastic to a cleaning machine that waits in one place?\n\nIn 2012 he shared his idea in a TEDx talk. At first, hardly anyone noticed. Then the video was shared millions of times. Boyan started The Ocean Cleanup, a team of engineers and scientists who build systems to collect plastic from the ocean and from rivers before it reaches the sea.",
 questions:["What question did Boyan ask?","Why did people think his idea was impossible?","Where does the plastic in the ocean come from?"],
 actions:["Track how much plastic your class throws away and set a goal to reduce it.","Design a model that uses moving water to collect floating rubbish."],
 sources:[["The Ocean Cleanup: How it all began","https://theoceancleanup.com/milestones/how-it-all-began/"],["UNEP Champions of the Earth: Boyan Slat","https://www.unep.org/championsofearth/laureates/2014/boyan-slat"]]},

{id:"wangari-maathai", sdgs:[15,5,13], title:"Wangari, Mother of Trees", who:"Wangari Maathai", place:"Kenya", when:"1977", ages:"5+", emoji:"🌳",
 story:"Wangari grew up in Kenya surrounded by green hills, streams and fig trees. As a grown-up she became a scientist, the first woman in East and Central Africa to earn a doctorate degree.\n\nWangari listened to women in the countryside. They told her that the streams were drying up, there was not enough firewood, and the soil was washing away. The trees had been cut down.\n\nWangari had a simple answer: plant trees! On World Environment Day in 1977, she and a group of women planted seven trees in Nairobi. That was the start of the Green Belt Movement. Wangari taught women to collect seeds, grow seedlings and plant them, and they were paid for every tree that survived.\n\nThe movement spread, and tens of millions of trees were planted. In 2004 Wangari became the first African woman to win the Nobel Peace Prize.",
 questions:["What problems did the women tell Wangari about?","How do trees help people, animals and the soil?","Why do you think planting trees was linked to peace?"],
 actions:["Grow seedlings from seeds in class and give them to families.","Find out which trees are native to your country."],
 sources:[["NobelPrize.org: Wangari Maathai","https://www.nobelprize.org/prizes/peace/2004/maathai/"],["Britannica: Wangari Maathai","https://www.britannica.com/biography/Wangari-Maathai"]]},

{id:"montreal-protocol", sdgs:[17,13,3], title:"How the World Fixed the Sky", who:"Every country in the world", place:"Worldwide", when:"1987", ages:"7+", emoji:"🌍",
 story:"High above us is the ozone layer, an invisible shield of gas that protects living things from the sun's harmful rays. In the 1980s, scientists discovered something worrying: there was a hole in the ozone layer!\n\nThey found out why. Some chemicals used in fridges, air conditioners and spray cans were floating up into the sky and destroying the ozone.\n\nIn 1987, countries met and signed an agreement called the Montreal Protocol. They promised to stop using the harmful chemicals and to find safer ones. Over the years, every single country in the world signed it. It was the first UN agreement that every country agreed to!\n\nIt worked. Almost all of the harmful chemicals have now stopped being used, and scientists say the ozone layer is slowly healing. It should recover by around the middle of this century. It shows what can happen when the whole world works together.",
 questions:["What is the ozone layer, and why do we need it?","Why was it important that every country joined in?","What other problem could the world solve by working together?"],
 actions:["Hold a class 'summit' where groups agree on one rule to help the planet.","Make a poster for World Ozone Day on 16 September."],
 sources:[["UNEP Ozone Secretariat","https://ozone.unep.org/node/13112"],["UNEP: Thirty years on, the Montreal Protocol","https://www.unep.org/news-and-stories/story/thirty-years-what-montreal-protocol-doing-protect-ozone"]]},

{id:"masdar-city", sdgs:[11,7,13], title:"A Cool City in the Desert", who:"Masdar City", place:"Abu Dhabi, United Arab Emirates", when:"2006", ages:"6+", emoji:"🏙️",
 story:"Abu Dhabi is one of the hottest places on Earth. How can people build a city there that uses less energy and stays cool? That was the big question behind Masdar City, which began in 2006.\n\nThe designers looked at clever ideas from the past. Old towns in the Gulf had narrow, shady streets and wind towers called barjeel that catch breezes. So Masdar City has narrow streets that point towards the cooling winds, buildings close together to make shade, and a 45-metre-tall modern wind tower.\n\nThe streets can feel several degrees cooler than the open desert. Solar panels on roofs and in a nearby solar farm make clean electricity. The city is designed for walking and cycling, and its buildings use materials that save energy and water.\n\nMasdar City is still growing, and people from around the world visit to learn from it.",
 questions:["What ideas from the past did the designers use?","Why is it important for cities in hot places to stay cool without using lots of energy?","What would you change in your neighbourhood to make it better for people and the planet?"],
 actions:["Measure the temperature in sunny and shady places around school.","Design your own model of an eco-friendly street."],
 sources:[["Masdar City: Sustainable design","https://masdarcity.ae/sustainable-urban-development/sustainable-design"],["AramcoWorld: Chasing Zero","https://www.aramcoworld.com/articles/2017/chasing-zero"]]},

{id:"malala-yousafzai", sdgs:[4,5,16], title:"Malala's Voice for Girls' Education", who:"Malala Yousafzai", place:"Swat Valley, Pakistan", when:"2009", ages:"8+", emoji:"✏️",
 story:"Malala grew up in the beautiful Swat Valley in Pakistan. She loved school, and her father ran a school too. But when she was 11, a group that had taken control of the area said that girls were not allowed to go to school.\n\nMalala did not stay quiet. She wrote a diary for the BBC, under a different name, about how much she wanted to learn. Later she spoke on television and in newspapers: every girl has the right to an education.\n\nWhen she was 15, people who wanted to stop her attacked her on her school bus. She was badly hurt, but she recovered, and she kept speaking out even more strongly.\n\nIn 2014, when she was 17, Malala became the youngest person ever to win the Nobel Peace Prize. She heard the news at school, and finished her school day first! Her Malala Fund helps girls around the world go to school.",
 questions:["Why did Malala think education was worth speaking up for?","What does it mean to have a right?","How can we make sure everyone in our school has a fair chance to learn?"],
 actions:["Write a class charter about everyone's right to learn.","Find out how many children in the world do not go to school, and share it."],
 sources:[["NobelPrize.org: Malala Yousafzai biography","https://www.nobelprize.org/prizes/peace/2014/yousafzai/biographical/"],["History.com: Malala wins the Nobel Prize","https://www.history.com/this-day-in-history/malala-wins-nobel-prize"]]},

{id:"gitanjali-rao", sdgs:[3,6,9], title:"Gitanjali's Water Detective", who:"Gitanjali Rao", place:"Colorado, USA", when:"2017", ages:"7+", emoji:"🔬",
 story:"When Gitanjali was about 10, she heard about a town called Flint in the USA. The water coming out of people's taps there had become unsafe, because it contained lead, a metal that can make people ill. Testing water was slow and needed a laboratory.\n\nGitanjali thought: what if families could test their own water, quickly, at home? She read about tiny tubes made of carbon that can sense different chemicals, and she began to design a small device.\n\nShe entered a science challenge for young people and worked with a scientist mentor for three months. Her invention, called Tethys after the Greek goddess of fresh water, sends its results to a phone.\n\nIn 2017, when she was 11, Gitanjali was named America's Top Young Scientist. Later she started workshops to help other children become problem solvers too.",
 questions:["What problem was Gitanjali trying to solve?","Why did she need a mentor?","Where does the water in your school come from, and how do we know it is safe?"],
 actions:["Investigate how water is cleaned in your city.","Pick a problem in school and follow Gitanjali's steps: observe, brainstorm, research, build, share."],
 sources:[["NPR: 11-year-old girl invents lead-detecting device","https://www.npr.org/sections/thetwo-way/2017/10/20/559071028/troubled-by-flint-water-crisis-11-year-old-girl-invents-lead-detecting-device"],["Good Morning America (ABC)","https://www.goodmorningamerica.com/news/story/11-year-girl-inspired-flint-water-crisis-creates-50559884"]]},

<script>

];
// Transdisciplinary theme descriptions (updated wording). Schools can replace them in School settings.
const THEME_DESC = {
  who: {intro:"An inquiry into identity as individuals and as part of a collective through:", strands:["Physical, emotional, social and spiritual health and wellbeing","Relationships and belonging","Learning and growing"]},
  organize: {intro:"An inquiry into systems, structures and networks through:", strands:["Interactions within and between social and ecological systems","Approaches to livelihoods and trade practices: intended and unintended consequences","Representation, collaboration and decision-making"]},
  planet: {intro:"An inquiry into the interdependence of human and natural worlds through:", strands:["Rights, responsibilities and dignity of all","Pathways of just, peaceful and reimagined futures","Nature, complexity, coexistence and wisdom"]},
  works: {intro:"An inquiry into understandings of the world and phenomena through:", strands:["Patterns, cycles, systems","Diverse practices, methods and tools","Discovery, design, innovation: possibilities and impacts"]},
  express: {intro:"An inquiry into the diversity of voice, perspectives, and expression through:", strands:["Inspiration, imagination, creativity","Personal, social and cultural modes and practices of communication","Intentions, perceptions, interpretations and responses"]},
  where: {intro:"An inquiry into histories and orientation in place, space and time through:", strands:["Periods, events and artefacts","Communities, heritage, culture and environment","Natural and human drivers of movement, adaptation, and transformation"]}
};
const defaultThemeText = id => THEME_DESC[id] ? THEME_DESC[id].intro + "\n" + THEME_DESC[id].strands.map(x => "• " + x).join("\n") : "";
const themeText = id => (settings.themeText && settings.themeText[id] && settings.themeText[id].trim()) || defaultThemeText(id);
const KEY_CONCEPTS = ["Form","Function","Causation","Change","Connection","Perspective","Responsibility"];
const ATL = {
  "Thinking":["Critical thinking","Creative thinking","Transfer","Reflection"],
  "Research":["Information literacy","Media literacy","Ethical use of information"],
  "Communication":["Exchanging information","Literacy","ICT"],
  "Social":["Interpersonal relationships","Social-emotional intelligence"],
  "Self-management":["Organization","States of mind"]
};
const LEARNER_PROFILE = ["Inquirers","Knowledgeable","Thinkers","Communicators","Principled","Open-minded","Caring","Risk-takers","Balanced","Reflective"];
const SDGS = [
  [1,"No Poverty","#E5243B"],[2,"Zero Hunger","#DDA63A"],[3,"Good Health and Well-being","#4C9F38"],[4,"Quality Education","#C5192D"],
  [5,"Gender Equality","#FF3A21"],[6,"Clean Water and Sanitation","#26BDE2"],[7,"Affordable and Clean Energy","#FCC30B"],
  [8,"Decent Work and Economic Growth","#A21942"],[9,"Industry, Innovation and Infrastructure","#FD6925"],[10,"Reduced Inequalities","#DD1367"],
  [11,"Sustainable Cities and Communities","#FD9D24"],[12,"Responsible Consumption and Production","#BF8B2E"],[13,"Climate Action","#3F7E44"],
  [14,"Life Below Water","#0A97D9"],[15,"Life on Land","#56C02B"],[16,"Peace, Justice and Strong Institutions","#00689D"],[17,"Partnerships for the Goals","#19486A"]
];
const GRADES = [
  ["Pre-K","3–4"],["KG1","4–5"],["KG2","5–6"],["Grade 1","6–7"],["Grade 2","7–8"],
  ["Grade 3","8–9"],["Grade 4","9–10"],["Grade 5","10–11"],["Grade 6","11–12"]
];
const gradeLabel = u => u.grade ? `${u.grade} (ages ${(GRADES.find(g=>g[0]===u.grade)||["",""])[1]})` : (u.ageBand ? "Ages " + u.ageBand : "");
const STEP_NAMES = ["Theme & grade","Central idea","Lines of inquiry & concepts","SDGs","Stories, routines & inquiry"];
const ROUTINE_COLOURS = ["var(--sun)","var(--blue)","var(--coral)","var(--leaf)","var(--lilac)"];

/* ---------- Supabase (public project values) ---------- */
const SUPABASE_URL = "https://zmncqutjtgwxlvrdgwiq.supabase.co";
const SUPABASE_KEY = "sb_publishable_blNQT3mGUzNadaRARkRpew_dq-tmD4J";
const SITE_URL = "https://wondernest.thinknest.education";
const db = window.supabase ? window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, { auth: { storageKey: "wondernest-teacher" } }) : null;
const PICTURES = ["🐢","🐪","⭐","🍎","🚀","🐬","🌻","🦁","🎈","🐝","🍓","⚽"];

/* ---------- storage ---------- */
const store = {
  get(k, d){ try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); return true; }catch(e){ return false; } }
};
let settings = (s => { if(s.conceptLabel === "Key concepts") s.conceptLabel = "Specified concepts"; return s; })(Object.assign({school:"", conceptLabel:"Specified concepts", rubricLevels:"Beginning, Developing, Achieving, Extending", atlLevels:"Novice, Learner, Practitioner, Expert"}, store.get("wn_settings", {})));
function newUnit(){
  return {id:(crypto.randomUUID ? crypto.randomUUID() : "u"+Date.now()), theme:"", description:"", grade:"", ageBand:"", duration:"6 weeks", languages:"English",
    centralIdeaOptions:[], centralIdea:"", lines:[], keyConcepts:[], relatedConcepts:[], atl:[], atlWhy:{},
    learnerProfile:[], sdgs:[], sdgWhy:{}, books:[], story:null, spark:"", routines:[], provocations:[], step:1, updated:null};
}
let unit = store.get("wn_current", null) || newUnit();
let view = "builder";
let error = "";

/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const themeOf = id => THEMES.find(t => t.id === id);
let _autoT = null;
function saveCurrent(){
  store.set("wn_current", unit);
  // the unit saves itself to My units (and the teacher's account) a moment after each change, once it has a central idea
  if(view === "builder" && (unit.centralIdea||"").trim()){ clearTimeout(_autoT); saveState("saving"); _autoT = setTimeout(() => saveUnit(true).then(() => saveState("saved")), 2000); }
}
function saveState(st){ const el = document.getElementById("saveState"); if(el){ el.textContent = st === "saving" ? "Saving…" : "✓ Saved"; el.classList.toggle("on", st === "saved"); } }
function toast(msg){ const t = $("#toast"); t.textContent = msg; t.classList.add("show"); setTimeout(()=>t.classList.remove("show"), 2200); }
function loading(on, text){ $("#loading").classList.toggle("show", on); if(text) $("#loadingText").textContent = text; }
function toggle(arr, v){ const i = arr.indexOf(v); i >= 0 ? arr.splice(i,1) : arr.push(v); }

/* ---------- AI ---------- */
async function ai(task, u = unit, extra = {}){
  const payload = Object.assign({theme: themeOf(u.theme)?.name || "", themeDescription: ((u.description||"").trim() ? "This unit is about: " + u.description.trim() + "\n\n" : "") + themeText(u.theme), description: u.description, ageBand: gradeLabel(u),
    duration: u.duration, languages: u.languages, centralIdea: u.centralIdea,
    lines: (u.lines||[]).map(l => l.text), keyConcepts: u.keyConcepts, atl: u.atl}, extra);
  if(!WORKER_URL){ await new Promise(r => setTimeout(r, 700)); return DEMO[task]; }
  const res = await fetch(WORKER_URL, {method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify({task, unit: payload})});
  const data = await res.json().catch(()=>({}));
  if(!res.ok) throw new Error(data.error || "The AI could not answer just now.");
  return data;
}
async function run(task, text, apply){
  error = ""; loading(true, text);
  try{ apply(await ai(task)); saveCurrent(); }
  catch(e){ error = e.message || "Something went wrong. Please try again."; }
  finally{ loading(false); render(); }
}

/* ---------- book links ---------- */
const q = b => encodeURIComponent(((b.title||"") + " " + (b.author||"")).trim());
function bookLinks(b){
  const ol = b.ol || {};
  const links = [];
  if(ol.readable) links.push(`<a class="blink read" href="${ol.url}" target="_blank" rel="noopener">📖 Read online free</a>`);
  links.push(`<a class="blink" href="${ol.url || "https://openlibrary.org/search?q=" + q(b)}" target="_blank" rel="noopener">Open Library</a>`);
  links.push(`<a class="blink" href="https://www.google.com/search?tbm=bks&q=${q(b)}" target="_blank" rel="noopener">Google Books</a>`);
  links.push(`<a class="blink" href="https://search.worldcat.org/search?q=${q(b)}" target="_blank" rel="noopener">Find in a library</a>`);
  return links.join("");
}
function bookHTML(b){
  const ol = b.ol || {};
  const cover = ol.cover ? `<img class="cover" src="${ol.cover}" alt="">` : `<div class="cover">📖</div>`;
  const warn = b.olChecked && ol.found === false ? `<div class="bwarn">⚠️ We couldn't find this book in Open Library. Please check the title and author.</div>` : "";
  return `<div class="book">${cover}<div><h4>${esc(b.title)}</h4><p>${esc(b.author)} · ${esc(b.why)}</p>${b.line?`<span class="tag">${esc(b.line)}</span>`:""}<div class="blinks">${bookLinks(b)}</div>${warn}</div></div>`;
}
let checkingBooks = false;
async function checkBooks(){
  if(checkingBooks) return;
  const todo = unit.books.filter(b => !b.olChecked);
  if(!todo.length) return;
  checkingBooks = true;
  let changed = false;
  await Promise.all(todo.map(async b => {
    try{
      const url = "https://openlibrary.org/search.json?limit=1&fields=key,cover_i,ebook_access&title=" + encodeURIComponent(b.title||"") + "&author=" + encodeURIComponent(String(b.author||"").split(/[(,]/)[0].trim());
      const r = await fetch(url); const d = await r.json(); const doc = (d.docs||[])[0];
      b.ol = doc ? {found:true, url:"https://openlibrary.org" + doc.key, cover: doc.cover_i ? `https://covers.openlibrary.org/b/id/${doc.cover_i}-M.jpg` : "", readable: ["borrowable","public"].includes(doc.ebook_access)} : {found:false};
      b.olChecked = true; changed = true;
    }catch(e){ b.olChecked = true; b.ol = null; /* offline or blocked: keep plain search links */ }
  }));
  checkingBooks = false;
  saveCurrent();
  if(changed && view === "builder" && unit.step === 5) render();
}

/* ---------- views ---------- */
const renderPlace = { at: null, msg: "", y: 0 };
window.addEventListener("scroll", () => { renderPlace.y = window.scrollY; }, { passive: true });
function render(){
  renderPlace.y = window.scrollY;
  document.querySelectorAll(".nav[data-view]").forEach(n => n.classList.toggle("on", n.dataset.view === view));
  $("#footSchool").innerHTML = esc(settings.school || "Your school") + "<br>Programme of inquiry";
  const m = $("#main");
  if(db && tc.user && sch.loaded && !sch.school && tc.mode !== "newpass"){ m.innerHTML = schoolSetupView(); window.scrollTo(0,0); return; }
  if(view === "home") m.innerHTML = homeView();
  else if(view === "settings") m.innerHTML = settingsView();

  else if(view === "wlib") m.innerHTML = wlView();

  else if(view === "basics") m.innerHTML = basicsView();

  else if(view === "school") m.innerHTML = sch.school ? schoolView() : schoolSetupView();
  else m.innerHTML = builderView();
  /* Stay where the teacher is when the same page redraws; go to the top only for a new page or a new message. */
  const place = view + "|" + (view === "builder" ? (unit.id || "") + "|" + unit.step : "");
  const msg = (typeof error === "string" && error) || "";
  if(place !== renderPlace.at || (msg && msg !== renderPlace.msg)) window.scrollTo(0,0);
  else if(window.scrollY !== renderPlace.y) window.scrollTo(0, renderPlace.y);
  renderPlace.at = place; renderPlace.msg = msg;
  if(view === "builder" && unit.step === 5) checkBooks();
}

/* ---------- summative tasks ---------- */
let sumId = null;
function savedUnits(){ return store.get("wn_units", []); }
function sumUnit(){ return savedUnits().find(u => u.id === sumId); }
function storeUnit(u){
  const units = savedUnits(); const i = units.findIndex(x => x.id === u.id);
  if(i >= 0) units[i] = u; else units.unshift(u);
  pushUnit(u);
  return store.set("wn_units", units);
}
/* ---------- units in the cloud ---------- */
const isUuid = x => /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(String(x));
async function pushUnit(u){
  if(!db || !tc.user || !isUuid(u.id) || u.shared) return false;
  const clean = Object.assign({}, u); delete clean.shared;
  const { error: e } = await db.from("units").upsert({ id: u.id, data: clean, central_idea: u.centralIdea || "", theme: u.theme || "", grade: u.grade || "", updated_at: new Date().toISOString() });
  return !e;
}
async function syncUnits(){
  if(!db || !tc.user) return;
  const local = store.get("wn_units", []);
  local.forEach(u => { if(!isUuid(u.id)){ const n = crypto.randomUUID(); if(unit.id === u.id){ unit.id = n; saveCurrent(); } u.id = n; } });
  if(!isUuid(unit.id)){ unit.id = crypto.randomUUID(); saveCurrent(); }
  const { data, error: e } = await db.from("units").select("id, data, owner").order("updated_at", { ascending: false });
  if(e){ store.set("wn_units", local); return; }
  const ids = new Set(data.map(r => r.id));
  for(const u of local) if(!ids.has(u.id)) await pushUnit(u);
  const merged = data.map(r => Object.assign({}, r.data, { id: r.id, shared: r.owner !== tc.user.id })).concat(local.filter(u => !ids.has(u.id)));
  store.set("wn_units", merged);
  if(view === "home" || view === "classes" || view === "summative") render();
}
function makeCU(u){ const t = themeOf(u.theme) || {}; return { unitId: u.id, centralIdea: u.centralIdea, themeName: t.name || "", themeIcon: t.ic || "", grade: u.grade || "", atl: u.atl || [], keyConcepts: u.keyConcepts || [], lines: (u.lines || []).map(l => l.text), storySpark: u.spark || "" }; }
const assign = { open:false, classes:[] };
async function openAssign(){
  await saveUnit(true);
  const { data, error: e } = await db.from("classes").select("id, name, grade, current_unit").order("created_at");
  if(e){ error = tcErr(e); return render(); }
  assign.classes = data || []; assign.open = true; render();
}
async function assignTo(id){
  const { error: e } = await db.from("classes").update({ current_unit: makeCU(unit) }).eq("id", id);
  if(e){ error = tcErr(e); assign.open = false; return render(); }
  const c = assign.classes.find(x => x.id === id); assign.open = false; toast(`Now the current unit for ${c ? c.name : "the class"} ✓`); render();
}
function assignModal(){
  if(!assign.open) return "";
  return `<div class="modal-bg" onclick="if(event.target===this){assign.open=false;render()}"><div class="modal">
    <div class="label">Use this unit with a class</div><h3 style="color:var(--navy);margin-bottom:12px">${esc(unit.centralIdea)}</h3>
    ${assign.classes.length ? assign.classes.map(c=>`<div class="unit-row"><div><h4>${esc(c.name)}</h4><p>${esc(c.grade)}${c.current_unit && c.current_unit.unitId === unit.id ? " · <b style='color:var(--leaf)'>already using this unit</b>" : c.current_unit ? " · now: " + esc(c.current_unit.centralIdea) : ""}</p></div><button class="btn small" onclick="assignTo('${c.id}')">Use this unit</button></div>`).join("")

}

function listEditor(key, arr){
  return (arr||[]).map((v,i)=>`<div class="listrow"><input type="text" value="${esc(v)}" oninput="sumList('${key}',${i},this.value)"><button class="link danger" onclick="sumDel('${key}',${i})">✕</button></div>`).join("")
    + `<button class="link" onclick="sumAdd('${key}','')">＋ Add</button>`;
}
let sumDraft = null;
function openSum(id){ sumId = id; error = ""; const u = sumUnit(); sumDraft = u && u.summative ? JSON.parse(JSON.stringify(u.summative)) : null; render(); }
function draft(){ const u = sumUnit(); if(!sumDraft && u && u.summative) sumDraft = JSON.parse(JSON.stringify(u.summative)); return sumDraft; }
function sumSet(k,v){ draft()[k] = v; sumAutosave(); }
function sumList(k,i,v){ draft()[k][i] = v; sumAutosave(); }
function sumCk(i,k,v){ draft().checkpoints[i][k] = v; sumAutosave(); }
function sumRub(i,j,v){ const r = draft().rubric[i]; if(j < 0) r.criterion = v; else { r.descriptors = r.descriptors || []; r.descriptors[j] = v; } sumAutosave(); }
function sumAdd(k,v){ const d = draft(); d[k] = d[k] || []; d[k].push(v); sumAutosave(); render(); }
function sumDel(k,i){ draft()[k].splice(i,1); sumAutosave(); render(); }
let sumTimer = null;
function sumAutosave(){ clearTimeout(sumTimer); sumTimer = setTimeout(() => { const u = sumUnit(); if(u && sumDraft){ u.summative = sumDraft; storeUnit(u); } }, 400); }
function sumSave(){ const u = sumUnit(); u.summative = draft(); storeUnit(u) ? toast("Task saved ✓") : toast("Could not save on this device"); }
async function sumGenerate(){
  const u = sumUnit(); if(!u) return;
  const levels = settings.rubricLevels.split(",").map(x => x.trim()).filter(Boolean);
  error = ""; loading(true, "Designing the summative task…");
  try{
    const d = await ai("summative", u, {levels, learnerProfile: u.learnerProfile, relatedConcepts: u.relatedConcepts});
    const t = {title: d.title||"", childBrief: d.childBrief||"", teacherNotes: d.teacherNotes||"", formats: d.formats||[],
      successCriteria: d.successCriteria||[], checkpoints: (d.checkpoints||[]).map(c=>({when:c.when||"", what:c.what||""})),
      levels, rubric: (d.rubric||[]).map(r=>({criterion:r.criterion||"", linkedTo:r.linkedTo||"", descriptors:(r.descriptors||[]).slice(0,levels.length)}))};
    u.summative = t; sumDraft = JSON.parse(JSON.stringify(t)); storeUnit(u);
  }catch(e){ error = e.message || "Something went wrong. Please try again."; }
  finally{ loading(false); render(); }
}
function sumWord(){
  const u = sumUnit(), t = draft(), th = themeOf(u.theme);
  const li = a => (a||[]).filter(Boolean).map(x=>`<li>${esc(x)}</li>`).join("");
  const h = `<html><head><meta charset="utf-8"><style>body{font-family:Arial;font-size:11pt;color:#1d2433}h1{color:#14325c;font-size:20pt}h2{color:#2f6fd6;font-size:13pt;margin-top:16pt}td,th{border:1px solid #ccd;padding:5pt;font-size:10pt;vertical-align:top}th{background:#14325c;color:#fff}table{border-collapse:collapse;width:100%}.brief{background:#fff7e0;border:1px solid #ffe3a1;padding:10pt;font-size:12.5pt}</style></head><body>
  <p style="color:#667085">${esc(settings.school||"")} · WonderNest summative task · ${esc(th?th.name:"")} · ${esc(gradeLabel(u))}</p>
  <h1>${esc(t.title)}</h1>
  <p><b>Central idea:</b> ${esc(u.centralIdea)}</p>
  <h2>For the children</h2><div class="brief">${esc(t.childBrief).replace(/\n/g,"<br>")}</div>
  <h2>Ways to show your learning</h2><ul>${li(t.formats)}</ul>
  <h2>Success criteria</h2><ul>${li(t.successCriteria)}</ul>
  <h2>Checkpoints</h2><table><tr><th>When</th><th>What</th></tr>${(t.checkpoints||[]).map(c=>`<tr><td>${esc(c.when)}</td><td>${esc(c.what)}</td></tr>`).join("")}</table>
  <h2>Teacher notes</h2><p>${esc(t.teacherNotes).replace(/\n/g,"<br>")}</p>
  <h2>Rubric</h2><table><tr><th>Criterion</th>${t.levels.map(l=>`<th>${esc(l)}</th>`).join("")}</tr>
  ${(t.rubric||[]).map(r=>`<tr><td><b>${esc(r.criterion)}</b><br><i>${esc(r.linkedTo||"")}</i></td>${t.levels.map((l,j)=>`<td>${esc((r.descriptors||[])[j]||"")}</td>`).join("")}</tr>`).join("")}</table>
  </body></html>`;
  const blob = new Blob(["\ufeff", h], {type:"application/msword"});
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob);
  a.download = "WonderNest summative task - " + (t.title || "task") + ".doc"; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href), 1000);
}

  return `<div class="card"><div class="label">${label} (${items.length})</div>${items.map(e=>`<div class="entry"><button class="link danger del" title="Delete" onclick="tDelEntry('${e.id}')">✕</button>${kind==="story"||kind==="research"?`<h4>${esc(e.title)}</h4>`:""}<p>${body(e)}</p><small>${new Date(e.created_at).toLocaleDateString("en-GB")}${e.unit_label ? " · " + esc(e.unit_label) : ""}</small></div>`).join("") || `<div class="hint">Nothing yet.</div>`}</div>`;
}
async function tAuth(){
  error = ""; tc.msg = "";

  loading(true, "One moment…");
  try{
    if(tc.mode === "signup"){
      if(pw.length < 8) throw new Error("Please choose a password with at least 8 characters.");
      const { data, error: e } = await db.auth.signUp({ email: em, password: pw, options: { emailRedirectTo: SITE_URL + "/app.html" } });
      if(e) throw e;
      if(!data.session) tc.msg = "Check your email and click the link to confirm your account, then sign in here.";
      tc.mode = "signin";
    } else if(tc.mode === "forgot"){
      const { error: e } = await db.auth.resetPasswordForEmail(em, { redirectTo: SITE_URL + "/app.html" });
      if(e) throw e; tc.msg = "If that email has an account, a reset link is on its way."; tc.mode = "signin";
    } else {
      const { error: e } = await db.auth.signInWithPassword({ email: em, password: pw });
      if(e) throw e; tc.loaded = false;
    }
  }catch(e){ error = tcErr(e); }
  finally{ loading(false); render(); }
}

  if(!ev.length){ error = "Record some ATL evidence for this child first."; return render(); }
  error = ""; loading(true, "Drafting the comment…");
  try{
    const u = { theme:"", description:"", grade: atlS.cls.grade, centralIdea: cu.centralIdea || "", lines:[], keyConcepts:[], atl: atlS.skills };
    const d = await ai("atl_comment", u, { evidence: ev, levels: atlLevels() });
    atlS.comment = String(d.comment || "").replace(/\[Name\]/g, k.first_name);
  }catch(e){ error = e.message || "Something went wrong. Please try again."; }
  finally{ loading(false); render(); }
}

function goStep(s){

/* Teacher wrote her own lines: still suggest SDGs, ATL skills, learner profile and related concepts from her central idea and lines.

const ownLineTexts = () => (unit.lines || []).map(l => (l.text || "").trim()).filter(Boolean);
function needsRest(){
  if(unit.loiMode !== "own" || !ownLineTexts().length) return false;
  return !(unit.sdgs||[]).length || !(unit.atl||[]).length || !(unit.learnerProfile||[]).length || !(unit.relatedConcepts||[]).length;
}
async function fillRest(next){
  if(!(unit.centralIdea||"").trim()){ error = "Please choose or write a central idea first."; return render(); }
  error = ""; loading(true, "Matching goals and skills to your lines…");
  try{
    const lines = ownLineTexts();
    const d = await ai("inquiry", unit, {description: ((unit.description||"").trim() ? unit.description.trim() + "\n" : "") + "The team has written its own lines of inquiry: " + lines.map((t,i) => (i+1) + ". " + t).join(" ") + ". Base every suggestion on this central idea and these lines."});
    if(!(unit.relatedConcepts||[]).length) unit.relatedConcepts = d.relatedConcepts || [];
    if(!(unit.atl||[]).length){
      unit.atl = []; unit.atlWhy = {};
      (d.atl || []).forEach(a => {
        const cat = Object.keys(ATL).find(c => c.toLowerCase() === String(a.category||"").toLowerCase());
        const skill = cat && ATL[cat].find(x => x.toLowerCase() === String(a.skill||"").toLowerCase());
        if(skill){ const k = cat + " · " + skill; unit.atl.push(k); unit.atlWhy[k] = a.why || ""; }
      });
    }
    if(!(unit.learnerProfile||[]).length) unit.learnerProfile = (d.learnerProfile || []).map(l => LEARNER_PROFILE.find(x => x.toLowerCase() === String(l).toLowerCase())).filter(Boolean);
    if(!(unit.sdgs||[]).length){
      unit.sdgs = []; unit.sdgWhy = {};
      (d.sdgs || []).forEach(x => { const n = Number(x.number); if(n>=1 && n<=17 && !unit.sdgs.includes(n)){ unit.sdgs.push(n); unit.sdgWhy[n] = x.why || ""; } });
    }
    if(next) unit.step = next;
    saveCurrent();
  }catch(e){ error = e.message || "Something went wrong. Please try again."; if(next){ unit.step = next; saveCurrent(); } }
  finally{ loading(false); render(); }
}

/* Own lines of inquiry: pick the specified concept from the teacher's wording (she can always change it). */
const CONCEPT_CUES = {
  Responsibility: [/responsib/, /\bcare (for|about)\b/, /\bprotect/, /\bshould\b/, /take action/, /\bour role\b/, /\bduty\b/, /\brights?\b/, /\bmake a difference\b/, /\bhelp (to )?(protect|look after|care)/, /\bconserv/, /\bsustain/, /\bfair(ly|ness)?\b/, /\brespect/],
  Causation: [/\bwhy\b/, /\bcaus/, /\beffects?\b/, /\bimpact/, /\baffect/, /\bbecause\b/, /\bresult/, /consequence/, /\blead(s)? to\b/, /\binfluenc/, /\breasons?\b/],
  Perspective: [/perspective/, /point of view/, /\bviews?\b/, /\bopinion/, /\bbelie/, /\bcultur/, /\bdifferent people\b/, /\bvalue[sd]?\b/, /\bfeel about\b/, /\bthink about\b/, /\binterpret/],
  Change: [/\bchang/, /\bgrow(s|th|ing)?\b/, /\bdevelop/, /over time/, /\btransform/, /\badapt/, /life ?cycle/, /\bevolv/, /\bin the past\b/, /\bthen and now\b/, /\bbecome/],
  Connection: [/\bconnect/, /relationship/, /\bdepend/, /\binteract/, /\bsupports?\b/, /\blink/, /\bsystems?\b/, /\bbetween\b/, /\btogether\b/, /\bshare\b/, /\bcommunit/, /\bnetworks?\b/, /\brely\b/],
  Function: [/how .* works?\b/, /\bworks?\b/, /\bfunction/, /\broles?\b/, /\bpurpose/, /\bused (for|to)\b/, /\bjobs?\b/, /\bstructure/, /\bhow .* (is|are) (made|used)\b/, /\bsurviv/],
  Form: [/what .* (is|are) like/, /\bfeatures?\b/, /characteristic/, /\btypes?\b/, /\bkinds?\b/, /\bdescrib/, /\bpropert/, /\blooks? like\b/, /\bwhat (is|are)\b/, /\bdifferent\b/, /\bvariety\b/]
};
const CONCEPT_ORDER = ["Responsibility", "Causation", "Perspective", "Change", "Connection", "Function", "Form"];
function conceptFor(text){
  const t = " " + String(text || "").toLowerCase() + " "; let best = "Form", top = 0;
  CONCEPT_ORDER.forEach(c => { const n = CONCEPT_CUES[c].filter(rx => rx.test(t)).length; if(n > top){ top = n; best = c; } });
  return best;
}

function syncLineConcepts(){
