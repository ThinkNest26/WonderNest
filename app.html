<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WonderNest · Unit builder</title>
<link rel="icon" href="bird.png">
<meta name="description" content="WonderNest by ThinkNest Education: a PYP inquiry companion for teachers and children.">
<style>
  :root{
    --navy:#14325c; --blue:#2f6fd6; --sky:#e8f1ff; --sun:#ffc83d; --coral:#ff7a59;
    --leaf:#3bb07a; --lilac:#8a6cf0; --ink:#1d2433; --muted:#667085; --line:#e4e8f0; --bg:#f6f8fc;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:"Nunito","Segoe UI","Helvetica Neue",Arial,sans-serif;color:var(--ink);background:var(--bg);min-height:100vh}
  button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
  input,textarea,select{font:inherit;color:var(--ink)}
  .app{display:flex;min-height:100vh}
  /* sidebar */
  .side{width:240px;flex-shrink:0;background:var(--navy);color:#fff;padding:26px 18px;display:flex;flex-direction:column;gap:6px;position:sticky;top:0;height:100vh}
  .logo{display:flex;align-items:center;gap:10px;font-size:22px;font-weight:800;margin-bottom:26px}
  .logo .mark{width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg,var(--sun),var(--coral));display:grid;place-items:center;font-size:21px}
  .logo small{display:block;font-size:11px;font-weight:600;opacity:.7;letter-spacing:.5px}
  .nav{padding:11px 14px;border-radius:10px;font-size:14.5px;opacity:.8;display:flex;gap:10px;align-items:center;text-align:left;width:100%}
  .nav:hover{background:rgba(255,255,255,.08);opacity:1}
  .nav.on{background:rgba(255,255,255,.15);opacity:1;font-weight:700}
  .nav.soon{opacity:.45;cursor:default}
  .nav.soon:hover{background:none}
  .nav .pill{margin-left:auto;font-size:10px;background:rgba(255,255,255,.18);padding:2px 7px;border-radius:99px}
  .side .foot{margin-top:auto;font-size:12px;opacity:.65;line-height:1.5}
  .main{flex:1;padding:30px 38px 60px;min-width:0}
  .top{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;margin-bottom:22px;flex-wrap:wrap}
  .crumb{font-size:13px;color:var(--muted);margin-bottom:4px}
  h1{font-size:27px;font-weight:800;color:var(--navy)}
  .demo{background:#fff4e0;border:1px solid #ffe0a3;color:#8a5200;border-radius:12px;padding:10px 14px;font-size:13.5px;margin-bottom:18px}
  /* stepper */
  .steps{display:flex;gap:8px;margin-bottom:24px}
  .step{flex:1;background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:12.5px;color:var(--muted);display:flex;gap:9px;align-items:center;text-align:left}
  .step b{width:24px;height:24px;border-radius:50%;background:var(--line);display:grid;place-items:center;font-size:12px;color:var(--muted);flex-shrink:0}
  .step.done b{background:var(--leaf);color:#fff}
  .step.now{border-color:var(--blue);color:var(--navy);font-weight:700;box-shadow:0 0 0 3px rgba(47,111,214,.12)}
  .step.now b{background:var(--blue);color:#fff}
  .step:disabled{cursor:default}
  .card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:20px 22px;margin-bottom:16px}
  .label{font-size:12px;font-weight:800;letter-spacing:.8px;text-transform:uppercase;color:var(--muted);margin-bottom:10px}
  .hint{font-size:12.5px;color:var(--muted);line-height:1.45}
  /* themes */
  .themes{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:20px}
  .theme{border-radius:14px;padding:15px 16px;border:2px solid transparent;background:#fff;box-shadow:0 1px 0 var(--line);text-align:left;position:relative}
  .theme:hover{border-color:#cfe0fb}
  .theme .ic{font-size:24px;margin-bottom:6px}
  .theme h3{font-size:15.5px;color:var(--navy);margin-bottom:3px}
  .theme p{font-size:12px;color:var(--muted);line-height:1.4}
  .theme.sel{border-color:var(--leaf);background:#effaf4}
  .theme.sel:after{content:"✓";position:absolute;top:12px;right:14px;width:24px;height:24px;border-radius:50%;background:var(--leaf);color:#fff;display:grid;place-items:center;font-size:13px;font-weight:800}
  textarea,input[type=text],select{width:100%;border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;font-size:15px;line-height:1.5;background:#fff}
  textarea{min-height:110px;resize:vertical}
  textarea:focus,input:focus,select:focus{outline:none;border-color:var(--blue)}
  .fields{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:14px}
  .fields label{font-size:12px;font-weight:700;color:var(--muted);display:block;margin-bottom:5px}
  .actions{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:16px;flex-wrap:wrap}
  .btn{background:var(--blue);color:#fff;border-radius:12px;padding:12px 20px;font-weight:800;font-size:15px;display:inline-flex;gap:8px;align-items:center}
  .btn:hover{filter:brightness(1.07)}
  .btn:disabled{opacity:.5;cursor:not-allowed}
  .btn.ghost{background:#fff;color:var(--blue);border:1.5px solid var(--blue)}
  .btn.small{padding:8px 13px;font-size:13px;border-radius:10px}
  .link{color:var(--blue);font-weight:700;font-size:13px}
  .link.danger{color:#c2410c}
  /* central ideas */
  .ci{border:1.5px solid var(--line);border-radius:12px;padding:13px 15px;margin-bottom:10px;font-size:15px;line-height:1.45;display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;background:#fff}
  .ci .rb{width:20px;height:20px;border-radius:50%;border:2px solid #c3cad8;flex-shrink:0;margin-top:2px}
  .ci.sel{border-color:var(--blue);background:var(--sky)}
  .ci.sel .rb{border:6px solid var(--blue)}
  .edit-row{display:flex;gap:10px;align-items:flex-start}
  /* lines */
  .loi{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px dashed var(--line)}
  .loi:last-child{border:0}
  .loi .n{width:26px;height:26px;border-radius:7px;background:var(--sun);font-weight:800;font-size:12px;display:grid;place-items:center;flex-shrink:0}
  .loi textarea{flex:1;min-height:52px;font-size:14.5px;padding:9px 12px}
  .loi select{width:140px;flex-shrink:0;font-size:13.5px;padding:10px}
  .grid2{display:grid;grid-template-columns:1.3fr 1fr;gap:18px;align-items:start}
  .chips{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:16px}
  .chip{font-size:12.8px;font-weight:700;padding:7px 12px;border-radius:999px;background:var(--bg);border:1px solid var(--line);color:var(--ink)}
  .chip:hover{border-color:#c9d3e6}
  .chip.on{background:#f1edff;border-color:#d7ccff;color:#5b3fd1}
  .chip.atl.on{background:#fff4e0;border-color:#ffe0a3;color:#9a5b00}
  .chip.lp.on{background:#e6f7ec;border-color:#bfe8cf;color:#1f7a4d}
  .atl-group{margin-bottom:10px}
  .atl-group h4{font-size:12.5px;color:var(--navy);margin-bottom:6px}
  .atl-group .chips{margin-bottom:6px}
  .why{font-size:12.3px;color:#7a5a12;background:#fffaf0;border-radius:10px;padding:8px 10px;margin:4px 0 10px;line-height:1.4}
  /* SDGs */
  .sdgs{display:grid;grid-template-columns:repeat(6,1fr);gap:10px}
  .sdg{border-radius:12px;color:#fff;padding:10px 11px;font-size:12px;font-weight:700;line-height:1.25;text-align:left;min-height:86px;opacity:.38;position:relative;border:3px solid transparent}
  .sdg b{display:block;font-size:22px;font-weight:900}
  .sdg.on{opacity:1;border-color:var(--navy)}
  .sdg.on:after{content:"✓";position:absolute;top:7px;right:8px;width:20px;height:20px;border-radius:50%;background:#fff;color:var(--navy);display:grid;place-items:center;font-size:12px;font-weight:900}
  .sdg-why{display:flex;gap:10px;align-items:flex-start;font-size:13.5px;line-height:1.45;padding:8px 0;border-bottom:1px dashed var(--line)}
  .sdg-why:last-child{border:0}
  .sdg-why span{color:#fff;font-weight:900;border-radius:8px;padding:3px 8px;flex-shrink:0;font-size:13px}
  /* resources */
  .grid3{display:grid;grid-template-columns:1.15fr 1fr 1fr;gap:16px;align-items:start}
  .book{display:flex;gap:12px;padding:10px 0;border-bottom:1px dashed var(--line)}
  .book:last-child{border:0}
  .cover{width:46px;height:60px;border-radius:6px;flex-shrink:0;display:grid;place-items:center;font-size:21px;background:var(--sky)}
  .book h4{font-size:14px;color:var(--navy)}
  .book p{font-size:12.3px;color:var(--muted);line-height:1.4;margin-top:2px}
  .blinks{display:flex;flex-wrap:wrap;gap:6px;margin-top:7px}
  .blink{font-size:11.5px;font-weight:800;color:var(--blue);background:#fff;border:1px solid #cfe0fb;border-radius:8px;padding:3px 8px;text-decoration:none}
  .blink:hover{background:var(--sky)}
  .blink.read{background:var(--leaf);border-color:var(--leaf);color:#fff}
  .bwarn{font-size:11.5px;color:#9a2b0b;background:#fff0ec;border-radius:8px;padding:5px 8px;margin-top:6px}
  img.cover{object-fit:cover;border:1px solid var(--line)}
  .tag{display:inline-block;font-size:10.5px;font-weight:800;padding:2px 7px;border-radius:6px;margin-top:5px;background:var(--sky);color:var(--blue)}
  .routine{border-radius:12px;padding:12px 14px;margin-bottom:10px;border:1px solid var(--line);border-left-width:5px}
  .routine h4{font-size:14.5px;color:var(--navy);display:flex;justify-content:space-between;gap:8px}
  .routine h4 span{font-size:11px;color:var(--muted);font-weight:700;white-space:nowrap}
  .routine p{font-size:12.5px;color:var(--muted);margin-top:4px;line-height:1.4}
  .prov{background:linear-gradient(135deg,#fff7e0,#fff);border:1px solid #ffe3a1;border-radius:12px;padding:12px 14px;margin-bottom:10px}
  .prov h4{font-size:14px;color:#8a5200;margin-bottom:4px}
  .prov p{font-size:12.5px;color:#6b5a3a;line-height:1.45}
  .story{background:linear-gradient(135deg,#f6f2ff,#fff4ef);border:1px solid #e6dcff;border-radius:14px;padding:16px 18px}
  .story h3{color:var(--navy);font-size:18px;margin-bottom:8px}
  .story p{font-size:14px;line-height:1.65;margin-bottom:8px;white-space:pre-wrap}
  .story .ar{direction:rtl;text-align:right;font-family:"Geeza Pro","Arial",sans-serif;border-top:1px dashed #d9ccff;padding-top:10px;margin-top:10px}
  .spark{background:#ffe9e2;border-radius:12px;padding:12px 14px;font-size:14px;color:#8a2c0d;font-weight:700;line-height:1.45;margin-top:12px}
  /* summative */
  .sgrid{display:grid;grid-template-columns:1.1fr 1fr;gap:16px;align-items:start}
  .field-lbl{font-size:12px;font-weight:800;letter-spacing:.6px;text-transform:uppercase;color:var(--muted);margin:14px 0 6px}
  .field-lbl:first-child{margin-top:0}
  .brief{background:linear-gradient(135deg,#fff7e0,#fff);border:1px solid #ffe3a1;border-radius:14px;padding:16px}
  .brief textarea{background:transparent;border-color:#ffe3a1;font-size:15.5px}
  .listrow{display:flex;gap:8px;align-items:center;margin-bottom:6px}
  .listrow input{flex:1;padding:9px 12px;font-size:14px}
  .rubric-wrap{overflow-x:auto}
  table.rubric{width:100%;border-collapse:separate;border-spacing:0;font-size:13px;min-width:720px}
  table.rubric th{background:var(--navy);color:#fff;padding:9px 10px;text-align:left;font-size:12.5px}
  table.rubric th:first-child{border-radius:10px 0 0 0} table.rubric th:last-child{border-radius:0 10px 0 0}
  table.rubric td{border-bottom:1px solid var(--line);border-right:1px solid var(--line);vertical-align:top;padding:0}
  table.rubric td:first-child{border-left:1px solid var(--line);background:#f8faff}
  table.rubric textarea{border:0;border-radius:0;min-height:96px;font-size:13px;padding:9px 10px;background:transparent;resize:vertical}
  table.rubric .crit{font-weight:800;color:var(--navy)}
  table.rubric .link{display:block;font-size:11px;font-weight:700;color:var(--lilac);padding:0 10px 9px}
  .fmt{display:inline-flex;gap:6px;align-items:center}
  /* classes */
  .auth{max-width:460px}
  .auth .fields{grid-template-columns:1fr;margin:0}
  .tabs{display:flex;gap:6px;margin-bottom:16px}
  .tabs button{flex:1;padding:10px;border-radius:10px;font-weight:800;background:var(--bg);color:var(--muted)}
  .tabs button.on{background:var(--navy);color:#fff}
  .ok{background:#e6f7ec;border:1px solid #bfe8cf;color:#1f7a4d;border-radius:12px;padding:10px 14px;font-size:13.5px;margin-bottom:14px}
  .codebox{display:flex;gap:14px;flex-wrap:wrap}
  .codebox > div{flex:1;min-width:220px;background:var(--sky);border-radius:14px;padding:14px 16px}
  .codebox b{display:block;font-size:26px;letter-spacing:4px;color:var(--navy);margin:4px 0}
  .codebox a{color:var(--blue);font-weight:700;font-size:13px;word-break:break-all}
  .kids{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px}
  .kid{border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;align-items:center;gap:10px;text-align:left;background:#fff}
  .kid:hover{border-color:#c9d3e6}
  .kid .p{font-size:28px}
  .kid b{display:block;color:var(--navy)} .kid small{color:var(--muted);font-size:12px}
  .wonders{display:flex;flex-wrap:wrap;gap:8px}
  .wbub{padding:9px 12px;border-radius:16px;font-size:13.5px;font-weight:700;line-height:1.35;background:#fff1c9}
  .wbub small{display:block;font-size:11px;color:var(--muted);font-weight:800;margin-bottom:2px}
  .entry{border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:10px;position:relative}
  .entry h4{color:var(--navy);font-size:14.5px;margin-bottom:4px}
  .entry p{font-size:14px;line-height:1.5;white-space:pre-wrap}
  .entry small{color:var(--muted);font-size:12px}
  .entry .del{position:absolute;top:10px;right:12px}
  .themebox{background:linear-gradient(135deg,#effaf4,#fff);border-color:#bfe8cf}
  .themebox p{font-size:15px;line-height:1.6;color:var(--ink)}
  /* ATL growth */
  .atl-grid{width:100%;border-collapse:separate;border-spacing:0;font-size:13.5px}
  .atl-grid th{background:var(--navy);color:#fff;padding:10px;text-align:left;font-size:12.5px;position:sticky;top:0}
  .atl-grid th:first-child{border-radius:10px 0 0 0} .atl-grid th:last-child{border-radius:0 10px 0 0}
  .atl-grid td{border-bottom:1px solid var(--line);padding:8px 10px;vertical-align:middle}
  .atl-grid td.nm{font-weight:800;color:var(--navy);white-space:nowrap}
  .cell{width:100%;min-height:44px;border:1.5px dashed #d6dcea;border-radius:12px;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 10px;text-align:left}
  .cell:hover{border-color:var(--blue);background:var(--sky)}
  .lvl{display:inline-block;font-size:12px;font-weight:800;padding:4px 9px;border-radius:999px;color:#fff}
  .lvl0{background:#cbd2e0;color:#475066}
  .selfx{font-size:18px}
  .modal-bg{position:fixed;inset:0;background:rgba(20,50,92,.35);display:grid;place-items:center;z-index:40}
  .modal{background:#fff;border-radius:18px;padding:22px;width:min(520px,92vw);max-height:88vh;overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.25)}
  .lvlbtns{display:grid;grid-template-columns:repeat(auto-fit,minmax(100px,1fr));gap:8px;margin:12px 0}
  .lvlbtn{border:2px solid var(--line);border-radius:12px;padding:12px 8px;font-weight:800;color:var(--navy);background:#fff}
  .lvlbtn.on{border-color:var(--blue);background:var(--sky)}
  .bar{height:12px;border-radius:8px;background:#eef1f7;overflow:hidden;flex:1}
  .bar i{display:block;height:100%;border-radius:8px}
  .hist{font-size:13px;border-left:3px solid var(--line);padding:6px 0 6px 12px;margin-left:4px}
  .hist b{color:var(--navy)}
  .libgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px}
  .libcard{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;transition:.2s}
  .libcard:hover{box-shadow:0 10px 24px rgba(20,50,92,.08);transform:translateY(-2px)}
  .libtop{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
  .kind{font-size:11px;font-weight:800;padding:3px 8px;border-radius:999px}
  .kind.routine{background:#f1edff;color:#5b3fd1} .kind.organiser{background:#e6f7ec;color:#1f7a4d}
  .libcard h4{color:var(--navy);font-size:16px}
  .libcat{font-size:11.5px;font-weight:800;color:var(--blue);margin:2px 0 6px}
  .libcard p{font-size:13px;color:var(--muted);line-height:1.45;flex:1}
  .oiboard{display:grid;grid-template-columns:repeat(7,minmax(112px,1fr));gap:10px;overflow-x:auto;padding-bottom:6px}
  .oicol{background:#eef2f9;border-radius:14px;padding:8px;min-height:200px}
  .oihead{font-size:12.5px;font-weight:800;color:var(--navy);padding:4px 4px 8px;display:flex;justify-content:space-between}
  .oihead span{background:#fff;border-radius:999px;padding:0 8px}
  .oicard{display:block;width:100%;text-align:left;background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px;margin-bottom:8px;font-size:13px}
  .oicard:hover{border-color:var(--blue)}
  .oicard b{display:block;color:var(--navy);margin-bottom:3px}
  .oicard span{color:var(--muted);line-height:1.35;display:block}
  .oicard em{display:block;font-style:normal;font-size:11px;font-weight:800;color:var(--leaf);margin-top:4px}
  .oicard.idle{opacity:.6}
  .reader{font-family:Georgia,"Times New Roman",serif;font-size:19px;line-height:1.75;color:#1d2433}
  .reader p{margin-bottom:14px}
  .reader[dir=rtl]{font-family:"Geeza Pro",Arial,sans-serif;text-align:right}
  /* units list */
  .unit-row{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:14px 0;border-bottom:1px dashed var(--line)}
  .unit-row:last-child{border:0}
  .unit-row h4{color:var(--navy);font-size:15px}
  .unit-row p{font-size:13px;color:var(--muted);margin-top:2px}
  .empty{text-align:center;padding:40px 20px;color:var(--muted)}
  /* loading + toast */
  .loading{position:fixed;inset:0;background:rgba(20,50,92,.35);display:none;place-items:center;z-index:50}
  .loading.show{display:grid}
  .loading div{background:#fff;border-radius:18px;padding:26px 34px;text-align:center;font-weight:800;color:var(--navy);box-shadow:0 20px 50px rgba(0,0,0,.2)}
  .loading .bird{font-size:40px;display:block;animation:hop 1s infinite ease-in-out;margin-bottom:8px}
  @keyframes hop{50%{transform:translateY(-8px)}}
  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;padding:12px 20px;border-radius:12px;font-weight:700;font-size:14px;opacity:0;transition:.3s;pointer-events:none;z-index:60}
  .toast.show{opacity:1}
  .err{background:#fff0ec;border:1px solid #ffc9b8;color:#9a2b0b;border-radius:12px;padding:10px 14px;font-size:13.5px;margin-bottom:14px}
  /* responsive */
  @media (max-width:1100px){ .grid3{grid-template-columns:1fr 1fr} .sdgs{grid-template-columns:repeat(4,1fr)} }
  @media (max-width:900px){
    .app{flex-direction:column}
    .side{width:100%;height:auto;position:static;flex-direction:row;flex-wrap:wrap;align-items:center;padding:14px}
    .logo{margin:0 12px 0 0}
    .nav{width:auto;padding:8px 10px}
    .nav.soon,.side .foot{display:none}
    .main{padding:20px 16px 50px}
    .themes,.fields,.grid2,.grid3{grid-template-columns:1fr}
    .steps{overflow-x:auto}
    .step{min-width:130px}
    .sdgs{grid-template-columns:repeat(3,1fr)}
  }
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="logo"><div class="mark" style="background:linear-gradient(135deg,#ffd76a,#ffb347)"><img src="bird.png" alt="" style="width:34px;height:34px;object-fit:contain" onerror="this.replaceWith('🐦')"></div><div>WonderNest<small>by ThinkNest Education</small></div></div>
    <button class="nav" data-view="home">🏠 My units</button>
    <button class="nav on" data-view="builder">✨ Unit builder</button>
    <button class="nav" data-view="library">🧠 Routines & organisers</button>
    <button class="nav" data-view="settings">⚙️ School settings</button>
    <button class="nav" data-view="stories">📚 Story library</button>
    <button class="nav" data-view="inquiry">🔍 Open inquiry</button>

</div>
<div class="loading" id="loading"><div><span class="bird">🐦</span><span id="loadingText">WonderNest is thinking…</span></div></div>
<div class="toast" id="toast"></div>

<script>
/* ================= CONFIG =================
   When the AI Worker is ready, paste its address between the quotes below.
   While it is empty, WonderNest runs in demo mode with sample suggestions. */
const WORKER_URL = "https://wondernest-ai.thinknest2026.workers.dev";
/* ========================================== */

const THEMES = [
  {id:"who", ic:"🪞", name:"Who we are", desc:"Identity as individuals and as part of a collective"},
  {id:"organize", ic:"🏙️", name:"How we organise ourselves", desc:"Systems, structures and networks"},
  {id:"planet", ic:"🌍", name:"Sharing the planet", desc:"The interdependence of human and natural worlds"},
  {id:"works", ic:"⚙️", name:"How the world works", desc:"Understandings of the world and phenomena"},
  {id:"express", ic:"🎨", name:"How we express ourselves", desc:"The diversity of voice, perspectives and expression"},
  {id:"where", ic:"🧭", name:"Where we are in place and time", desc:"Histories and orientation in place, space and time"}
];
// Transdisciplinary theme descriptions (updated wording). Schools can replace them in School settings.
const THEME_DESC = {
  who: {intro:"An inquiry into identity as individuals and as part of a collective through:", strands:["Physical, emotional, social and spiritual health and wellbeing","Relationships and belonging","Learning and growing"]},
  organize: {intro:"An inquiry into systems, structures and networks through:", strands:["Interactions within and between social and ecological systems","Approaches to livelihoods and trade practices: intended and unintended consequences","Representation, collaboration and decision-making"]},
  planet: {intro:"An inquiry into the interdependence of human and natural worlds through:", strands:["Rights, responsibilities and dignity of all","Pathways of just, peaceful and reimagined futures","Nature, complexity, coexistence and wisdom"]},
  works: {intro:"An inquiry into understandings of the world and phenomena through:", strands:["Patterns, cycles, systems","Diverse practices, methods and tools","Discovery, design, innovation: possibilities and impacts"]},
  express: {intro:"An inquiry into the diversity of voice, perspectives, and expression through:", strands:["Inspiration, imagination, creativity","Personal, social and cultural modes and practices of communication","Intentions, perceptions, interpretations and responses"]},
  where: {intro:"An inquiry into histories and orientation in place, space and time through:", strands:["Periods, events and artefacts","Communities, heritage, culture and environment","Natural and human drivers of movement, adaptation, and transformation"]}
};
const defaultThemeText = id => THEME_DESC[id] ? THEME_DESC[id].intro + "\n" + THEME_DESC[id].strands.map(x => "• " + x).join("\n") : "";
const themeText = id => (settings.themeText && settings.themeText[id] && settings.themeText[id].trim()) || defaultThemeText(id);
const KEY_CONCEPTS = ["Form","Function","Causation","Change","Connection","Perspective","Responsibility"];
const ATL = {
  "Thinking":["Critical thinking","Creative thinking","Transfer","Reflection"],
  "Research":["Information literacy","Media literacy","Ethical use of information"],
  "Communication":["Exchanging information","Literacy","ICT"],
  "Social":["Interpersonal relationships","Social-emotional intelligence"],
  "Self-management":["Organization","States of mind"]
};
const LEARNER_PROFILE = ["Inquirers","Knowledgeable","Thinkers","Communicators","Principled","Open-minded","Caring","Risk-takers","Balanced","Reflective"];
const SDGS = [
  [1,"No Poverty","#E5243B"],[2,"Zero Hunger","#DDA63A"],[3,"Good Health and Well-being","#4C9F38"],[4,"Quality Education","#C5192D"],
  [5,"Gender Equality","#FF3A21"],[6,"Clean Water and Sanitation","#26BDE2"],[7,"Affordable and Clean Energy","#FCC30B"],
  [8,"Decent Work and Economic Growth","#A21942"],[9,"Industry, Innovation and Infrastructure","#FD6925"],[10,"Reduced Inequalities","#DD1367"],
  [11,"Sustainable Cities and Communities","#FD9D24"],[12,"Responsible Consumption and Production","#BF8B2E"],[13,"Climate Action","#3F7E44"],
  [14,"Life Below Water","#0A97D9"],[15,"Life on Land","#56C02B"],[16,"Peace, Justice and Strong Institutions","#00689D"],[17,"Partnerships for the Goals","#19486A"]
];
const GRADES = [
  ["Pre-K","3–4"],["KG1","4–5"],["KG2","5–6"],["Grade 1","6–7"],["Grade 2","7–8"],
  ["Grade 3","8–9"],["Grade 4","9–10"],["Grade 5","10–11"],["Grade 6","11–12"]
];
const gradeLabel = u => u.grade ? `${u.grade} (ages ${(GRADES.find(g=>g[0]===u.grade)||["",""])[1]})` : (u.ageBand ? "Ages " + u.ageBand : "");
const STEP_NAMES = ["Theme & grade","Central idea","Lines of inquiry & concepts","SDGs","Stories, routines & inquiry"];
const ROUTINE_COLOURS = ["var(--sun)","var(--blue)","var(--coral)","var(--leaf)","var(--lilac)"];

/* ---------- Supabase (public project values) ---------- */
const SUPABASE_URL = "https://zmncqutjtgwxlvrdgwiq.supabase.co";
const SUPABASE_KEY = "sb_publishable_blNQT3mGUzNadaRARkRpew_dq-tmD4J";
const SITE_URL = "https://wondernest.thinknest.education";
const db = window.supabase ? window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, { auth: { storageKey: "wondernest-teacher" } }) : null;
const PICTURES = ["🐢","🐪","⭐","🍎","🚀","🐬","🌻","🦁","🎈","🐝","🍓","⚽"];

/* ---------- storage ---------- */
const store = {
  get(k, d){ try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); return true; }catch(e){ return false; } }
};
let settings = (s => { if(s.conceptLabel === "Key concepts") s.conceptLabel = "Specified concepts"; return s; })(Object.assign({school:"", conceptLabel:"Specified concepts", rubricLevels:"Beginning, Developing, Achieving, Extending", atlLevels:"Novice, Learner, Practitioner, Expert"}, store.get("wn_settings", {})));
function newUnit(){
  return {id:(crypto.randomUUID ? crypto.randomUUID() : "u"+Date.now()), theme:"", description:"", grade:"", ageBand:"", duration:"6 weeks", languages:"English",
    centralIdeaOptions:[], centralIdea:"", lines:[], keyConcepts:[], relatedConcepts:[], atl:[], atlWhy:{},
    learnerProfile:[], sdgs:[], sdgWhy:{}, books:[], story:null, spark:"", routines:[], provocations:[], step:1, updated:null};
}
let unit = store.get("wn_current", null) || newUnit();
let view = "builder";
let error = "";

/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const themeOf = id => THEMES.find(t => t.id === id);
function saveCurrent(){ store.set("wn_current", unit); }
function toast(msg){ const t = $("#toast"); t.textContent = msg; t.classList.add("show"); setTimeout(()=>t.classList.remove("show"), 2200); }
function loading(on, text){ $("#loading").classList.toggle("show", on); if(text) $("#loadingText").textContent = text; }
function toggle(arr, v){ const i = arr.indexOf(v); i >= 0 ? arr.splice(i,1) : arr.push(v); }

/* ---------- AI ---------- */
async function ai(task, u = unit, extra = {}){
  const payload = Object.assign({theme: themeOf(u.theme)?.name || "", themeDescription: themeText(u.theme), description: u.description, ageBand: gradeLabel(u),
    duration: u.duration, languages: u.languages, centralIdea: u.centralIdea,
    lines: (u.lines||[]).map(l => l.text), keyConcepts: u.keyConcepts, atl: u.atl}, extra);
  if(!WORKER_URL){ await new Promise(r => setTimeout(r, 700)); return DEMO[task]; }
  const res = await fetch(WORKER_URL, {method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify({task, unit: payload})});
  const data = await res.json().catch(()=>({}));
  if(!res.ok) throw new Error(data.error || "The AI could not answer just now.");
  return data;
}
async function run(task, text, apply){
  error = ""; loading(true, text);
  try{ apply(await ai(task)); saveCurrent(); }
  catch(e){ error = e.message || "Something went wrong. Please try again."; }
  finally{ loading(false); render(); }
}

/* ---------- book links ---------- */
const q = b => encodeURIComponent(((b.title||"") + " " + (b.author||"")).trim());
function bookLinks(b){
  const ol = b.ol || {};
  const links = [];
  if(ol.readable) links.push(`<a class="blink read" href="${ol.url}" target="_blank" rel="noopener">📖 Read online free</a>`);
  links.push(`<a class="blink" href="${ol.url || "https://openlibrary.org/search?q=" + q(b)}" target="_blank" rel="noopener">Open Library</a>`);
  links.push(`<a class="blink" href="https://www.google.com/search?tbm=bks&q=${q(b)}" target="_blank" rel="noopener">Google Books</a>`);
  links.push(`<a class="blink" href="https://search.worldcat.org/search?q=${q(b)}" target="_blank" rel="noopener">Find in a library</a>`);
  return links.join("");
}
function bookHTML(b){
  const ol = b.ol || {};
  const cover = ol.cover ? `<img class="cover" src="${ol.cover}" alt="">` : `<div class="cover">📖</div>`;
  const warn = b.olChecked && ol.found === false ? `<div class="bwarn">⚠️ We couldn't find this book in Open Library. Please check the title and author.</div>` : "";
  return `<div class="book">${cover}<div><h4>${esc(b.title)}</h4><p>${esc(b.author)} · ${esc(b.why)}</p>${b.line?`<span class="tag">${esc(b.line)}</span>`:""}<div class="blinks">${bookLinks(b)}</div>${warn}</div></div>`;
}
let checkingBooks = false;
async function checkBooks(){
  if(checkingBooks) return;
  const todo = unit.books.filter(b => !b.olChecked);
  if(!todo.length) return;
  checkingBooks = true;
  let changed = false;
  await Promise.all(todo.map(async b => {
    try{
      const url = "https://openlibrary.org/search.json?limit=1&fields=key,cover_i,ebook_access&title=" + encodeURIComponent(b.title||"") + "&author=" + encodeURIComponent(String(b.author||"").split(/[(,]/)[0].trim());
      const r = await fetch(url); const d = await r.json(); const doc = (d.docs||[])[0];
      b.ol = doc ? {found:true, url:"https://openlibrary.org" + doc.key, cover: doc.cover_i ? `https://covers.openlibrary.org/b/id/${doc.cover_i}-M.jpg` : "", readable: ["borrowable","public"].includes(doc.ebook_access)} : {found:false};
      b.olChecked = true; changed = true;
    }catch(e){ b.olChecked = true; b.ol = null; /* offline or blocked: keep plain search links */ }
  }));
  checkingBooks = false;
  saveCurrent();
  if(changed && view === "builder" && unit.step === 5) render();
}

/* ---------- views ---------- */
function render(){
  document.querySelectorAll(".nav[data-view]").forEach(n => n.classList.toggle("on", n.dataset.view === view));
  $("#footSchool").innerHTML = esc(settings.school || "Your school") + "<br>Programme of inquiry";
  const m = $("#main");
  if(view === "home") m.innerHTML = homeView();
  else if(view === "settings") m.innerHTML = settingsView();
  else if(view === "summative") m.innerHTML = summativeView();
  else if(view === "classes") m.innerHTML = classesView();
  else if(view === "atl") m.innerHTML = atlView();
  else if(view === "library") m.innerHTML = libView();
  else if(view === "inquiry") m.innerHTML = oiView();
  else if(view === "stories") m.innerHTML = storiesView();
  else m.innerHTML = builderView();
  window.scrollTo(0,0);
  if(view === "builder" && unit.step === 5) checkBooks();
}

function header(title){
  const t = themeOf(unit.theme);
  return `<div class="top"><div><div class="crumb">Unit builder${t ? " › " + esc(t.name) : " › New unit"}${unit.grade ? " · " + esc(unit.grade) : ""}</div><h1>${title}</h1></div>
    ${unit.step === 5 ? `<div style="display:flex;gap:10px;flex-wrap:wrap"><button class="btn ghost" onclick="downloadWord()">⬇️ Download as Word</button><button class="btn ghost" onclick="openAssign()">📌 Use with a class</button><button class="btn" onclick="saveUnit()">💾 Save unit</button></div>` : ""}</div>${assignModal()}
    ${WORKER_URL ? "" : `<div class="demo">🧪 <b>Demo mode:</b> the AI is not connected yet, so WonderNest shows sample suggestions for a habitats unit. Real suggestions start once the AI Worker is connected.</div>`}
    ${error ? `<div class="err">⚠️ ${esc(error)}</div>` : ""}
    <div class="steps">${STEP_NAMES.map((n,i)=>{
      const s = i+1, cls = s < unit.step ? "done" : s === unit.step ? "now" : "";
      return `<button class="step ${cls}" ${s < unit.step ? `onclick="goStep(${s})"` : "disabled"}><b>${s < unit.step ? "✓" : s}</b>${n}</button>`;
    }).join("")}</div>`;
}

function builderView(){
  const titles = ["Start a new unit of inquiry","Choose your central idea","Lines of inquiry and concepts","Connect to the Sustainable Development Goals","Stories, thinking routines and open inquiry"];
  const body = [step1, step2, step3, step4, step5][unit.step-1]();
  return header(titles[unit.step-1]) + body;
}

function step1(){
  return `<div class="label">1. Choose a transdisciplinary theme</div>
  <div class="themes">${THEMES.map(t=>`<button class="theme ${unit.theme===t.id?"sel":""}" onclick="pickTheme('${t.id}')"><div class="ic">${t.ic}</div><h3>${t.name}</h3><p>${t.desc}</p></button>`).join("")}</div>
  ${unit.theme ? `<div class="card themebox"><div class="label">${themeOf(unit.theme).ic} About this theme: ${esc(themeOf(unit.theme).name)}</div><p style="white-space:pre-line">${esc(themeText(unit.theme))}</p><div class="hint" style="margin-top:8px">Saved for every unit. Your school can change this wording in School settings.</div></div>` : ""}
  <div class="card">
    <div class="label">2. Choose the grade</div>
    <div class="fields" style="margin-top:0">
      <div><label>Grade</label><select onchange="pickGrade(this.value)"><option value="" ${unit.grade?"":"selected"} disabled>Choose a grade…</option>${GRADES.map(([g,a])=>`<option value="${g}" ${unit.grade===g?"selected":""}>${g} (ages ${a})</option>`).join("")}</select></div>
      <div><label>Duration</label><input type="text" value="${esc(unit.duration)}" oninput="unit.duration=this.value;saveCurrent()"></div>
      <div><label>Languages</label><input type="text" value="${esc(unit.languages)}" placeholder="English, Arabic" oninput="unit.languages=this.value;saveCurrent()"></div>
    </div>
    <div class="actions"><div class="hint">WonderNest only suggests. Your team chooses, edits and owns every part of the unit.</div>
      <button class="btn" onclick="suggestIdeas()">✨ Suggest central ideas</button></div>
  </div>`;
}

function step2(){
  const own = unit.centralIdea && !unit.centralIdeaOptions.includes(unit.centralIdea);
  return `<div class="card">
    <div class="label">Central idea for ${esc(gradeLabel(unit))} · pick one, edit it, or write your own</div>
    ${unit.centralIdeaOptions.map((c,i)=>`<button class="ci ${unit.centralIdea===c?"sel":""}" onclick="pickIdea(${i})"><div class="rb"></div><div>${esc(c)}</div></button>`).join("")}
    <div class="label" style="margin-top:16px">Your chosen central idea (you can edit it here)</div>
    <textarea id="ciText" style="min-height:70px" oninput="unit.centralIdea=this.value;saveCurrent()" placeholder="Choose an idea above or write your own">${esc(unit.centralIdea)}</textarea>
    <div class="actions">
      <button class="link" onclick="suggestIdeas()">↻ Suggest different ideas</button>
      <button class="btn" onclick="suggestInquiry()">Next: lines of inquiry →</button>
    </div>
    ${own ? `<div class="hint" style="margin-top:8px">You're using your own central idea.</div>` : ""}
  </div>`;
}

function step3(){
  const conceptOpts = c => KEY_CONCEPTS.map(k=>`<option ${c===k?"selected":""}>${k}</option>`).join("");
  return `<div class="grid2">
    <div>
      <div class="card"><div class="label">Central idea · ${esc(gradeLabel(unit))}</div><div style="font-size:16px;font-weight:700;color:var(--navy);line-height:1.45">${esc(unit.centralIdea)}</div></div>
      <div class="card">
        <div class="label">Lines of inquiry</div>
        ${unit.lines.map((l,i)=>`<div class="loi"><div class="n">${i+1}</div><textarea rows="2" oninput="unit.lines[${i}].text=this.value;saveCurrent()">${esc(l.text)}</textarea><select onchange="unit.lines[${i}].concept=this.value;saveCurrent()">${conceptOpts(l.concept)}</select><button class="link danger" title="Remove" onclick="unit.lines.splice(${i},1);saveCurrent();render()">✕</button></div>`).join("")}
        <div class="actions" style="margin-top:10px"><button class="link" onclick="unit.lines.push({text:'',concept:'Form'});saveCurrent();render()">＋ Add a line of inquiry</button><button class="link" onclick="suggestInquiry()">↻ Suggest again</button></div>
      </div>
    </div>
    <div class="card">
      <div class="label">${esc(settings.conceptLabel || "Specified concepts")}</div>
      <div class="chips">${KEY_CONCEPTS.map(k=>`<button class="chip ${unit.keyConcepts.includes(k)?"on":""}" onclick="toggle(unit.keyConcepts,'${k}');saveCurrent();render()">${k}</button>`).join("")}</div>
      <div class="label">Related concepts</div>
      <div class="chips">${unit.relatedConcepts.map((r,i)=>`<span class="chip on">${esc(r)} <button onclick="unit.relatedConcepts.splice(${i},1);saveCurrent();render()" title="Remove">✕</button></span>`).join("")}
        <button class="chip" onclick="addRelated()">＋ Add</button></div>
      <div class="label">ATL skills to develop <span style="text-transform:none;letter-spacing:0">(${unit.atl.length} chosen)</span></div>
      ${Object.entries(ATL).map(([cat,skills])=>`<div class="atl-group"><h4>${cat}</h4><div class="chips">${skills.map(s=>{const k=cat+" · "+s;return `<button class="chip atl ${unit.atl.includes(k)?"on":""}" onclick="toggle(unit.atl,'${k}');saveCurrent();render()">${s}</button>`}).join("")}</div>
        ${unit.atl.filter(a=>a.startsWith(cat+" ·") && unit.atlWhy[a]).map(a=>`<div class="why">💡 <b>${esc(a.split(" · ")[1])}:</b> ${esc(unit.atlWhy[a])}</div>`).join("")}</div>`).join("")}
      <div class="label" style="margin-top:6px">Learner profile</div>
      <div class="chips">${LEARNER_PROFILE.map(l=>`<button class="chip lp ${unit.learnerProfile.includes(l)?"on":""}" onclick="toggle(unit.learnerProfile,'${l}');saveCurrent();render()">${l}</button>`).join("")}</div>
      <div class="actions"><span></span><button class="btn" onclick="goStep(4)">Next: SDGs →</button></div>
    </div>
  </div>`;
}

function step4(){
  const chosen = SDGS.filter(s => unit.sdgs.includes(s[0]));
  return `<div class="card">
    <div class="label">Tap the goals this unit connects to</div>
    <div class="sdgs">${SDGS.map(([n,name,col])=>`<button class="sdg ${unit.sdgs.includes(n)?"on":""}" style="background:${col}" onclick="toggle(unit.sdgs,${n});saveCurrent();render()"><b>${n}</b>${name}</button>`).join("")}</div>
  </div>
  ${chosen.length ? `<div class="card"><div class="label">How this unit connects</div>${chosen.map(([n,name,col])=>`<div class="sdg-why"><span style="background:${col}">${n}</span><div><b>${name}</b><br><span style="color:var(--muted)">${esc(unit.sdgWhy[n] || "Chosen by your team.")}</span></div></div>`).join("")}</div>` : ""}
  <div class="actions"><span class="hint">Suggested goals are already selected. Add or remove any.</span><button class="btn" onclick="suggestResources()">Next: stories & routines →</button></div>`;
}

function step5(){
  const s = unit.story;
  return `<div class="grid3">
    <div>
      <div class="card"><div class="label">📚 Books for this unit</div>
        ${unit.books.map(bookHTML).join("")}
        <div class="hint" style="margin-top:8px">Links search Open Library, Google Books and WorldCat (libraries near you). "Read online" appears when Open Library has a free digital copy to borrow (a free Open Library account is needed). Please check each title with your librarian before ordering.</div>
      </div>
      ${s ? `<div class="story"><div class="label">✨ Original WonderNest story</div><h3>${esc(s.title)}</h3><p>${esc(s.text)}</p>${s.textSecond?`<p class="ar">${esc(s.textSecond)}</p>`:""}</div>` : ""}
      ${unit.spark ? `<div class="spark">✍️ Story spark for children: ${esc(unit.spark)}</div>` : ""}
    </div>
    <div class="card"><div class="label">🧠 Visible thinking routines</div>
      ${unit.routines.map((r,i)=>`<div class="routine" style="border-left-color:${ROUTINE_COLOURS[i%5]}"><h4>${esc(r.name)} <span>${esc(r.when)}</span></h4><p>${esc(r.how)}</p>
        <div class="blinks"><button class="blink" onclick="rtOpen(${i})">👁 View</button><button class="blink" onclick="rtWindow(${i},true,false)">🖥️ Use online</button><button class="blink" onclick="rtWindow(${i},false,true)">🖨️ Print / PDF</button><button class="blink" onclick="rtWord(${i})">⬇️ Word</button></div></div>`).join("")}
      ${rtModal()}
    </div>
    <div class="card"><div class="label">🔍 Open inquiry provocations</div>
      ${unit.provocations.map(p=>`<div class="prov"><h4>${esc(p.title)}</h4><p>${esc(p.text)}</p></div>`).join("")}
      ${unit.atl.length ? `<div class="label" style="margin-top:14px">Builds ATL skills</div><div class="chips">${unit.atl.map(a=>`<span class="chip atl on">${esc(a.split(" · ")[1])}</span>`).join("")}</div>` : ""}
      <button class="link" onclick="suggestResources()">↻ Suggest again</button>
    </div>
  </div>`;
}

function homeView(){
  const units = store.get("wn_units", []);
  return `<div class="top"><div><div class="crumb">WonderNest</div><h1>My units</h1></div><button class="btn" onclick="startNew()">＋ New unit</button></div>
  <div class="card">${units.length ? units.map(u=>`<div class="unit-row"><div><h4>${esc(themeOf(u.theme)?.ic||"")} ${esc(u.centralIdea || "Untitled unit")}</h4><p>${esc(themeOf(u.theme)?.name||"")} · ${esc(gradeLabel(u))} · saved ${esc(u.updated||"")}${u.shared ? " · <b>shared</b>" : ""}</p></div>
    <div style="display:flex;gap:14px;flex-shrink:0"><button class="link" onclick="openUnit('${u.id}')">Open</button><button class="link danger" onclick="deleteUnit('${u.id}')">Delete</button></div></div>`).join("")
    : `<div class="empty">🐦<br><br>No saved units yet.<br>Build your first unit and click <b>Save unit</b> at the end.</div>`}</div>
  <div class="hint">Units are saved to your WonderNest account, so they appear on any device you sign in on. Units marked "shared" belong to a colleague whose class you teach.</div>`;
}

function settingsView(){
  return `<div class="top"><div><div class="crumb">WonderNest</div><h1>School settings</h1></div></div>
  <div class="card" style="max-width:640px">
    <div class="fields" style="grid-template-columns:1fr;margin:0">
      <div><label>School name</label><input type="text" id="setSchool" value="${esc(settings.school)}"></div>

let sumId = null;
function savedUnits(){ return store.get("wn_units", []); }
function sumUnit(){ return savedUnits().find(u => u.id === sumId); }
function storeUnit(u){
  const units = savedUnits(); const i = units.findIndex(x => x.id === u.id);
  if(i >= 0) units[i] = u; else units.unshift(u);
  pushUnit(u);
  return store.set("wn_units", units);
}
/* ---------- units in the cloud ---------- */
const isUuid = x => /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(String(x));
async function pushUnit(u){
  if(!db || !tc.user || !isUuid(u.id) || u.shared) return false;
  const clean = Object.assign({}, u); delete clean.shared;
  const { error: e } = await db.from("units").upsert({ id: u.id, data: clean, central_idea: u.centralIdea || "", theme: u.theme || "", grade: u.grade || "", updated_at: new Date().toISOString() });
  return !e;
}
async function syncUnits(){
  if(!db || !tc.user) return;
  const local = store.get("wn_units", []);
  local.forEach(u => { if(!isUuid(u.id)){ const n = crypto.randomUUID(); if(unit.id === u.id){ unit.id = n; saveCurrent(); } u.id = n; } });
  if(!isUuid(unit.id)){ unit.id = crypto.randomUUID(); saveCurrent(); }
  const { data, error: e } = await db.from("units").select("id, data, owner").order("updated_at", { ascending: false });
  if(e){ store.set("wn_units", local); return; }
  const ids = new Set(data.map(r => r.id));
  for(const u of local) if(!ids.has(u.id)) await pushUnit(u);
  const merged = data.map(r => Object.assign({}, r.data, { id: r.id, shared: r.owner !== tc.user.id })).concat(local.filter(u => !ids.has(u.id)));
  store.set("wn_units", merged);
  if(view === "home" || view === "classes" || view === "summative") render();
}
function makeCU(u){ const t = themeOf(u.theme) || {}; return { unitId: u.id, centralIdea: u.centralIdea, themeName: t.name || "", themeIcon: t.ic || "", grade: u.grade || "", atl: u.atl || [], storySpark: u.spark || "" }; }

function listEditor(key, arr){
  return (arr||[]).map((v,i)=>`<div class="listrow"><input type="text" value="${esc(v)}" oninput="sumList('${key}',${i},this.value)"><button class="link danger" onclick="sumDel('${key}',${i})">✕</button></div>`).join("")

let sumDraft = null;
function openSum(id){ sumId = id; error = ""; const u = sumUnit(); sumDraft = u && u.summative ? JSON.parse(JSON.stringify(u.summative)) : null; render(); }
function draft(){ const u = sumUnit(); if(!sumDraft && u && u.summative) sumDraft = JSON.parse(JSON.stringify(u.summative)); return sumDraft; }
function sumSet(k,v){ draft()[k] = v; sumAutosave(); }
function sumList(k,i,v){ draft()[k][i] = v; sumAutosave(); }
function sumCk(i,k,v){ draft().checkpoints[i][k] = v; sumAutosave(); }
function sumRub(i,j,v){ const r = draft().rubric[i]; if(j < 0) r.criterion = v; else { r.descriptors = r.descriptors || []; r.descriptors[j] = v; } sumAutosave(); }
function sumAdd(k,v){ const d = draft(); d[k] = d[k] || []; d[k].push(v); sumAutosave(); render(); }
function sumDel(k,i){ draft()[k].splice(i,1); sumAutosave(); render(); }
let sumTimer = null;
function sumAutosave(){ clearTimeout(sumTimer); sumTimer = setTimeout(() => { const u = sumUnit(); if(u && sumDraft){ u.summative = sumDraft; storeUnit(u); } }, 400); }
function sumSave(){ const u = sumUnit(); u.summative = draft(); storeUnit(u) ? toast("Task saved ✓") : toast("Could not save on this device"); }
async function sumGenerate(){
  const u = sumUnit(); if(!u) return;
  const levels = settings.rubricLevels.split(",").map(x => x.trim()).filter(Boolean);
  error = ""; loading(true, "Designing the summative task…");
  try{
    const d = await ai("summative", u, {levels, learnerProfile: u.learnerProfile, relatedConcepts: u.relatedConcepts});
    const t = {title: d.title||"", childBrief: d.childBrief||"", teacherNotes: d.teacherNotes||"", formats: d.formats||[],
      successCriteria: d.successCriteria||[], checkpoints: (d.checkpoints||[]).map(c=>({when:c.when||"", what:c.what||""})),
      levels, rubric: (d.rubric||[]).map(r=>({criterion:r.criterion||"", linkedTo:r.linkedTo||"", descriptors:(r.descriptors||[]).slice(0,levels.length)}))};
    u.summative = t; sumDraft = JSON.parse(JSON.stringify(t)); storeUnit(u);
  }catch(e){ error = e.message || "Something went wrong. Please try again."; }
  finally{ loading(false); render(); }
}

async function tAuth(){
  error = ""; tc.msg = "";
  const em = $("#em").value.trim(), pw = $("#pw") ? $("#pw").value : "";
  if(!em) { error = "Please type your email."; return render(); }
  loading(true, "One moment…");
  try{
    if(tc.mode === "signup"){
      if(pw.length < 8) throw new Error("Please choose a password with at least 8 characters.");
      const { data, error: e } = await db.auth.signUp({ email: em, password: pw, options: { emailRedirectTo: SITE_URL + "/app.html" } });
      if(e) throw e;
      if(!data.session) tc.msg = "Check your email and click the link to confirm your account, then sign in here.";
      tc.mode = "signin";
    } else if(tc.mode === "forgot"){
      const { error: e } = await db.auth.resetPasswordForEmail(em, { redirectTo: SITE_URL + "/app.html" });
      if(e) throw e; tc.msg = "If that email has an account, a reset link is on its way."; tc.mode = "signin";
    } else {
      const { error: e } = await db.auth.signInWithPassword({ email: em, password: pw });
      if(e) throw e; tc.loaded = false;

}

  const blob = new Blob(["\ufeff", h], {type:"application/msword"}); const a = document.createElement("a");

function atlModal(kid, j){ atlS.modal = {kid, skill: atlS.skills[j], level: 0}; render(); }
function atlModalHTML(){
  const m = atlS.modal, k = atlS.students.find(x => x.id === m.kid), L = atlLevels();
  const hist = atlS.records.filter(r => r.student_id === m.kid && r.skill === m.skill).slice(0, 5);
  return `<div class="modal-bg" onclick="if(event.target===this){atlS.modal=null;render()}"><div class="modal">
    <div class="label">${esc(m.skill)}</div><h3 style="color:var(--navy)">${esc(k.picture)} ${esc(k.first_name)}</h3>
    <div class="lvlbtns">${L.map((l,i)=>`<button class="lvlbtn ${m.level===i+1?"on":""}" onclick="atlS.modal.level=${i+1};render()">${esc(l)}</button>`).join("")}</div>
    <label class="hint">What did you notice? (optional)</label>
    <textarea id="atlNote" style="min-height:70px;margin-top:6px" placeholder="For example: asked 'how do we know?' and checked two sources"></textarea>
    <div class="actions"><button class="link" onclick="atlS.modal=null;render()">Cancel</button><button class="btn" ${m.level?"":"disabled"} onclick="atlSave()">Save</button></div>
    ${hist.length ? `<div class="label" style="margin-top:14px">Recent</div>${hist.map(r=>`<div class="hist">${r.source==="self"?"🧒 Self: "+SELF_FACES[Math.min(r.level,4)-1]+" ":"👩‍🏫 "}<b>${esc(r.level_label)}</b> · ${new Date(r.created_at).toLocaleDateString("en-GB")}${r.note?`<br>${esc(r.note)}`:""}</div>`).join("")}` : ""}
  </div></div>`;
}
async function atlSave(){
  const m = atlS.modal, L = atlLevels(), note = ($("#atlNote").value || "").trim().slice(0, 500);
  const row = { student_id: m.kid, class_id: atlS.cls.id, skill: m.skill, level: m.level, level_label: L[m.level-1], source: "teacher", note, unit_label: (atlS.cls.current_unit && atlS.cls.current_unit.centralIdea) || "" };
  const { error: e } = await db.from("atl_records").insert(row);
  if(e){ error = tcErr(e); atlS.modal = null; return render(); }
  atlS.records.unshift(Object.assign({ created_at: new Date().toISOString() }, row)); atlS.modal = null; toast("Saved ✓"); render();
}
function atlKidView(){
  const k = atlS.students.find(x => x.id === atlS.kid), L = atlLevels();
  const mine = atlS.records.filter(r => r.student_id === k.id);
  const skills = [...new Set([...atlS.skills, ...mine.map(r => r.skill)])];
  return `<div class="crumb" style="margin:-14px 0 16px"><button class="link" onclick="atlS.kid=null;render()">‹ Back to ${esc(atlS.cls.name)}</button></div>
  <div class="grid2"><div class="card"><div class="label">${esc(k.picture)} ${esc(k.first_name)} · ATL growth</div>
    ${skills.map(x=>{const t=latest(k.id,x,"teacher"), sf=latest(k.id,x,"self"), hist=mine.filter(r=>r.skill===x);
      return `<div style="margin-bottom:16px"><div style="display:flex;justify-content:space-between;align-items:center;gap:10px"><b style="color:var(--navy)">${esc(x)}</b>${lvlBadge(t)}</div>
        <div style="display:flex;align-items:center;gap:8px;margin:6px 0"><div class="bar"><i style="width:${t?Math.round(t.level/L.length*100):0}%;background:${t?LVL_COLOURS[(t.level-1)%10]:"#ccc"}"></i></div><span class="selfx">${sf?SELF_FACES[Math.min(sf.level,4)-1]:""}</span></div>
        ${atlS.quests.filter(q=>q.student_id===k.id && q.content && q.content.skill===x).slice(0,3).map(q=>`<div class="hist">🧩 ${q.content.type==="quiz" ? `Skill quest quiz: <b>${q.content.score}/${q.content.total}</b>` : `"${esc(q.content.starter)} ${esc(q.content.text)}"`} · ${new Date(q.created_at).toLocaleDateString("en-GB")}</div>`).join("")}
        ${hist.slice(0,4).map(r=>`<div class="hist">${r.source==="self"?"🧒 "+SELF_FACES[Math.min(r.level,4)-1]+" ":"👩‍🏫 "}<b>${esc(r.level_label)}</b> · ${new Date(r.created_at).toLocaleDateString("en-GB")}${r.note?` · ${esc(r.note)}`:""}</div>`).join("") || `<div class="hint">No evidence yet.</div>`}</div>`;}).join("")}
  </div>
  <div class="card"><div class="label">✨ Report comment (ATL / inquiry)</div>
    <p class="hint" style="margin-bottom:10px">WonderNest drafts a comment from this child's ATL evidence. The child's name is not sent to the AI. Always read and edit before using it.</p>
    <textarea id="atlComment" style="min-height:190px" placeholder="Click Draft comment">${esc(atlS.comment)}</textarea>
    <div class="actions"><button class="link" onclick="navigator.clipboard.writeText($('#atlComment').value).then(()=>toast('Copied ✓'))">📋 Copy</button><button class="btn" onclick="atlDraft()">✨ Draft comment</button></div>
  </div></div>`;
}
async function atlDraft(){
  const k = atlS.students.find(x => x.id === atlS.kid), cu = atlS.cls.current_unit || {};
  const ev = atlS.records.filter(r => r.student_id === k.id).slice(0, 40).map(r => ({ skill: r.skill, level: r.level_label, by: r.source === "self" ? "child" : "teacher", note: r.note, date: r.created_at.slice(0,10) }));
  if(!ev.length){ error = "Record some ATL evidence for this child first."; return render(); }
  error = ""; loading(true, "Drafting the comment…");
  try{
    const u = { theme:"", description:"", grade: atlS.cls.grade, centralIdea: cu.centralIdea || "", lines:[], keyConcepts:[], atl: atlS.skills };
    const d = await ai("atl_comment", u, { evidence: ev, levels: atlLevels() });
    atlS.comment = String(d.comment || "").replace(/\[Name\]/g, k.first_name);
  }catch(e){ error = e.message || "Something went wrong. Please try again."; }
  finally{ loading(false); render(); }
}

const JAR_COLOURS = ["#fff1c9","#ffe3da","#e3f1ff","#e6f7ec","#f1edff","#ffeef6","#fff6d6","#e0f7f7"];
function jarHTML(items, onSlip, opts){
  opts = opts || {};
  const shown = items.slice(0, 24);
  const slips = shown.map((p, i) => {
    const row = Math.floor(i / 3), col = i % 3;
    const jx = ((i * 53) % 17) - 8, jy = ((i * 29) % 11) - 5, rot = ((i * 37) % 34) - 17;
    const left = 14 + col * 64 + jx + (row % 2 ? 14 : 0), bottom = 10 + row * 26 + jy;
    return `<button class="wslip ${opts.newId === p.id ? "drop" : ""}" title="${esc(p.title)}" onclick="${onSlip}('${p.id}')"
      style="left:${left}px;bottom:${bottom}px;--r:${rot}deg;background:${JAR_COLOURS[i % JAR_COLOURS.length]};animation-delay:${(i % 6) * .35}s">${esc(p.emoji || "💭")}</button>`;
  }).join("");
  return `<div class="jarwrap"><div class="jar ${opts.shaking ? "shaking" : ""}" id="jar">
      <div class="lid"></div><div class="lidtop"></div><div class="neck"></div>
      <div class="glass">${slips}<div class="shine"></div>
        ${items.length ? "" : `<div class="jarempty">Empty…<br>add a wonder!</div>`}</div>
      <div class="jarlabel">${esc(opts.label || "Wonder jar")}${items.length ? ` · ${items.length}` : ""}</div>
    </div></div>`;
}
function slipCard(p, buttons){
  return `<div class="slipbg" onclick="if(event.target===this) closeSlip()"><div class="slipcard">
    <div class="slipemoji">${esc(p.emoji || "💭")}</div>
    <div class="slipkind">${p.kind === "maker" ? "🛠️ Maker challenge" : p.kind === "wonder" ? "💭 A wonder" : "✨ Provocation"}</div>
    <h3>${esc(p.title)}</h3>${p.body ? `<p>${esc(p.body)}</p>` : ""}
    <div class="slipbtns">${buttons}</div></div></div>`;
}

async function slShareTo(classId){
  const s = slFind(slShare.key); let id = s.id;
  if(s.source === "unit"){
    const existing = (sl.mine || []).find(m => m.data.fromUnit === s.unit.id);
    if(existing) id = existing.id;
    else {
      const data = { title: s.title, text: s.text, textSecond: s.textSecond, theme: s.theme, grade: s.grade, spark: s.spark, questions: [], vocabulary: [], fromUnit: s.unit.id };
      const r = await db.from("stories").insert({ data, title: s.title }).select().single();
      if(r.error){ error = tcErr(r.error); slShare.key = null; return render(); }
      id = r.data.id; sl.mine = [r.data].concat(sl.mine || []);
    }
  }
  const { error: e } = await db.from("class_stories").insert({ class_id: classId, story_id: id });
  slShare.key = null;
  if(e && !String(e.message||"").includes("duplicate")){ error = tcErr(e); return render(); }
  toast("On the class bookshelf ✓"); render();
}
async function slShelf(id){
  if(!id){ sl.shelfCls = null; sl.shelf = null; return render(); }
  sl.shelfCls = id;
  const [cs, kids, st] = await Promise.all([
    db.from("class_stories").select("story_id").eq("class_id", id),
    db.from("entries").select("*").eq("class_id", id).eq("kind", "story").order("created_at", { ascending: false }),
    db.from("students").select("id, first_name").eq("class_id", id)
  ]);
  const ids = (cs.data || []).map(x => x.story_id);
  let teacher = [];
  if(ids.length){ const r = await db.from("stories").select("*").in("id", ids); teacher = r.data || []; }
  sl.mates = st.data || []; sl.shelf = { teacher, kids: (kids.data || []).filter(e => e.publish && e.publish !== "none") };
  if(cs.error || kids.error) error = tcErr(cs.error || kids.error);
  render();
}
async function slPublish(entryId, state){
  const { error: e } = await db.from("entries").update({ publish: state }).eq("id", entryId);
  if(e){ error = tcErr(e); return render(); } toast(state === "approved" ? "Published on the bookshelf ✓" : "Updated ✓"); slShelf(sl.shelfCls);
}
async function slUnshare(storyId){
  const { error: e } = await db.from("class_stories").delete().eq("class_id", sl.shelfCls).eq("story_id", storyId);
  if(e){ error = tcErr(e); return render(); } slShelf(sl.shelfCls);
}

function goStep(s){ unit.step = s; error = ""; saveCurrent(); render(); }
function pickGrade(g){ unit.grade = g; unit.ageBand = (GRADES.find(x=>x[0]===g)||["",""])[1]; saveCurrent(); }
function pickTheme(id){ unit.theme = id; saveCurrent(); render(); }
function pickIdea(i){ unit.centralIdea = unit.centralIdeaOptions[i]; saveCurrent(); render(); }
function addRelated(){ const v = prompt("Add a related concept"); if(v && v.trim()){ unit.relatedConcepts.push(v.trim()); saveCurrent(); render(); } }

function suggestIdeas(){
  if(!unit.theme){ error = "Please choose a transdisciplinary theme first."; return render(); }
  if(!unit.grade){ error = "Please choose the grade, so the central idea fits the children's age."; return render(); }
  run("central_ideas", "Writing central ideas…", d => {
    unit.centralIdeaOptions = (d.centralIdeas || []).slice(0,5);
    if(!unit.centralIdeaOptions.includes(unit.centralIdea)) unit.centralIdea = unit.centralIdeaOptions[0] || "";
    unit.step = 2;
  });
}
function suggestInquiry(){
  if(!unit.centralIdea.trim()){ error = "Please choose or write a central idea first."; return render(); }
  run("inquiry", "Building lines of inquiry…", d => {
    unit.lines = (d.lines || []).map(l => ({text:l.text, concept: KEY_CONCEPTS.find(k => k.toLowerCase() === String(l.concept||"").toLowerCase()) || "Form"}));
    unit.keyConcepts = (d.keyConcepts || []).map(k => KEY_CONCEPTS.find(x => x.toLowerCase() === String(k).toLowerCase())).filter(Boolean);
    unit.relatedConcepts = d.relatedConcepts || [];
    unit.atl = []; unit.atlWhy = {};
    (d.atl || []).forEach(a => {
      const cat = Object.keys(ATL).find(c => c.toLowerCase() === String(a.category||"").toLowerCase());
      const skill = cat && ATL[cat].find(s => s.toLowerCase() === String(a.skill||"").toLowerCase());
      if(skill){ const k = cat + " · " + skill; unit.atl.push(k); unit.atlWhy[k] = a.why || ""; }
    });
    unit.learnerProfile = (d.learnerProfile || []).map(l => LEARNER_PROFILE.find(x => x.toLowerCase() === String(l).toLowerCase())).filter(Boolean);
    unit.sdgs = []; unit.sdgWhy = {};
    (d.sdgs || []).forEach(s => { const n = Number(s.number); if(n>=1 && n<=17){ unit.sdgs.push(n); unit.sdgWhy[n] = s.why || ""; } });
    unit.step = 3;
  });
}
function suggestResources(){
  run("resources", "Finding stories and routines…", d => {
    unit.books = d.books || []; unit.story = d.story || null; unit.spark = d.spark || "";
    unit.routines = d.routines || []; unit.provocations = d.provocations || [];
    unit.step = 5;
  });
}
