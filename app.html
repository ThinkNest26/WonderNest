const WHY = {
  step1: ["Why start with a theme?", "The six transdisciplinary themes are the organisers of the whole programme of inquiry. Each unit sits under one theme so that, across a year, children explore ideas that matter beyond any one subject. Read the theme description with your team and ask: what does this theme mean for children of this age?"],
  step2: ["What makes a strong central idea?", "A central idea is a big, true understanding children build over the unit. It is conceptual (about relationships, not a topic), transferable (it applies beyond this one context), open to different perspectives, and written so children can understand it. It is a statement, not a question, and it is not a fact to memorise."],
  step3: ["Why lines of inquiry and concepts?", "Lines of inquiry break the central idea into 3 or 4 parts to explore. Each line is driven by a specified concept, which gives it a lens (for example Causation asks Why?). Related concepts come from the subjects and deepen understanding. Together they move children from facts to the big idea."],
  step4: ["Why connect to the SDGs?", "The Sustainable Development Goals help children see that their learning connects to real issues in the world. This builds international-mindedness and gives meaningful reasons for action. Choose goals that genuinely connect; one or two strong links are better than many weak ones."],
  step5: ["Why stories, routines and provocations?", "Stories open windows onto other lives and perspectives. Thinking routines make children's thinking visible so you can respond to it. Provocations spark children's own questions, which is where agency in inquiry begins."],
  step6: ["Why plan and reflect like this?", "The IB planning process is collaborative and ongoing. Learning goals and success criteria make the purpose clear to children. Teacher and student questions drive the inquiry. Formative assessment lets you adjust as you go. Reflections before, during and after the unit improve the next unit and the whole programme."],
  concepts: ["Why concepts?", "Concepts are the big ideas that connect subjects and help children transfer understanding to new situations. Teaching through concepts moves learning beyond knowing facts to understanding why and how."],
  atl: ["Why ATL skills?", "Approaches to learning are the skills children need to learn how to learn: thinking, research, communication, social and self-management. They are taught explicitly, practised in context and assessed over time, with children reflecting on their own growth."],
  summative: ["How should summative assessment work in the PYP?", "A summative task lets children show their understanding of the central idea in a way they choose. Share the success criteria with children at the start, ideally written together, so they know what success looks like. Children assess themselves and each other as well as being assessed by you."],
  exh: ["What is the PYP Exhibition?", "The exhibition is the culminating experience of the PYP. Children inquire collaboratively into a real issue they care about, guided by mentors, take action and share their learning with the community. It shows their agency and everything they have learned across the programme."],

function prText(v){ return Array.isArray(v) ? v.map(x => typeof x === "string" ? x : Object.values(x||{}).join(" ")).filter(Boolean).join("\n") : String(v || ""); }
async function prInspire(k){
  const p = planObj();
  if(!(unit.centralIdea||"").trim()) return toast("Choose a central idea first");
  const fresh = !unit.prIdeas || (k && (unit.prUsed||{})[k]);
  if(fresh){
    loading(true, k ? "Finding ideas…" : "Filling the empty boxes…");
    try{
      unit.prIdeas = await ai("plan_reflect", unit, {
        linesFull: (unit.lines||[]).map((l,i) => `Line ${i+1} (${l.concept}): ${l.text}`),
        learnerProfile: unit.learnerProfile || [], sdgs: (unit.sdgs||[]).map(n => "SDG " + n),
        subjects: (unit.subjects||[]).map(s => s.subject + ": " + (s.topics||"").slice(0, 200)),
        already: Object.fromEntries(PR_AI.map(f => [f, (p[f]||"").slice(0, 400)])) });
      unit.prUsed = {};
    }catch(e){ error = /unknown task/i.test(e.message||"") ? "These ideas need a small update to the WonderNest AI. Please ask your WonderNest administrator to update the AI worker." : e.message; loading(false); return render(); }
    loading(false);
  }
  const put = f => { const t = prText(unit.prIdeas[f]).trim(); if(!t) return false;
    const cur = (p[f]||"").trim(); const add = t.split("\n").filter(l => l.trim() && !cur.toLowerCase().includes(l.trim().toLowerCase())).join("\n");
    if(!add) return false; p[f] = cur ? cur + "\n" + add : add; unit.prUsed = unit.prUsed || {}; unit.prUsed[f] = true; return true; };
  let n = 0;
  if(k) n = put(k) ? 1 : 0; else PR_AI.forEach(f => { if(!(p[f]||"").trim() && put(f)) n++; });
  saveCurrent(); render();
  toast(n ? (k ? "Ideas added ✓ Edit them as you like" : n + " boxes filled ✓ Edit anything you like") : (k ? "No new ideas this time. Tap again for more." : "All the boxes already have writing"));
}
async function loadClassWonders(){

  if(!mine.length){ wonderS.list = []; return render(); }
  const { data } = await db.from("entries").select("content, class_id, created_at").in("class_id", mine.map(c => c.id)).eq("kind", "wonder").order("created_at", { ascending: false }).limit(80);
  wonderS.list = (data || []).map(e => ({ text: e.content.text || "", who: (mine.find(c => c.id === e.class_id) || {}).name || "" })).filter(w => w.text);
  render();
}

}

const tm = { open: false, row: null, members: [], comments: [], versions: [], conflict: null };
pushUnit = async function(u){
  if(!db || !tc.user || !isUuid(u.id)) return false;
  const clean = Object.assign({}, u); delete clean.shared; delete clean._v; delete clean.canEdit;
  const r = await db.from("units").select("version, updated_by, owner").eq("id", u.id);
  const row = (r.data || [])[0];
  if(row && u._v && row.version && row.version > u._v && row.updated_by && row.updated_by !== tc.user.id){ tm.conflict = { remote: row }; render(); return false; }
  const payload = { data: clean, central_idea: u.centralIdea || "", theme: u.theme || "", grade: u.grade || "", in_poi: !!u.inPoi, updated_at: new Date().toISOString() };
  const res = row ? await db.from("units").update(payload).eq("id", u.id) : await db.from("units").insert(Object.assign({ id: u.id }, payload));
  if(res.error) return false;
  const v = await db.from("units").select("version").eq("id", u.id); const nv = ((v.data || [])[0] || {}).version;
  if(nv){ u._v = nv; if(unit.id === u.id){ unit._v = nv; saveCurrent(); } }
  return true;
};
const _openUnit = openUnit;
openUnit = async function(id){
  if(db && tc.user && isUuid(id)){
    const { data } = await db.from("units").select("id, data, owner, version, collaborators").eq("id", id);
    const r = (data || [])[0];
    if(r){ const u = Object.assign({}, r.data, { id: r.id, _v: r.version, shared: r.owner !== tc.user.id, canEdit: r.owner === tc.user.id || (r.collaborators || []).includes(tc.user.id) });
      const all = store.get("wn_units", []).filter(x => x.id !== id); all.unshift(u); store.set("wn_units", all); }
  }
  _openUnit(id);
};

function tdWeb(){
  const subs = unit.subjects, n = subs.length, W = 760, H = 420, cx = W/2, cy = H/2, R = 165, cols = ["#2f6fd6","#3bb07a","#ff7a59","#8a6cf0","#f59e0b","#0ea5e9","#be123c","#0f766e","#b45309","#6b4fd8","#c5192d","#19486a"];

    ${nodes.map(p=>`<g><rect x="${p.x-88}" y="${p.y-36}" width="176" height="72" rx="14" fill="#fff" stroke="${p.c}" stroke-width="2.5"/><text x="${p.x}" y="${p.y-14}" text-anchor="middle" fill="${p.c}" font-size="13.5" font-weight="800">${esc(p.s.subject)}${p.s.related?" · "+esc(p.s.related):""}</text>${wrap(p.s.topics||"Add the focus", 30).slice(0,2).map((l,i)=>`<text x="${p.x}" y="${p.y+4+i*15}" text-anchor="middle" fill="#475467" font-size="11.5">${esc(l)}</text>`).join("")}</g>`).join("")}

const CYCLE = [["Tuning in","🎵"],["Finding out","🔍"],["Sorting out","🧩"],["Going further","🚀"],["Making connections","🔗"],["Taking action","🌱"]];

function weeksObj(){
  const n = Math.max(1, Math.min(12, parseInt(String(unit.duration).match(/\d+/) || [6], 10)));
  unit.weeks = unit.weeks || [];
  while(unit.weeks.length < n) unit.weeks.push({ line: "", focus: "", cells: {} });
  if(unit.weeks.length > n) unit.weeks.length = n;
  unit.weeks.forEach(w => { w.cells = w.cells || {}; w.tags = w.tags || {}; w.subj = w.subj || {}; });
  const L = (unit.lines||[]).length;

function slotOptions(i){

function wkTag(i, ph, s){ const t = unit.weeks[i].tags[ph] = unit.weeks[i].tags[ph] || []; const k = t.indexOf(s); if(k >= 0) t.splice(k, 1); else t.push(s); saveCurrent(); render(); }

/* ---------- hide everything that needs children's own logins ---------- */
sumVoicesCard = () => "";
function teacherOnly(m){
  m.querySelectorAll('[onclick*="openAssign("],[onclick*="slShareStart("],[onclick*="rtPick("],[onclick*="cnS.tab=\'tracker\'"],[onclick*="cnS.tab=\'sorts\'"],[onclick*="sl.tab=\'shelf\'"],[onclick*="goView(\'classes\')"],[onclick*="goView(\'attention\')"],[onclick*="goView(\'inquiry\')"],[onclick*="goView(\'atl\')"],[onclick*="goView(\'progress\')"]').forEach(b => b.remove());
  m.querySelectorAll(".label").forEach(l => { if(/Pin for a class|Share with a class/.test(l.textContent)){ const c = l.closest(".card"); if(c) c.remove(); } });
  m.querySelectorAll(".hint").forEach(h => { if(/📌 Use with a class/.test(h.innerHTML)) h.remove(); });
}
const _renderT = render;
render = function(){
  if(HIDDEN_VIEWS.includes(view) && tc.user && tc.mode !== "newpass") view = "week";
  if(view === "concepts" && ["tracker","sorts"].includes(cnS.tab)) cnS.tab = "guide";
  if(view === "stories" && sl.tab === "shelf") sl.tab = "library";
  _renderT();
  const m = $("#main"); if(m) try{ teacherOnly(m); }catch(e){}
  if(m && npS.open && poiAllUnits().length) m.insertAdjacentHTML("beforeend", npModal());
};

/* ---------- sidebar: This week first ---------- */

  const side = document.querySelector(".side");
  const hub = document.createElement("button"); hub.className = "nav"; hub.dataset.view = "week"; hub.textContent = "🏠 This week";
  side.insertBefore(hub, side.querySelector(".navg"));
  hub.addEventListener("click", () => { view = "week"; error = ""; hbS.classes = null; render(); });
})();
setTimeout(() => { if(tc.user && view === "builder" && !unit.centralIdea){ view = "week"; render(); } }, 1800);
